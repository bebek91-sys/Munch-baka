name: VORQEN Munch | BakaSU + SUSFS 2.4.0 + NoMount 2.3.1
# Nama yang tampil di tab Actions dan daftar workflow (hanya label, tidak mempengaruhi build).
# run-name = judul tiap run, memuat commit BakaSU yang dipakai saat Run workflow.
run-name: VORQEN Munch - BakaSU ${{ inputs.ksu_ref || 'cac1e793' }}

# Basis: liyafe1997/kernel_xiaomi_sm8250_mod (branch android15-lineage22-mod), varian MIUI/HyperOS.
# Resep build mengikuti build.sh tree tersebut (defconfig munch_defconfig, flag MIUI, patch dts panel).
# Varian AOSP TIDAK dipakai: di HyperOS driver display-nya beda dan layar jadi hitam.
#
# Root: BakaSU (Baka-SU/BakaSU), dipasang dengan resep yang sama dengan build whyred:
#   - clone PENUH (bukan setup.sh) + checkout ref (commit/tag/branch); ksu_ref kosong = ujung branch bawaan
#   - gerbang fix SELinux: commit "fix detection point caused by susfs skip commits" (AlexLiuDev233) harus ada
#     di riwayat ref yang dipakai (SUSFS melewati update latest_granting upstream; tanpa fix ini, /sys/fs/selinux/access
#     di build SUSFS bisa terdeteksi dirty-sepolicy)
#   - hook: BakaSU built-in "SUSFS Inline Hook" (CONFIG_KSU_SUSFS sebagai pilihan hook, bukan manual/tracepoint);
#     hook ksu_handle_* dipasang oleh skrip Jack (susfs_inline_hook_patches.sh, sudah di-clone step SUSFS kernel-side)
#   - SUSFS sisi-KernelSU: SUDAH bawaan BakaSU (kernel/Kconfig, feature/sucompat.c, feature/selinux_hide/*), TIDAK
#     perlu lagi patch eksternal (patch 10/11 xxKSU/tiann dibuang)
#   - selinux_hide BakaSU: fallback implementasi sendiri (my_write_context/my_write_access/my_setprocattr) untuk
#     kernel tanpa anchor susfs (patch Jack 4.19 ini termasuk), diverifikasi di step "Diagnosis SELinux/DirtySepolicy"
#   Rilis ini butuh manager BakaSU v4.2.0-rc3: pakai APK dari rilis yang sama (cek versionCode via input ksu_version_code).
#   Kode versi driver (KSU_VERSION) disamakan dengan versionCode manager lewat ksu_sync_version (default aktif).
# NoMount: v2.3.1 (maxsteeel), built-in (protokol wire v23, sama dengan v2.3.0 -> driver & modul v2.3.0/v2.3.1 saling
#   kompatibel, tapi disarankan update bersamaan). Pasang juga metamodule NoMount v2.3.1 lewat manager setelah flash.
# SUSFS bersifat opsional lewat input susfs_enable. 10 opsi SUSFS (SUS_PATH, SUS_MOUNT, SUS_KSTAT, SPOOF_UNAME, ENABLE_LOG,
#   HIDE_KSU_SUSFS_SYMBOLS, SPOOF_CMDLINE_OR_BOOTCONFIG, OPEN_REDIRECT, SUS_MAP, PRIORITY_UID_FILTER) sama dengan build whyred;
#   opsi ke-10 (filter uid prioritas, CMD 0x60030) native di patch Jack >= 38bbbd5, matikan lewat input susfs_priority_uid_filter.
# fgetpriority (aerath-stuff): menyaring sys_getpriority/setpriority/ioprio_get/ioprio_set untuk UID aplikasi lain.
#   Dibangun BUILT-IN (drivers/fgetpriority, CONFIG_FGETPRIORITY=y, find_user() noinline), sama dengan build whyred; tidak ada modul .ko.
#   Matikan lewat input fgetpriority.

on:
  workflow_dispatch:
    inputs:
      toolchain:
        description: "Toolchain: proton (bawaan tree), zyc (default, ZyCromerZ Clang 16.0.6), both (dua-duanya paralel)"
        type: choice
        options: [proton, zyc, both]
        default: zyc
      ksu_ref:
        description: "Hash commit / tag / branch BakaSU (Baka-SU/BakaSU). Default = cac1e79355ef (#674, sama dengan APK manager v4.2.0-rc3 / 35286). KOSONG = commit terbaru branch bawaan."
        type: string
        default: "cac1e79355ef451539f5c5ba9dc2bda1c64069de"
      ksu_require_selinux_fix:
        description: "Hentikan build bila commit 'fix detection point caused by susfs skip commits' (fix SELinux BakaSU) tidak ada di riwayat ref yang dipakai."
        type: boolean
        default: true
      ksu_sync_version:
        description: "Samakan angka versi driver (KSU_VERSION) dengan ksu_version_code (versionCode manager)."
        type: boolean
        default: true
      ksu_version_code:
        description: "versionCode manager BakaSU yang dipakai. Default 35286 = APK BakaSU_v4_2_0-rc3_35286."
        type: string
        default: "35286"
      build_user:
        description: "Nama pembuat yang tampil di /proc/version dan uname -v (bagian sebelum @). Default kurosakiJin."
        type: string
        default: "kurosakiJin"
      build_host:
        description: "Nama host yang tampil di /proc/version dan uname -v (bagian sesudah @). Default bankai. Pakai huruf kecil, angka, titik, atau tanda hubung, tanpa spasi."
        type: string
        default: "bankai"
      susfs_enable:
        description: "Pasang SUSFS (patch kernel 4.19 v2.4.0 + sisi BakaSU bawaan, tanpa patch eksternal). Matikan untuk build tanpa SUSFS."
        type: boolean
        default: true
      susfs_priority_uid_filter:
        description: "Nyalakan CONFIG_KSU_SUSFS_PRIORITY_UID_FILTER (filter uid pada getpriority/setpriority/ioprio, dipakai fitur hide_third_party_apps BRENE, CMD 0x60030). Default AKTIF. Matikan bila ingin tanpa hook di sys.c/ioprio.c."
        type: boolean
        default: true
      debug_fs:
        description: "Nyalakan CONFIG_DEBUG_FS (DEFAULT mati sesuai resep MIUI tree; tidak dibutuhkan KernelSU kprobes)"
        type: boolean
        default: false
      fgetpriority:
        description: "Bangun fgetpriority (aerath-stuff) sebagai BUILT-IN di kernel (menyaring getpriority/setpriority/ioprio untuk UID aplikasi lain). Default AKTIF. Tidak ada modul .ko lagi."
        type: boolean
        default: true
      fgetpriority_ref:
        description: "Commit/tag fgetpriority. Kosong = commit yang di-pin di workflow (be4ea47f)."
        type: string
        default: ""

permissions:
  contents: write   # dibutuhkan untuk membuat GitHub Release

env:
  ARCH: arm64
  SUBARCH: arm64
  KBUILD_BUILD_USER: ${{ inputs.build_user || 'kurosakiJin' }}
  KBUILD_BUILD_HOST: ${{ inputs.build_host || 'bankai' }}
  TZ: Asia/Jakarta
  NOMOUNT_VERSION: v2.3.1
  KERNEL_REPO: https://github.com/liyafe1997/kernel_xiaomi_sm8250_mod
  KERNEL_BRANCH: android15-lineage22-mod
  DEVICE: munch
  # proton = proton-clang 20210522 (bawaan build.sh tree). zyc = ZyCromerZ Clang 16.0.6 (uji).
  # Nama file asset zyc dicari otomatis lewat GitHub API: https://github.com/ZyCromerZ/Clang/releases
  ZYC_TAG: "16.0.6-20260807-release"
  # Tampilan versi kernel: 4.19.352-vorqen (label kosmetik; source asli 4.19.325)
  KERNEL_SUBLEVEL: "352"
  KERNEL_LOCALVERSION: "-vorqen"

  # --- BakaSU (Baka-SU/BakaSU), clone penuh + checkout ref; ksu_ref kosong = commit terbaru branch bawaan ---
  KSU_REPO: https://github.com/Baka-SU/BakaSU
  KSU_REF: ${{ inputs.ksu_ref || 'cac1e79355ef451539f5c5ba9dc2bda1c64069de' }}
  KSU_REQUIRE_SELINUX_FIX: ${{ inputs.ksu_require_selinux_fix == false && 'false' || 'true' }}
  KSU_SELINUX_FIX_SUBJECT: "fix detection point caused by susfs skip commits"
  KSU_SYNC_VERSION: ${{ inputs.ksu_sync_version == false && 'false' || 'true' }}
  KSU_VERSION_CODE: ${{ inputs.ksu_version_code || '35286' }}
  KSU_MANAGER_PKG: com.resukisu.resukisu
  KSU_MANAGER_CERT_SIZE: "0x377"
  KSU_MANAGER_CERT_SHA256: "d3469712b6214462764a1d8d3e5cbe1d6819a0b629791b9f4101867821f1df64"
  KSU_STEALTH: "true"
  DEBUG_FS_ON: ${{ inputs.debug_fs == true && 'true' || 'false' }}

  # fgetpriority (aerath-stuff), BUILT-IN (drivers/fgetpriority, folder kernel/ di branch default). FGP_REF = commit yang di-pin; kosongkan untuk ujung branch.
  FGP_ENABLE: ${{ inputs.fgetpriority == false && 'false' || 'true' }}
  FGP_REPO: https://github.com/aerath-stuff/fgetpriority
  FGP_REF: ${{ inputs.fgetpriority_ref || 'be4ea47fa651c80a068e477d5a3627270b7bd683' }}
  # SELinux enforcing bersih: matikan jalur SELinux disabled/boot-param.
  SELINUX_HARDEN: "true"
  # "false" = aturan sepolicy driver dipakai apa adanya (standar KernelSU: hanya domain su yang permissive).
  KSU_SEPOLICY_NO_PERMISSIVE: "false"

  # SUSFS: patch sisi kernel 4.19 v2.4.0 (non-GKI / de-inlined, NonGKI_Kernel_Build_2nd). Sisi KernelSU SUDAH bawaan
  # BakaSU (tidak ada lagi step "Setup SUSFS sisi KernelSU" seperti build xxKSU).
  SUSFS_ENABLE: ${{ inputs.susfs_enable == false && 'false' || 'true' }}
  SUSFS_PATCH_REPO: https://github.com/JackA1ltman/NonGKI_Kernel_Build_2nd
  # Patch kernel 4.19 v2.4.0 di-pin ke commit 4b0766b (Patches/Patch/susfs_patch_to_4.19.patch, repo Jack).
  # Kosongkan SUSFS_PATCH_COMMIT untuk memakai ujung (HEAD) repo Jack. Filter prioritas native sudah ada sejak 38bbbd5.
  SUSFS_PATCH_COMMIT: 4b0766bdf5d568b695dfbb19994788f14c636f2b
  # sha256 patch v2.4.0 yang kamu unggah (susfs_patch_to_4_19__2_.patch). Beda = hanya peringatan (patch Jack berubah lagi).
  SUSFS_PATCH_SHA256_EXPECT: "eee7b1bbab41d97b3d16ffb432a3efd159aba32577154685a2f9a5ba597288b4"
  SUSFS_PATCH_PATH: Patches/Patch/susfs_patch_to_4.19.patch
  # Skrip hook inline Jack (dipasang setelah patch kernel-side di atas), repo & path sama (satu clone dipakai bersama).
  SUSFS_INLINE_HOOK_PATH: Patches/susfs_inline_hook_patches.sh
  # Opsi SUSFS (10) yang diperiksa ada di Kconfig BakaSU (tanpa prefix CONFIG_), dipakai step "Pastikan SUSFS bawaan BakaSU lengkap".
  SUSFS_OPTS: "KSU_SUSFS KSU_SUSFS_SUS_PATH KSU_SUSFS_SUS_MOUNT KSU_SUSFS_SUS_KSTAT KSU_SUSFS_SPOOF_UNAME KSU_SUSFS_ENABLE_LOG KSU_SUSFS_HIDE_KSU_SUSFS_SYMBOLS KSU_SUSFS_SPOOF_CMDLINE_OR_BOOTCONFIG KSU_SUSFS_OPEN_REDIRECT KSU_SUSFS_SUS_MAP KSU_SUSFS_PRIORITY_UID_FILTER"
  # Tree sudah membawa SUSFS lama (v1.5.7: fs/susfs.c, sus_su.c) yang bentrok dengan v2.x. Dibuang lewat git revert.
  # Tetap dijalankan walau SUSFS baru dimatikan (jalur terbukti).
  SUSFS_REMOVE_LEGACY: "true"
  # Log kernel SUSFS (CONFIG_KSU_SUSFS_ENABLE_LOG) DINYALAKAN: SUSFS menulis log ke dmesg (`dmesg | grep -i susfs`).
  # Catatan: log ikut jalan di jalur hot (stat/open/mount/maps) dan sebelumnya dimatikan karena memicu stutter di game.
  # Kalau stutter muncul lagi, kembalikan ke "false".
  SUSFS_KERNEL_LOG: "true"
  # Filter uid prioritas (patch Jack + guard Kconfig ala susfs4ksu upstream) = opsi SUSFS ke-10. Bisa dimatikan lewat input susfs_priority_uid_filter.
  SUSFS_PRIORITY_UID_FILTER: ${{ inputs.susfs_priority_uid_filter == false && 'false' || 'true' }}

  # Jaringan (5G + WiFi): TCP bbr, power-save cfg80211 mati, opsi netfilter tambahan.
  NET_TUNE: "true"
  # IPC_LOGGING dimatikan demi RAM. Set "false" bila 5G/WiFi putus-putus dan perlu log Qualcomm.
  IPC_LOGGING_OFF: "true"
  # Default MM: swappiness 60 (default upstream) dan lru_gen min_ttl 1000 ms (rekomendasi upstream untuk beban interaktif).
  # Hanya mengubah bila polanya ditemukan di source; tidak ketemu = dilewati dengan peringatan.
  MM_TUNE: "true"
  MM_TUNE_SWAPPINESS: "60"
  MM_TUNE_LRU_GEN_MIN_TTL_MS: "1000"
  # Governor CPU default saat boot = schedutil (kebersihan saja; power-HAL menimpanya setelah boot).
  # Tabel OPP CPU/GPU dan governor GPU SENGAJA tidak disentuh (butuh profiling di perangkat).
  CPU_GOV_DEFAULT_SCHEDUTIL: "true"

jobs:
  build:
    runs-on: ubuntu-22.04   # proton-clang 2021 + host gcc 11: sama dengan lingkungan resep build.sh tree
    strategy:
      fail-fast: false
      matrix:
        toolchain: ${{ fromJSON(inputs.toolchain == 'both' && '["proton","zyc"]' || format('["{0}"]', inputs.toolchain)) }}
    env:
      TOOLCHAIN: ${{ matrix.toolchain }}
    steps:
      - name: Cleanup disk
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf /opt/hostedtoolcache/CodeQL
          df -h

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential git curl wget bison flex zip unzip bc cpio rsync \
            libssl-dev libelf-dev lz4 zstd libarchive-tools patchelf python-is-python3 \
            binutils-aarch64-linux-gnu binutils-arm-linux-gnueabi
          python --version

      - name: Setup toolchain (proton-clang 20210522 bawaan tree)
        if: matrix.toolchain == 'proton'
        run: |
          set -eo pipefail
          mkdir -p "$HOME/proton-clang"
          cd "$HOME/proton-clang"
          wget -q https://github.com/kdrag0n/proton-clang/archive/refs/tags/20210522.zip
          unzip -q 20210522.zip
          rm -f 20210522.zip
          TC="$HOME/proton-clang/proton-clang-20210522/bin"
          test -x "$TC/clang" || { echo "::error::clang tidak ditemukan di $TC"; exit 1; }
          echo "$TC" >> "$GITHUB_PATH"
          export PATH="$TC:$PATH"
          clang --version | head -1
          for t in aarch64-linux-gnu-ld arm-linux-gnueabi-ld; do
            if command -v "$t" >/dev/null 2>&1; then "$t" --version | head -1
            else echo "::warning::$t tidak ada di toolchain ini (dipasang dari paket binutils-* apt)"; fi
          done

      - name: Setup toolchain (ZyCromerZ Clang 16.0.6)
        if: matrix.toolchain == 'zyc'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eo pipefail
          mkdir -p "$HOME/zyc-clang"
          cd "$HOME/zyc-clang"
          echo "== Asset rilis ${ZYC_TAG} =="
          gh api "repos/ZyCromerZ/Clang/releases/tags/${ZYC_TAG}" --jq '.assets[].name'
          ASSET="$(gh api "repos/ZyCromerZ/Clang/releases/tags/${ZYC_TAG}" --jq '.assets[].name' | grep -E '^Clang-.*\.tar\.(gz|xz|zst)$' | head -1 || true)"
          if [ -z "$ASSET" ]; then
            echo "::error::Tidak ada asset Clang-*.tar.* di rilis ${ZYC_TAG} (lihat daftar di atas)"
            exit 1
          fi
          echo "Mengunduh: $ASSET"
          gh release download "$ZYC_TAG" --repo ZyCromerZ/Clang --pattern "$ASSET"
          mkdir -p extracted
          tar -xf "$ASSET" -C extracted
          rm -f "$ASSET"
          CLANG_BIN="$(find extracted -maxdepth 3 \( -type f -o -type l \) -name clang -path '*/bin/clang' | head -1 || true)"
          test -n "$CLANG_BIN" || { echo "::error::bin/clang tidak ditemukan setelah ekstrak"; ls extracted; exit 1; }
          TC="$(cd "$(dirname "$CLANG_BIN")" && pwd)"
          echo "$TC" >> "$GITHUB_PATH"
          export PATH="$TC:$PATH"
          clang --version | head -1
          for t in aarch64-linux-gnu-ld arm-linux-gnueabi-ld ld.lld llvm-ar; do
            if command -v "$t" >/dev/null 2>&1; then "$t" --version | head -1
            else echo "::warning::$t tidak ada di PATH"; fi
          done

      - name: Clone kernel source
        run: |
          set -eo pipefail
          git clone --depth=1 -b "$KERNEL_BRANCH" "$KERNEL_REPO" kernel_source
          git -C kernel_source log -1 --format='Source: %h %s'
          grep -E '^(VERSION|PATCHLEVEL|SUBLEVEL) ' kernel_source/Makefile
          test -f "kernel_source/arch/arm64/configs/${DEVICE}_defconfig"
          test -d kernel_source/techpack/display

      - name: Buang SUSFS lama bawaan tree (jika ada)
        if: env.SUSFS_REMOVE_LEGACY == 'true'
        working-directory: kernel_source
        run: |
          set -eo pipefail
          if [ ! -f fs/susfs.c ]; then
            echo "Tree tidak membawa SUSFS lama, tidak ada yang dibuang"
            exit 0
          fi
          echo "== SUSFS lama terdeteksi di tree =="
          ls fs/susfs.c fs/sus_su.c include/linux/susfs*.h include/linux/sus_su*.h 2>/dev/null || true
          git fetch -q --unshallow 2>/dev/null || git fetch -q --depth=100000
          PATHS="fs/susfs.c include/linux/susfs.h include/linux/susfs_def.h fs/sus_su.c include/linux/sus_su.h"
          COMMITS="$(git log --no-merges --format=%H -- $PATHS)"
          echo "== Commit yang menyentuh file SUSFS (terbaru -> terlama) =="
          git log --no-merges --format='%h %ad %s' --date=short -- $PATHS
          if [ -z "$COMMITS" ]; then
            echo "::error::Tidak ada commit yang bisa di-revert. Pakai tree/commit tanpa SUSFS, atau buang manual."
            exit 1
          fi
          git config user.name ci
          git config user.email ci@local
          for c in $COMMITS; do
            if ! git revert --no-commit "$c"; then
              CONFLICTS="$(git diff --name-only --diff-filter=U)"
              echo "== Konflik saat revert $c =="
              echo "$CONFLICTS"
              # Konflik di drivers/Kconfig & drivers/Makefile aman: pakai versi tree saat ini
              # (step Setup KernelSU menambahkan entri kernelsu lagi secara idempotent).
              BAD="$(echo "$CONFLICTS" | grep -v -E '^drivers/(Kconfig|Makefile)$' || true)"
              if [ -n "$BAD" ]; then
                git revert --abort || true
                git reset -q --hard HEAD
                echo "::error::Revert $c konflik di file penting: $BAD. Pakai tree tanpa SUSFS atau buang manual."
                exit 1
              fi
              for f in $CONFLICTS; do
                git checkout --ours -- "$f"
                git add "$f"
              done
              git revert --quit
            fi
          done
          # Sisa opsi SUSFS lama di defconfig (jika ada) dibuang; opsi yang benar diset ulang di step build.
          sed -i '/^CONFIG_KSU_SUSFS/d' "arch/arm64/configs/${DEVICE}_defconfig" || true
          if [ -e fs/susfs.c ] || grep -rqs 'CONFIG_KSU_SUSFS' fs include kernel; then
            echo "== Sisa referensi SUSFS lama =="
            grep -rn 'CONFIG_KSU_SUSFS' fs include kernel | head -40 || true
            echo "::error::Masih ada sisa SUSFS lama setelah revert."
            exit 1
          fi
          echo "::notice::SUSFS lama dibuang"

      - name: Buang hook KernelSU lama bawaan tree (total, sadar #ifdef)
        working-directory: kernel_source
        run: |
          set -eo pipefail
          # Tree liyafe1997 membawa hook KernelSU gaya lama (blok #ifdef CONFIG_KSU ... #endif) di fs/exec.c, fs/open.c,
          # fs/read_write.c, fs/stat.c, drivers/input/input.c, dll. Skrip hook Jack MELEWATI file yang sudah memuat
          # "ksu_handle", dan BakaSU menolak nama hook lama (ksu_vfs_read_hook, ksu_input_hook, ksu_execveat_hook).
          # Menghapus baris satu per satu dengan sed MERUSAK kode (extern multi-baris menggantung, "else" yatim setelah
          # "if (ksu_execveat_hook)" dihapus). Skrip di bawah membuang blok preprosesor KSU utuh dan mempertahankan cabang #else.
          # Dijalankan SEBELUM patch SUSFS supaya guard CONFIG_KSU_SUSFS_* milik SUSFS tidak ikut tersentuh (juga dikecualikan di skrip).
          echo "== Berkas tree yang menyebut KSU (SEBELUM) =="
          git grep -nE 'CONFIG_KSU|ksu_' -- '*.c' '*.h' | cut -c1-160 || echo "(tidak ada)"
          cat > /tmp/strip_ksu.py <<'PYSTRIP'
          #!/usr/bin/env python3
          # Buang hook KernelSU lama bawaan tree dari berkas C/H yang DILACAK git.
          # Semua blok #if/#ifdef/#ifndef/#elif yang kondisinya hanya bergantung pada CONFIG_KSU* dievaluasi dengan
          # CONFIG_KSU* = TIDAK DIDEFINISIKAN; cabang yang mati dibuang, cabang hidup dipertahankan, baris direktifnya dihapus.
          # Kondisi campuran (KSU + simbol lain) disederhanakan secara tri-state bila memungkinkan, selain itu dibiarkan
          # dan dilaporkan oleh pemeriksaan akhir.
          import re, subprocess, sys

          KSU = re.compile(r'\bCONFIG_KSU(?!_SUSFS)\w*')

          class Tri:
              def __init__(s, v): s.v = v
              def __and__(a, b):
                  if a.v is False or b.v is False: return Tri(False)
                  if a.v is True and b.v is True: return Tri(True)
                  return Tri(None)
              def __or__(a, b):
                  if a.v is True or b.v is True: return Tri(True)
                  if a.v is False and b.v is False: return Tri(False)
                  return Tri(None)
              def __invert__(a): return Tri(None if a.v is None else (not a.v))

          def strip_comments(c):
              c = re.sub(r'/\*.*?\*/', ' ', c)
              return re.sub(r'//.*$', ' ', c).strip()

          def evaluate(kind, cond):
              cond = strip_comments(cond)
              if kind in ('ifdef', 'ifndef'):
                  name = cond.split()[0] if cond.split() else ''
                  if not KSU.fullmatch(name): return None
                  return kind == 'ifndef'
              if not KSU.search(cond): return None
              if re.search(r'==|!=|<=|>=|<|>|\+|-|\*|/|%|\?|:', cond): return None
              e = re.sub(r'IS_(?:ENABLED|BUILTIN|MODULE|REACHABLE)\s*\(\s*CONFIG_KSU\w*\s*\)', ' \x01 ', cond)
              e = re.sub(r'defined\s*\(\s*(\w+)\s*\)', lambda m: ' \x01 ' if KSU.fullmatch(m.group(1)) else ' \x02 ', e)
              e = re.sub(r'defined\s+(\w+)', lambda m: ' \x01 ' if KSU.fullmatch(m.group(1)) else ' \x02 ', e)
              e = KSU.sub(' \x01 ', e)
              e = re.sub(r'\b[A-Za-z_]\w*\b', ' \x02 ', e)
              e = re.sub(r'\b0\b', ' \x01 ', e)
              e = re.sub(r'\b[1-9]\d*\b', ' \x03 ', e)
              e = e.replace('\x01', 'T(False)').replace('\x02', 'T(None)').replace('\x03', 'T(True)')
              e = e.replace('&&', '&').replace('||', '|')
              e = re.sub(r'!(?!=)', '~', e)
              try:
                  r = eval(e, {'T': Tri, '__builtins__': {}}).v
              except Exception:
                  return None
              return r

          DIR = re.compile(r'^\s*#\s*(if|ifdef|ifndef|elif|else|endif)\b(.*)$')

          def process(text):
              out, stack, changed = [], [], False
              def emitting():
                  return all(f['mode'] == 'unknown' or (f['mode'] == 'known' and f['active']) for f in stack)
              lines = text.split('\n')
              i = 0
              while i < len(lines):
                  line = lines[i]
                  full = line
                  while full.rstrip().endswith('\\') and i + 1 < len(lines):
                      i += 1; full = full.rstrip()[:-1] + ' ' + lines[i]
                  m = DIR.match(full)
                  if not m:
                      if emitting(): out.append(line if full is line else full)
                      i += 1; continue
                  d, rest = m.group(1), m.group(2)
                  if d in ('if', 'ifdef', 'ifndef'):
                      if not emitting():
                          stack.append({'mode': 'dead'}); i += 1; continue
                      v = evaluate(d, rest)
                      if v is None:
                          stack.append({'mode': 'unknown'}); out.append(full)
                      else:
                          stack.append({'mode': 'known', 'active': v, 'taken': v}); changed = True
                  elif d == 'elif':
                      f = stack[-1]
                      if f['mode'] == 'unknown': out.append(full)
                      elif f['mode'] == 'known':
                          if f['taken']: f['active'] = False
                          else:
                              v = evaluate('if', rest)
                              if v is None:
                                  f['mode'] = 'unknown'; out.append('#if' + rest)
                              else:
                                  f['active'] = v; f['taken'] = v
                  elif d == 'else':
                      f = stack[-1]
                      if f['mode'] == 'unknown': out.append(full)
                      elif f['mode'] == 'known':
                          f['active'] = not f['taken']; f['taken'] = True
                  else:  # endif
                      f = stack.pop()
                      if f['mode'] == 'unknown': out.append(full)
                  i += 1
              if stack: raise SystemExit('direktif tidak seimbang')
              return '\n'.join(out), changed

          def main():
              r = subprocess.run(['git', 'grep', '-lE', r'CONFIG_KSU|ksu_', '--', '*.c', '*.h'], capture_output=True, text=True)
              files = r.stdout.split()
              done = []
              for f in files:
                  t = open(f, encoding='utf-8', errors='surrogateescape').read()
                  n, ch = process(t)
                  if ch and n != t:
                      open(f, 'w', encoding='utf-8', errors='surrogateescape').write(n); done.append(f)
              print('berkas dibersihkan:', ' '.join(done) if done else '(tidak ada)')
              # pemeriksaan akhir
              bad = []
              r = subprocess.run(['git', 'grep', '-nE', r'ksu_|CONFIG_KSU', '--', '*.c', '*.h'], capture_output=True, text=True)
              for l in r.stdout.splitlines():
                  body = l.split(':', 2)[2].strip() if l.count(':') >= 2 else l
                  if body.startswith(('//', '/*', '*')): continue
                  if 'susfs' in body.lower() or 'CONFIG_KSU_SUSFS' in body: continue
                  bad.append(l)
              if bad:
                  print('::error::Masih ada hook/guard KernelSU lama di tree setelah pembersihan:')
                  print('\n'.join(bad[:60])); sys.exit(1)
              print('Tree bersih dari hook KernelSU lama')

          if __name__ == '__main__':
              main()
          PYSTRIP
          python3 /tmp/strip_ksu.py
          echo "== Ringkasan perubahan =="
          git diff --stat | tail -15 || true
          git config user.name ci; git config user.email ci@local
          git add -A; git diff --cached --quiet || git commit -q -m "Remove legacy in-tree KernelSU hooks"

      - name: Set nama versi kernel (4.19.352-vorqen)
        working-directory: kernel_source
        run: |
          set -eo pipefail
          echo "== Versi di Makefile SEBELUM =="
          grep -E '^(VERSION|PATCHLEVEL|SUBLEVEL) ' Makefile
          sed -i "s/^SUBLEVEL = .*/SUBLEVEL = ${KERNEL_SUBLEVEL}/" Makefile
          echo "== Versi di Makefile SESUDAH =="
          grep -E '^(VERSION|PATCHLEVEL|SUBLEVEL) ' Makefile

          # SUBLEVEL > 255 harus di-clamp pada LINUX_VERSION_CODE agar tidak meluap ke PATCHLEVEL.
          # Source asli sudah di .325 (>255), jadi clamp ini seharusnya sudah ada. Cek saja.
          grep -n -B1 -A4 'LINUX_VERSION_CODE' Makefile | head -20 || true
          if ! grep -n -A4 'LINUX_VERSION_CODE' Makefile | grep -q '255'; then
            echo "::warning::Clamp 255 pada LINUX_VERSION_CODE tidak terdeteksi, periksa Makefile"
          fi

          # .scmversion kosong: mencegah akhiran '+' / hash git otomatis dari setlocalversion,
          # sehingga nama versi persis seperti yang diinginkan. Hapus baris ini jika ingin akhiran '+'.
          : > .scmversion


      - name: Setup BakaSU (Baka-SU/BakaSU, commit terbaru + gerbang fix SELinux)
        working-directory: kernel_source
        run: |
          set -eo pipefail
          retry() { local n; for n in 1 2 3 4 5; do "$@" && return 0; echo "::warning::percobaan $n/5 gagal: $*"; sleep $((n*15)); done; return 1; }
          rm -rf KernelSU
          # Clone PENUH (bukan --depth): dibutuhkan untuk cek commit fix SELinux di riwayat dan describe tag.
          retry git clone -q "$KSU_REPO" KernelSU
          retry git -C KernelSU fetch -q --tags --force || true
          BR="$(git -C KernelSU symbolic-ref -q --short HEAD || true)"
          echo "Branch bawaan repo: ${BR:-?}"
          if [ -z "$KSU_REF" ]; then
            KSU_REF_NOTE="ujung branch ${BR:-bawaan} (commit terbaru)"
          elif git -C KernelSU rev-parse -q --verify "refs/tags/${KSU_REF}^{commit}" >/dev/null; then
            git -C KernelSU checkout -q "refs/tags/${KSU_REF}"; KSU_REF_NOTE="tag ${KSU_REF}"
          elif git -C KernelSU rev-parse -q --verify "${KSU_REF}^{commit}" >/dev/null; then
            git -C KernelSU checkout -q --detach "${KSU_REF}"; KSU_REF_NOTE="commit ${KSU_REF}"
          elif git -C KernelSU rev-parse -q --verify "origin/${KSU_REF}^{commit}" >/dev/null; then
            git -C KernelSU checkout -q --detach "origin/${KSU_REF}"; KSU_REF_NOTE="branch ${KSU_REF}"
          else
            echo "== Tag terbaru di repo =="; git -C KernelSU tag --sort=-creatordate | sed -n '1,25p'
            echo "== Commit terbaru =="; git -C KernelSU log -15 --format='%h %s'
            echo "::error::'${KSU_REF}' bukan tag, commit, maupun branch di ${KSU_REPO}. Kosongkan ksu_ref (ujung branch) atau isi hash commit dari run Actions BakaSU."; exit 1
          fi
          BASE="$(git -C KernelSU rev-parse HEAD)"
          TAG_NEAR="$(git -C KernelSU describe --tags --abbrev=0 2>/dev/null || echo bakasu)"
          if [ -n "$KSU_REF" ] && git -C KernelSU rev-parse -q --verify "refs/tags/${KSU_REF}^{commit}" >/dev/null 2>&1; then
            KSU_LABEL="$KSU_REF"
          else
            KSU_LABEL="${TAG_NEAR}-$(git -C KernelSU rev-parse --short=8 HEAD)"
          fi
          KSU_LABEL="$(printf '%s' "$KSU_LABEL" | tr -c 'A-Za-z0-9._-' '-')"
          echo "== BakaSU di-checkout: ${KSU_LABEL} (${BASE:0:8}) [${KSU_REF_NOTE}] =="
          echo "== 30 commit terakhir =="
          git -C KernelSU log -30 --format='%h %ad %an | %s' --date=short

          # --- Gerbang fix SELinux: commit "fix detection point caused by susfs skip commits" (AlexLiuDev233) harus ada di riwayat ---
          # SUSFS melewati update latest_granting upstream; tanpa fix ini, cek /sys/fs/selinux/access di build SUSFS terdeteksi.
          FIXC="$(git -C KernelSU log -i -F --grep="$KSU_SELINUX_FIX_SUBJECT" --format='%h %an | %s' HEAD | head -3)"
          if [ -n "$FIXC" ]; then
            FIXH="$(echo "$FIXC" | head -1 | cut -d' ' -f1)"
            echo "OK      fix SELinux ada di riwayat: $FIXC"
            git -C KernelSU show --stat --format='%h %s' "$FIXH" | head -20
            SEL_NOTE="fix SELinux ${FIXH}"
          elif [ "$KSU_REQUIRE_SELINUX_FIX" = "true" ]; then
            echo "::error::Commit fix SELinux ('${KSU_SELINUX_FIX_SUBJECT}') TIDAK ada di riwayat ${KSU_LABEL}. Kosongkan ksu_ref (ujung branch) atau pakai commit yang lebih baru; atau matikan ksu_require_selinux_fix."; exit 1
          else
            echo "::warning::Commit fix SELinux tidak ditemukan di riwayat ${KSU_LABEL} (diizinkan lewat ksu_require_selinux_fix=false)"
            SEL_NOTE="tanpa fix SELinux"
          fi
          echo "== Commit terbaru yang menyentuh kernel/selinux =="
          git -C KernelSU log -8 --format='%h %ad %an | %s' --date=short -- kernel/selinux || true

          # --- Kecocokan driver <-> manager ---
          # 1) UAPI: bandingkan header sisi kernel (KernelSU/kernel/...) dengan header userspace (di luar KernelSU/kernel/).
          UAPI_K=""; UAPI_U=""
          for f in $(grep -rlE 'KERNEL_SU_UAPI_VERSION' KernelSU --include='*.h' 2>/dev/null); do
            v="$(grep -oE 'KERNEL_SU_UAPI_VERSION[^0-9]*[0-9]+' "$f" | grep -oE '[0-9]+$' | head -1)"
            echo "UAPI: $f = ${v:-?}"
            [ -n "$v" ] || continue
            case "$f" in KernelSU/kernel/*) UAPI_K="${UAPI_K:-$v}" ;; *) UAPI_U="${UAPI_U:-$v}" ;; esac
          done
          echo "== UAPI: driver(kernel)=${UAPI_K:-?} manager/ksud(userspace)=${UAPI_U:-?} =="
          if [ -n "$UAPI_K" ] && [ -n "$UAPI_U" ] && [ "$UAPI_K" != "$UAPI_U" ]; then
            echo "::error::UAPI driver (${UAPI_K}) beda dengan manager/ksud (${UAPI_U}); manager tidak akan mau memakai driver ini."; exit 1
          fi
          # BakaSU baru: header UAPI hanya ada di KernelSU/uapi (dipakai bersama driver, ksud, dan manager), tidak ada salinan di kernel/.
          if [ -z "$UAPI_K" ] && [ -n "$UAPI_U" ]; then
            if grep -qE 'uapi' KernelSU/kernel/Kbuild KernelSU/kernel/Makefile 2>/dev/null \
               || grep -rqE '#[[:space:]]*include[[:space:]]*[<"].*uapi/supercall\.h' KernelSU/kernel --include='*.c' --include='*.h' 2>/dev/null; then
              UAPI_K="$UAPI_U"
              echo "OK      UAPI bersama (KernelSU/uapi): driver, ksud, dan manager sama-sama v${UAPI_U}"
            fi
          fi
          [ -n "$UAPI_K" ] || echo "::warning::header UAPI sisi-kernel tidak ditemukan; cek UAPI dilewati"

          # 2) Tanda tangan: sertifikat APK BakaSU v4.2.0-rc3 (CN=ReSukiSU, size 0x377) harus dikenali driver.
          if grep -rqiE "$KSU_MANAGER_CERT_SHA256" KernelSU/kernel 2>/dev/null; then
            echo "OK      driver memuat sertifikat manager BakaSU (size ${KSU_MANAGER_CERT_SIZE}, sha256 ${KSU_MANAGER_CERT_SHA256:0:16}...)"
          else
            echo "::warning::sertifikat manager (sha256 ${KSU_MANAGER_CERT_SHA256:0:16}...) tidak tertanam di kernel/ BakaSU. Bila BakaSU memakai 'dynamic manager', manager harus didaftarkan lewat ksud/pengaturan; bila tidak, manager akan ditolak driver."
          fi
          if grep -rqF "$KSU_MANAGER_PKG" KernelSU/kernel 2>/dev/null; then
            echo "OK      nama paket ${KSU_MANAGER_PKG} muncul di kernel/ BakaSU"
          else
            echo "(nama paket ${KSU_MANAGER_PKG} tidak muncul di kernel/; wajar bila driver hanya memeriksa tanda tangan)"
          fi

          # 3) Versi: samakan angka versi driver dengan versionCode manager (APK BakaSU v4.2.0-rc3 = 35286).
          CODE="$KSU_VERSION_CODE"
          case "$CODE" in ''|*[!0-9]*) echo "::error::ksu_version_code harus angka (dapat: '$CODE')"; exit 1 ;; esac
          VPAT='(^|[[:space:]])(override[[:space:]]+)?KSU_VERSION[[:space:]]*[:?]?=|DKSU_VERSION='
          VFILES="$(grep -rlE "$VPAT" KernelSU/kernel --include=Kbuild --include=Makefile --include='*.mk' 2>/dev/null || true)"
          echo "== Definisi KSU_VERSION di BakaSU (SEBELUM) =="
          for f in $VFILES; do echo "--- $f"; grep -nE "$VPAT" "$f"; done
          DRV_FINAL="tidak diubah"
          if [ "$KSU_SYNC_VERSION" = "true" ]; then
            [ -n "$VFILES" ] || echo "::warning::definisi KSU_VERSION tidak ditemukan di Kbuild/Makefile BakaSU; versi driver tidak bisa disamakan (cek log 'Verifikasi versi' setelah build)"
            for f in $VFILES; do
              if grep -qE 'KSU_VERSION[[:space:]]*[:?]?=.*\\$' "$f"; then
                echo "::warning::$f: definisi KSU_VERSION berlanjut ke baris berikutnya (\\), dilewati supaya tidak merusak file"; continue
              fi
              b="$(sha256sum "$f" | cut -c1-16)"
              sed -i -E "s/DKSU_VERSION=[0-9]+/DKSU_VERSION=${CODE}/g; s/^([[:space:]]*(override[[:space:]]+)?KSU_VERSION[[:space:]]*[:?]?=).*\$/\1 ${CODE}/" "$f"
              a="$(sha256sum "$f" | cut -c1-16)"
              [ "$a" != "$b" ] && DRV_FINAL="$CODE"
            done
            echo "== Definisi KSU_VERSION di BakaSU (SESUDAH) =="
            for f in $VFILES; do echo "--- $f"; grep -nE "$VPAT" "$f"; done
            if [ "$DRV_FINAL" = "$CODE" ]; then
              echo "::notice::Versi driver disamakan dengan manager: ${CODE}"
            else
              echo "::warning::tidak ada baris KSU_VERSION yang berubah; versi driver mungkin tetap dihitung otomatis dari git"
            fi
          fi

          # BakaSU menghitung versi drivernya sendiri lewat `git describe --dirty` DI DALAM repo KernelSU/ (clone
          # terpisah dari tree kernel luar). sed di atas (dan setiap edit lain ke dalam folder ini) meninggalkan
          # working tree KernelSU/ belum ter-commit, sehingga manager menampilkan akhiran "-dirty" pada
          # "Kernel driver version" walau build dan fungsinya normal. Commit di sini (lokal, hanya di repo
          # KernelSU/, tidak memengaruhi upstream) supaya git describe tidak lagi melihat perubahan.
          git -C KernelSU config user.name "ci"
          git -C KernelSU config user.email "ci@local"
          if ! git -C KernelSU diff-index --quiet HEAD --; then
            git -C KernelSU add -A
            git -C KernelSU commit -q -m "ci: sync KSU_VERSION with manager versionCode ${CODE}"
            echo "::notice::KernelSU/ di-commit lokal supaya 'git describe --dirty' bersih (versi driver tidak lagi berakhiran -dirty)"
          else
            echo "KernelSU/ sudah bersih, tidak ada yang perlu di-commit"
          fi
          {
            echo "KSU_MGR_CODE=${CODE}"
            echo "KSU_DRV_VERSION=${DRV_FINAL}"
            echo "KSU_LABEL=${KSU_LABEL}"
            echo "KSU_COMMIT=${BASE}"
            echo "KSU_SEL_NOTE=${SEL_NOTE}"
            echo "KSU_HOOK_SYM=KSU_SUSFS"
          } >> "$GITHUB_ENV"

          test -d KernelSU/kernel
          ln -sfn ../KernelSU/kernel drivers/kernelsu
          grep -q 'kernelsu' drivers/Makefile \
            || printf '\nobj-$(CONFIG_KSU) += kernelsu/\n' >> drivers/Makefile
          grep -q 'drivers/kernelsu/Kconfig' drivers/Kconfig \
            || sed -i '/^endmenu/i source "drivers/kernelsu/Kconfig"' drivers/Kconfig
          test -L drivers/kernelsu
          test -f drivers/kernelsu/Kconfig
          { test -f drivers/kernelsu/Makefile || test -f drivers/kernelsu/Kbuild; } \
            || { echo "::error::drivers/kernelsu tidak punya Makefile maupun Kbuild"; ls drivers/kernelsu | head -40; exit 1; }
          echo "== Opsi Kconfig BakaSU =="
          grep -RhE '^[[:space:]]*config ' KernelSU/kernel --include='Kconfig*' || true
          echo "::notice::BakaSU ${KSU_LABEL} (commit ${BASE:0:8}), ${SEL_NOTE}. Driver v${DRV_FINAL} UAPI ${UAPI_K:-?}; manager: APK BakaSU v4.2.0-rc3 (versionCode ${CODE})."

          # ---------------------------------------------------------------------------
          # Tree liyafe1997 membawa hook sumber bawaan (gaya KernelSU lama) di fs/, kernel/, drivers/, dst.
          # xxKSU memasang hook sendiri (LSM + branch-link / syscall-table), jadi hook lama tree harus tidak ikut dikompilasi:
          # semua guard CONFIG_KSU di file C/H milik tree dialihkan. git grep hanya memeriksa file milik tree
          # (KernelSU/ dan NoMount/ belum di-track, dan symlink tidak diikuti).
          # ---------------------------------------------------------------------------
          TREE_HOOK_FILES="$(git grep -lE 'CONFIG_KSU|ksu_' -- '*.c' '*.h' || true)"
          echo "== File tree yang menyebut KSU =="
          echo "${TREE_HOOK_FILES:-(tidak ada)}"
          if [ -n "$TREE_HOOK_FILES" ]; then
            echo "== Baris KSU di file tree (SEBELUM) =="
            git grep -nE 'CONFIG_KSU|ksu_' -- $TREE_HOOK_FILES | head -80 || true
            perl -pi -e 's/^(\s*#\s*(?:if|ifdef|ifndef|elif)\b.*?)\bCONFIG_KSU\b/$1CONFIG_KSU_TREE_HOOK_DISABLED/' $TREE_HOOK_FILES
            echo "== Guard yang dialihkan =="
            git grep -c 'CONFIG_KSU_TREE_HOOK_DISABLED' -- $TREE_HOOK_FILES || true
          fi
          echo "== Sisa referensi KSU di file tree (SESUDAH, di luar guard yang dialihkan) =="
          git grep -nE 'CONFIG_KSU\b|ksu_' -- '*.c' '*.h' | grep -v 'CONFIG_KSU_TREE_HOOK_DISABLED' | head -60 || true

          echo "::notice::Hook sumber tree dinonaktifkan; BakaSU ${KSU_REF} @ ${KSU_COMMIT:0:8} memakai hooknya sendiri (SUSFS Inline Hook)"

      - name: Pastikan SUSFS bawaan BakaSU lengkap (tanpa patch sisi-KernelSU eksternal)
        if: ${{ env.SUSFS_ENABLE == 'true' }}
        working-directory: kernel_source
        run: |
          set -eo pipefail
          # Patch 10 (tiann) dan patch 11 (yapixel/xxKSU) TIDAK dipakai lagi. Sisi-KernelSU SUSFS sudah ada di dalam BakaSU
          # (kernel/Kconfig, feature/sucompat.c, feature/selinux_hide/*, runtime/*), dan dijaga mengikuti simonpunk oleh
          # commit BakaSU sendiri ("sync with latest susfs", "fix detection point caused by susfs skip commits").
          grep -RqE '^[[:space:]]*config[[:space:]]+KSU_SUSFS[[:space:]]*$' KernelSU/kernel --include='Kconfig*' \
            || { echo "::error::BakaSU ${KSU_LABEL} tidak punya opsi KSU_SUSFS di Kconfig-nya. Pakai ref BakaSU yang memuat SUSFS."; exit 1; }
          MISS=""
          for o in $SUSFS_OPTS; do
            grep -RqE "^[[:space:]]*config[[:space:]]+${o}[[:space:]]*\$" KernelSU/kernel --include='Kconfig*' || MISS="$MISS $o"
          done
          [ -z "$MISS" ] || { echo "::error::opsi SUSFS ini tidak ada di Kconfig BakaSU ${KSU_LABEL}:${MISS}"; exit 1; }
          echo "SUSFS_GLUE=bawaan-BakaSU+hook-Jack" >> "$GITHUB_ENV"
          echo "::notice::Semua opsi SUSFS ada di Kconfig BakaSU ${KSU_LABEL}; tidak ada patch sisi-KernelSU eksternal."

      - name: Cek kecocokan manager vs driver BakaSU
        working-directory: kernel_source
        run: |
          set +e
          echo "Sumber         : ${KSU_REPO} @ ${KSU_LABEL} (${KSU_COMMIT:0:8})"
          echo "Versi driver   : ${KSU_MGR_CODE} (sinkron manager: ${KSU_SYNC_VERSION}), hook: SUSFS Inline Hook (CONFIG_KSU_SUSFS)"
          echo "Manager        : pasang APK BakaSU v4.2.0-rc3 (versionCode ${KSU_VERSION_CODE}) dari https://github.com/Baka-SU/BakaSU/releases"
          echo "NoMount        : kernel ${NOMOUNT_VERSION} butuh metamodule NoMount ${NOMOUNT_VERSION} (update bersamaan, lalu reboot)"
          exit 0

      - name: Setup SUSFS (patch kernel 4.19 v2.4.0)
        if: env.SUSFS_ENABLE == 'true'
        working-directory: kernel_source
        run: |
          set -eo pipefail

          # Patch diambil lewat git (di-pin ke commit), bukan URL raw.
          rm -rf /tmp/susfs-src && mkdir -p /tmp/susfs-src
          git -C /tmp/susfs-src init -q
          git -C /tmp/susfs-src remote add origin "$SUSFS_PATCH_REPO"
          git -C /tmp/susfs-src fetch -q --depth 1 origin "${SUSFS_PATCH_COMMIT:-HEAD}"
          git -C /tmp/susfs-src checkout -q FETCH_HEAD
          SUSFS_PATCH_COMMIT="$(git -C /tmp/susfs-src rev-parse HEAD)"
          echo "SUSFS_PATCH_COMMIT=${SUSFS_PATCH_COMMIT}" >> "$GITHUB_ENV"
          echo "== Commit patch Jack: ${SUSFS_PATCH_COMMIT} =="
          PATCH_FILE="/tmp/susfs-src/${SUSFS_PATCH_PATH}"
          test -s "$PATCH_FILE" || { echo "::error::patch SUSFS tidak ditemukan: ${SUSFS_PATCH_PATH}"; exit 1; }
          grep -m1 'define SUSFS_VERSION' "$PATCH_FILE" || true
          PATCH_SHA="$(sha256sum "$PATCH_FILE" | cut -d' ' -f1)"
          echo "sha256 patch: ${PATCH_SHA}"
          if [ -n "$SUSFS_PATCH_SHA256_EXPECT" ] && [ "$PATCH_SHA" != "$SUSFS_PATCH_SHA256_EXPECT" ]; then
            echo "::warning::Patch Jack di HEAD berbeda dari patch v2.4.0 yang diuji (sha256 ${PATCH_SHA:0:12} vs ${SUSFS_PATCH_SHA256_EXPECT:0:12}); repo Jack berubah lagi, cek log hunk"
          fi
          grep -q 'define SUSFS_VERSION "v2.4' "$PATCH_FILE" \
            || echo "::warning::Patch bukan v2.4.x; sisi KernelSU di bawah disusun untuk v2.4.0"
          grep -q '^+++ b/fs/susfs.c' "$PATCH_FILE" \
            || { echo "::error::bukan patch SUSFS kernel (fs/susfs.c tidak ada)"; exit 1; }

          # Patch tidak boleh membawa hook inline ksu_handle_* (xxKSU memasang hook sendiri). Baris komentar diabaikan.
          INLINE_HOOKS="$(grep -E '^\+' "$PATCH_FILE" | grep -vE '^\+[[:space:]]*(//|/\*|\*)' | grep -cE 'ksu_handle_' || true)"
          if [ "${INLINE_HOOKS:-0}" -gt 0 ]; then
            echo "::warning::patch SUSFS memuat ${INLINE_HOOKS} baris hook inline ksu_handle_*; bisa bentrok dengan mode hook ${KSU_HOOK_MODE}"
          fi

          # Gerbang: tanpa sisi SUSFS di driver, fs/susfs.c gagal di-link dan CONFIG_KSU_SUSFS* tidak pernah ada.
          grep -rqs 'susfs_is_current_ksu_domain' KernelSU/kernel && grep -qs 'KSU_SUSFS' KernelSU/kernel/Kconfig \
            || { echo "::error::Driver tidak membawa sisi SUSFS"; exit 1; }

          # Tata letak driver KernelSU (diagnosis)
          echo "== Referensi SUSFS di driver =="
          grep -rln 'susfs' KernelSU/kernel 2>/dev/null | head -20 || echo "(tidak ada)"
          echo "== Kconfig KSU_SUSFS =="
          grep -n 'config KSU_SUSFS' KernelSU/kernel/Kconfig | head -30 || echo "(tidak ada)"

          # Terapkan patch. Hunk yang gagal karena konteks include tree ini berbeda (cmdline.c, task_mmu.c, namespace.c, super.c) dibenahi di bawah.
          patch -p1 -f -s --no-backup-if-mismatch < "$PATCH_FILE" > /tmp/susfs-apply.log 2>&1 || true
          echo "== Hunk gagal (hunk sukses/offset/fuzz tidak dicetak lagi) =="
          grep -E 'FAILED|Reversed|malformed|can.t find file' /tmp/susfs-apply.log || echo "(tidak ada)"
          REJ="$(find . -name '*.rej' -not -path './out/*' | sort)"
          if [ -n "$REJ" ]; then
            echo "== File .rej =="; echo "$REJ"
            OTHER="$(echo "$REJ" | grep -v -x -e './fs/proc/task_mmu.c.rej' -e './fs/proc/cmdline.c.rej' -e './fs/namespace.c.rej' -e './fs/super.c.rej' || true)"
            # Tree ini bisa punya konteks fs/namespace.c & fs/super.c yang berbeda dari patch. Hanya hunk include/extern dan
            # vfs_kern_mount() yang boleh gagal; keduanya dipasang ulang oleh fallback di bawah. Hunk lain = berhenti.
            [ ! -f fs/namespace.c.rej ] || [ "$(grep -c '^@@' fs/namespace.c.rej)" -le 2 ] \
              || OTHER="$OTHER ./fs/namespace.c.rej(>2 hunk)"
            [ ! -f fs/super.c.rej ] || [ "$(grep -c '^@@' fs/super.c.rej)" -le 1 ] \
              || OTHER="$OTHER ./fs/super.c.rej(>1 hunk)"
            if [ -n "$OTHER" ]; then
              for r in $REJ; do echo "----- $r"; cat "$r"; done
              echo "::error::Ada hunk SUSFS gagal selain task_mmu.c / cmdline.c / (hunk include & vfs_kern_mount di namespace.c, include di super.c) (lihat .rej di atas)"
              exit 1
            fi
          fi

          python3 - <<'PY'
          import os
          def edit(path, fn):
              s = open(path, encoding='utf-8').read()
              n = fn(s)
              if n != s:
                  open(path, 'w', encoding='utf-8').write(n)
                  print("diperbaiki:", path)
              else:
                  print("tidak perlu diubah:", path)

          def need(s, anchor, path):
              if anchor not in s:
                  raise SystemExit("::error::anchor tidak ada di %s: %r" % (path, anchor))

          # fs/proc/task_mmu.c: include susfs_def.h (hunk include gagal karena konteks berbeda)
          def task_mmu(s):
              if 'susfs_def.h' in s:
                  return s
              a = '#include <asm/elf.h>\n'
              need(s, a, 'fs/proc/task_mmu.c')
              blk = ('#if defined(CONFIG_KSU_SUSFS_SUS_KSTAT) || defined(CONFIG_KSU_SUSFS_SUS_MAP) || defined(CONFIG_KSU_SUSFS_OPEN_REDIRECT)\n'
                     '#include <linux/susfs_def.h>\n'
                     '#endif // #if defined(CONFIG_KSU_SUSFS_SUS_KSTAT) || defined(CONFIG_KSU_SUSFS_SUS_MAP) || defined(CONFIG_KSU_SUSFS_OPEN_REDIRECT)\n\n')
              return s.replace(a, blk + a, 1)
          edit('fs/proc/task_mmu.c', task_mmu)

          # fs/proc/cmdline.c: spoof cmdline (hunk gagal karena tree ini punya blok INITRAMFS_IGNORE_SKIP_FLAG)
          def cmdline(s):
              if 'susfs_spoof_cmdline_or_bootconfig' in s:
                  return s
              a = 'static int cmdline_proc_show(struct seq_file *m, void *v)\n{\n'
              need(s, a, 'fs/proc/cmdline.c')
              decl = ('#ifdef CONFIG_KSU_SUSFS_SPOOF_CMDLINE_OR_BOOTCONFIG\n'
                      'extern struct static_key_false susfs_is_fake_cmdline_or_bootconfig_buffer_set;\n'
                      'extern void susfs_spoof_cmdline_or_bootconfig(struct seq_file *m);\n'
                      '#endif\n\n')
              body = ('#ifdef CONFIG_KSU_SUSFS_SPOOF_CMDLINE_OR_BOOTCONFIG\n'
                      '\tif (static_branch_likely(&susfs_is_fake_cmdline_or_bootconfig_buffer_set)) {\n'
                      '\t\tsusfs_spoof_cmdline_or_bootconfig(m);\n'
                      '\t\tseq_putc(m, \'\\n\');\n'
                      '\t\treturn 0;\n'
                      '\t}\n'
                      '#endif\n')
              return s.replace(a, decl + a + body, 1)
          edit('fs/proc/cmdline.c', cmdline)

          # fs/stat.c memakai susfs_is_current_app_uid() dan STATX_SUS_KSTAT, tetapi tidak meng-include susfs_def.h
          def stat_c(s):
              if 'susfs_def.h' in s:
                  return s
              a = '#include <asm/unistd.h>\n'
              need(s, a, 'fs/stat.c')
              return s.replace(a, a + '#ifdef CONFIG_KSU_SUSFS_SUS_KSTAT\n#include <linux/susfs_def.h>\n#endif\n', 1)
          edit('fs/stat.c', stat_c)

          # fs/notify/fdinfo.c: show_fdinfo() memanggil show(m, mark, f) untuk semua callback, jadi fanotify_fdinfo
          # juga harus menerima argumen ketiga. (mount.h sudah di-include lewat fsnotify.h dan tidak punya include guard.)
          def fdinfo_c(s):
              if 'fanotify_fdinfo(struct seq_file *m, struct fsnotify_mark *mark, struct file *file)' in s:
                  return s   # sudah dibawa patch Jack
              old = 'static void fanotify_fdinfo(struct seq_file *m, struct fsnotify_mark *mark)\n{'
              new = ('#if defined(CONFIG_KSU_SUSFS_SUS_MOUNT) || defined(CONFIG_KSU_SUSFS_SUS_KSTAT)\n'
                     'static void fanotify_fdinfo(struct seq_file *m, struct fsnotify_mark *mark, struct file *file)\n'
                     '#else\n'
                     'static void fanotify_fdinfo(struct seq_file *m, struct fsnotify_mark *mark)\n'
                     '#endif\n{')
              need(s, old, 'fs/notify/fdinfo.c')
              return s.replace(old, new, 1)
          edit('fs/notify/fdinfo.c', fdinfo_c)

          # fs/namespace.c: di branch 'back' hunk include/extern dan vfs_kern_mount() gagal karena konteks berbeda.
          # Pasang ulang dengan anchor longgar (isi sama dengan hunk aslinya).
          def namespace_c(s):
              import re
              inc = '#include "internal.h"\n'
              if 'linux/susfs_def.h' not in s:
                  need(s, inc, 'fs/namespace.c')
                  s = s.replace(inc, inc + '#ifdef CONFIG_KSU_SUSFS\n#include <linux/susfs_def.h>\n#endif // #ifdef CONFIG_KSU_SUSFS\n', 1)
              if 'extern bool susfs_is_current_ksu_domain' not in s:
                  a = '#endif // #ifdef CONFIG_KSU_SUSFS\n'
                  i = s.index('linux/susfs_def.h')
                  j = s.index(a, i) + len(a)
                  s = s[:j] + ('\n#ifdef CONFIG_KSU_SUSFS_SUS_MOUNT\n'
                               'extern bool susfs_is_current_ksu_domain(void);\n'
                               'extern struct static_key_true susfs_is_sdcard_android_data_not_decrypted;\n'
                               '#endif // #ifdef CONFIG_KSU_SUSFS_SUS_MOUNT\n') + s[j:]
              if '#define CL_COPY_MNT_NS' not in s:
                  a = '#endif // #ifdef CONFIG_KSU_SUSFS_SUS_MOUNT\n'
                  i = s.index('extern bool susfs_is_current_ksu_domain')
                  j = s.index(a, i)
                  s = s[:j] + '#define CL_COPY_MNT_NS BIT(25) /* used by copy_mnt_ns() */\n' + s[j:]
              if 'bypass_orig_flow' not in s:
                  m = re.search(r'^vfs_kern_mount\(', s, re.M)
                  if not m:
                      raise SystemExit("::error::vfs_kern_mount() tidak ditemukan di fs/namespace.c")
                  m2 = re.compile(r'^\tmnt = alloc_vfsmnt\(([^;\n]*)\);\n', re.M).search(s, m.end(), m.end() + 2000)
                  if not m2:
                      print(s[m.start():m.start() + 1200])
                      raise SystemExit("::error::anchor 'mnt = alloc_vfsmnt(...)' tidak ada di vfs_kern_mount() (lihat isi fungsi di atas)")
                  pre = ('#ifdef CONFIG_KSU_SUSFS_SUS_MOUNT\n'
                         '\t// - We will just stop checking for ksu process if /sdcard/Android is accessible,\n'
                         '\t//   for the sake of performance\n'
                         '\tif (static_branch_unlikely(&susfs_is_sdcard_android_data_not_decrypted)) {\n'
                         '\t\tif (susfs_is_current_ksu_domain()) {\n'
                         '\t\t\tmnt = susfs_alloc_non_unshare_ksu_vfsmnt(name ?:"none");\n'
                         '\t\t\tgoto bypass_orig_flow;\n'
                         '\t\t}\n'
                         '\t}\n'
                         '#endif // #ifdef CONFIG_KSU_SUSFS_SUS_MOUNT\n\n')
                  post = ('\n#ifdef CONFIG_KSU_SUSFS_SUS_MOUNT\n'
                          'bypass_orig_flow:\n'
                          '#endif // #ifdef CONFIG_KSU_SUSFS_SUS_MOUNT\n')
                  s = s[:m2.start()] + pre + m2.group(0) + post + s[m2.end():]
              return s
          edit('fs/namespace.c', namespace_c)

          # fs/super.c: hunk include/extern gagal di branch 'back'
          def super_c(s):
              inc = '#include "internal.h"\n'
              if 'linux/susfs_def.h' in s and 'extern bool susfs_is_current_ksu_domain' in s:
                  return s
              need(s, inc, 'fs/super.c')
              pre = '' if 'linux/susfs_def.h' in s else '#ifdef CONFIG_KSU_SUSFS\n#include <linux/susfs_def.h>\n#endif // #ifdef CONFIG_KSU_SUSFS\n'
              post = '' if 'extern bool susfs_is_current_ksu_domain' in s else (
                  '\n#ifdef CONFIG_KSU_SUSFS_SUS_MOUNT\n'
                  'extern bool susfs_is_current_ksu_domain(void);\n'
                  'extern struct static_key_true susfs_is_sdcard_android_data_not_decrypted;\n'
                  '#endif // #ifdef CONFIG_KSU_SUSFS_SUS_MOUNT\n')
              return s.replace(inc, pre + inc + post, 1)
          edit('fs/super.c', super_c)

          # fs/susfs.c: patch Jack membawa filter prioritas tetapi tidak mencantumkannya di susfs_get_enabled_features(),
          # sehingga manager (BRENE) tidak menampilkan PRIORITY_UID_FILTER. Tambahkan entri sesudah blok fitur terakhir.
          def features_c(s):
              if 'CONFIG_KSU_SUSFS_PRIORITY_UID_FILTER' in s:
                  return s
              i = s.find('void susfs_get_enabled_features(')
              if i == -1:
                  raise SystemExit("::error::susfs_get_enabled_features() tidak ada di fs/susfs.c")
              a = '\n\tinfo->err = 0;\nout_copy_to_user:'
              j = s.find(a, i)
              if j == -1:
                  raise SystemExit("::error::titik sisip 'info->err = 0; out_copy_to_user' tidak ada di susfs_get_enabled_features()")
              blk = ('#ifdef CONFIG_KSU_SUSFS_PRIORITY_UID_FILTER\n'
                     '\tinfo->err = copy_config_to_buf("CONFIG_KSU_SUSFS_PRIORITY_UID_FILTER\\n", buf_ptr, &copied_size, SUSFS_ENABLED_FEATURES_SIZE);\n'
                     '\tif (info->err) goto out_copy_to_user;\n'
                     '\tbuf_ptr = info->enabled_features + copied_size;\n'
                     '#endif\n')
              return s[:j] + '\n' + blk.rstrip('\n') + s[j:]
          edit('fs/susfs.c', features_c)

          # Meniru susfs4ksu upstream (simonpunk, commit aa61fe06 "Make priority_uid_filter as new feature"): hook di
          # kernel/sys.c dan block/ioprio.c dijaga CONFIG_KSU_SUSFS_PRIORITY_UID_FILTER, bukan CONFIG_KSU_SUSFS, sehingga
          # fitur bisa dihidupkan/dimatikan saat kompilasi. Patch Jack belum mengikuti perubahan itu. Idempotent: dilewati
          # jika patch sudah memakai guard baru. Hanya baris guard plain CONFIG_KSU_SUSFS yang diganti; guard lain
          # (mis. CONFIG_KSU_SUSFS_SPOOF_UNAME di sys.c) tidak tersentuh karena dicocokkan sampai akhir baris.
          def prio_gate(s):
              if 'susfs_is_priority_uid_filtered' not in s or 'CONFIG_KSU_SUSFS_PRIORITY_UID_FILTER' in s:
                  return s
              return (s.replace('#ifdef CONFIG_KSU_SUSFS\n', '#ifdef CONFIG_KSU_SUSFS_PRIORITY_UID_FILTER\n')
                       .replace('#endif // #ifdef CONFIG_KSU_SUSFS\n', '#endif // #ifdef CONFIG_KSU_SUSFS_PRIORITY_UID_FILTER\n'))
          for _f in ('kernel/sys.c', 'block/ioprio.c', 'fs/ioprio.c'):
              if os.path.exists(_f):
                  edit(_f, prio_gate)

          PY
          find . -name '*.rej' -not -path './out/*' -delete

          # susfs_is_priority_uid_filtered (getpriority uid filter / "hide_third_party_apps", CMD 0x60030):
          # patch Jack >= 38bbbd5 (30 Okt 2026) membawanya NATIVE: definisi di fs/susfs.c, hook di kernel/sys.c
          # (setpriority/getpriority) dan block/ioprio.c (ioprio_set/ioprio_get). Tidak ada hook manual dan tidak ada stub lagi.
          # Bila SUSFS_PATCH_COMMIT diturunkan ke commit lama, pemeriksaan di bawah berhenti dengan pesan yang jelas.

          test -f fs/susfs.c
          test -f include/linux/susfs.h
          test -f include/linux/susfs_def.h
          grep -q 'susfs.o' fs/Makefile
          grep -q 'susfs_def.h' fs/proc/task_mmu.c
          grep -q 'susfs_spoof_cmdline_or_bootconfig' fs/proc/cmdline.c
          grep -q 'bypass_orig_flow' fs/namespace.c
          grep -q 'linux/susfs_def.h' fs/namespace.c
          grep -q 'linux/susfs_def.h' fs/super.c
          # Filter prioritas native dari patch Jack: definisi + 3 baris (1 extern + 2 pemakaian) di sys.c dan ioprio.
          grep -qE '^bool susfs_is_priority_uid_filtered\(' fs/susfs.c \
            || { echo "::error::fs/susfs.c tidak mendefinisikan susfs_is_priority_uid_filtered. SUSFS_PATCH_COMMIT (${SUSFS_PATCH_COMMIT}) lebih lama dari 38bbbd5 (30 Okt 2026); kosongkan pin atau naikkan."; exit 1; }
          IOPRIO_F="$(git grep -l 'SYSCALL_DEFINE3(ioprio_set' -- '*.c' | head -1 || true)"
          [ -n "$IOPRIO_F" ] || { echo "::error::SYSCALL_DEFINE3(ioprio_set,...) tidak ditemukan di tree ini"; exit 1; }
          [ "$(grep -c 'susfs_is_priority_uid_filtered' kernel/sys.c)" -ge 3 ] \
            || { echo "::error::hook priority-uid-filter di kernel/sys.c tidak dibawa patch (harusnya 1 extern + 2 pemakaian)"; grep -n 'susfs_is_priority_uid_filtered' kernel/sys.c; exit 1; }
          [ "$(grep -c 'susfs_is_priority_uid_filtered' "$IOPRIO_F")" -ge 3 ] \
            || { echo "::error::hook priority-uid-filter di ${IOPRIO_F} tidak dibawa patch (harusnya 1 extern + 2 pemakaian)"; grep -n 'susfs_is_priority_uid_filtered' "$IOPRIO_F"; exit 1; }
          [ "$(grep -c 'CONFIG_KSU_SUSFS_PRIORITY_UID_FILTER' kernel/sys.c)" -ge 6 ] \
            && [ "$(grep -c 'CONFIG_KSU_SUSFS_PRIORITY_UID_FILTER' "$IOPRIO_F")" -ge 6 ] \
            || { echo "::error::guard CONFIG_KSU_SUSFS_PRIORITY_UID_FILTER tidak terpasang lengkap di kernel/sys.c / ${IOPRIO_F}"; exit 1; }
          echo "::notice::SUSFS kernel 4.19 v2.4.0 (patch Jack @ ${SUSFS_PATCH_COMMIT:0:8}) terpasang, termasuk filter prioritas native (sys.c, ${IOPRIO_F}, fs/susfs.c)"

      - name: Pasang hook inline SUSFS (Jack susfs_inline_hook_patches.sh)
        if: ${{ env.SUSFS_ENABLE == 'true' }}
        working-directory: kernel_source
        run: |
          set -eo pipefail
          # BakaSU mode "SUSFS Inline Hook" memeriksa saat kompilasi (kernel/tools/inline_hook_check.mk) bahwa sumber kernel punya
          # hook ksu_handle_* di sys.c, exec.c, open.c, read_write.c, stat.c, reboot.c, input.c. Patch kernel-side Jack
          # (susfs_patch_to_4.19.patch, step sebelumnya) hanya membawa SUSFS-nya; hook itu dipasang skrip Jack ini,
          # dari clone yang SAMA (/tmp/susfs-src) yang sudah dipakai step "Setup SUSFS (patch kernel 4.19 v2.4.0)".
          S="/tmp/susfs-src/${SUSFS_INLINE_HOOK_PATH}"
          [ -s "$S" ] || { echo "::error::${SUSFS_INLINE_HOOK_PATH} tidak ada di clone Jack (/tmp/susfs-src); cek apakah repo masih membawa skrip ini"; exit 1; }
          echo "Skrip hook Jack: sha256 $(sha256sum "$S" | cut -c1-16) (JackA1ltman/NonGKI_Kernel_Build_2nd @ ${SUSFS_PATCH_COMMIT:0:8})"
          [ -d drivers/kernelsu ] || { echo "::error::drivers/kernelsu belum ada; BakaSU harus sudah di-setup sebelum hook dipasang (skrip Jack membaca drivers/kernelsu)"; exit 1; }
          bash "$S" 2>&1 | tee /tmp/jack-hooks.log
          grep -q 'patch failed for unknown reasons' /tmp/jack-hooks.log \
            && { echo "::error::skrip hook Jack gagal memasang sebagian hook (lihat baris '[-] ... patch failed' di atas)"; exit 1; } || true

          # --- Penyesuaian ke BakaSU terbaru (tanda tangan fungsi di driver, bukan di skrip Jack) ---
          # 1) ksu_handle_sys_read di BakaSU menerima (fd, &buf, &count); skrip Jack masih memanggil dengan (fd) saja.
          sed -i 's/^extern __attribute__((cold)) int ksu_handle_sys_read(unsigned int fd);$/extern int ksu_handle_sys_read(unsigned int fd, char __user **buf_ptr, size_t *count_ptr);/' fs/read_write.c
          sed -i 's/^\([[:space:]]*\)ksu_handle_sys_read(fd);$/\1ksu_handle_sys_read(fd, \&buf, \&count);/' fs/read_write.c
          ! grep -qE 'ksu_handle_sys_read\(fd\)' fs/read_write.c \
            || { echo "::error::fs/read_write.c masih memanggil ksu_handle_sys_read(fd) (tanda tangan lama)"; grep -n 'ksu_handle_sys_read' fs/read_write.c; exit 1; }
          # 2) Pesan log setresuid: skrip Jack menulis "\\n" (backslash literal) di dalam string C.
          sed -i 's/ksu_handle_setresuid()\\\\n/ksu_handle_setresuid()\\n/' kernel/sys.c

          # --- Verifikasi: sama dengan yang diperiksa BakaSU saat kompilasi (gagal di sini = hemat build 30 menit) ---
          chk() { grep -q "$1" "$2" && echo "OK      $1 di $2" || { echo "::error::hook $1 tidak ada di $2"; BAD=1; }; }
          BAD=0
          chk ksu_handle_setresuid          kernel/sys.c
          chk ksu_handle_execveat           fs/exec.c
          chk ksu_handle_faccessat          fs/open.c
          chk ksu_handle_sys_read           fs/read_write.c
          chk ksu_handle_stat               fs/stat.c
          chk ksu_handle_vfs_fstat          fs/stat.c
          chk ksu_handle_sys_reboot         kernel/reboot.c
          chk ksu_handle_input_handle_event drivers/input/input.c
          # hook lama yang ditolak BakaSU
          for p in "ksu_vfs_read_hook fs/read_write.c" "ksu_input_hook drivers/input/input.c" "ksu_execveat_hook fs/exec.c" \
                   "ksu_init_rc_hook fs/read_write.c" "ksu_init_rc_hook fs/stat.c"; do
            set -- $p
            if grep -wq "$1" "$2"; then echo "::error::hook lama '$1' masih ada di $2 (ditolak BakaSU)"; BAD=1; fi
          done
          # tidak boleh ada fallback 'manual hook' yang mengubah mode kompilasi BakaSU
          grep -wn 'CONFIG_KSU_MANUAL_HOOK' kernel/sys.c fs/exec.c fs/open.c fs/read_write.c fs/stat.c kernel/reboot.c drivers/input/input.c \
            && echo "::warning::ada guard CONFIG_KSU_MANUAL_HOOK di sumber kernel (BakaSU akan memperingatkan)" || true
          [ "$BAD" = 0 ] || exit 1
          echo "== Ringkasan perubahan hook =="
          git diff --stat -- kernel/sys.c fs/exec.c fs/open.c fs/read_write.c fs/stat.c kernel/reboot.c drivers/input/input.c security/ | tail -12
          echo "::notice::Hook SUSFS inline (Jack) terpasang dan lolos pemeriksaan setara inline_hook_check.mk BakaSU"

      - name: Verifikasi SELinux BakaSU (hook SUSFS + jejak fix)
        working-directory: kernel_source
        run: |
          set -eo pipefail
          D=drivers/kernelsu/selinux
          [ -d "$D" ] || { F="$(find KernelSU/kernel -name rules.c -path '*selinux*' | head -1)"; D="$(dirname "$F")"; }
          echo "== Direktori SELinux BakaSU: $D =="; ls "$D" || true
          echo "== Titik seqno / latest_granting / reset cache =="
          grep -rnE 'latest_granting|reset_avc_cache|avc_ss_reset|selinux_status' "$D" | head -30 || true
          grep -rqE 'latest_granting|reset_avc_cache' "$D" \
            || echo "::warning::tidak ada penanganan latest_granting/reset_avc_cache di $D (struktur BakaSU berbeda dari dugaan, cek log di atas)"
          echo "== selinux_hide =="
          SH="$(find KernelSU/kernel -name 'selinux_hide*' | head -3)"
          if [ -n "$SH" ]; then echo "OK      $SH"; else echo "::warning::berkas selinux_hide tidak ditemukan di BakaSU (fitur bisa berada di tempat lain)"; fi
          if [ "$SUSFS_ENABLE" = "true" ]; then
            case "${SUSFS_GLUE:-no}" in
              bawaan*)
                grep -rqE 'susfs_add_sus_type' drivers/kernelsu/ 2>/dev/null || echo "::warning::driver BakaSU tidak memanggil susfs_add_sus_type (SUS_TYPE bisa tidak terisi)"
                grep -rqE '\bsusfs_init[[:space:]]*\(' drivers/kernelsu/ 2>/dev/null || echo "::warning::driver BakaSU tidak memanggil susfs_init()" ;;
              *) echo "SUSFS sisi-KernelSU tidak terpasang: pemeriksaan hook SUSFS dilewati" ;;
            esac
          fi
          echo "::notice::SELinux BakaSU diperiksa (${KSU_SEL_NOTE})"

      - name: Diagnosis SELinux / DirtySepolicy BakaSU + SUSFS (informasi, tidak menggagalkan build)
        working-directory: kernel_source
        run: |
          set +e
          # Penyamaran SELinux BakaSU ("Hide SELinux modifications" / selinux_hide) dan penanda tipe sepolicy
          # (susfs_add_sus_type, BakaSU PR #648) adalah perilaku DRIVER; tidak ada saklar build-time yang harus
          # dinyalakan di sini. Langkah ini hanya MEMBUKTIKAN lewat log apakah build ini memuatnya.
          D=drivers/kernelsu
          echo "== BakaSU ${KSU_LABEL} (${KSU_COMMIT:0:12}) =="
          echo "== 1) Commit penyamaran SELinux/sepolicy di riwayat =="
          for pat in 'fix detection point caused by susfs skip commits' 'fix regression of more than one sid target one context'; do
            R="$(git -C KernelSU log -i --grep="$pat" --format='%h %s' HEAD | head -1)"
            if [ -n "$R" ]; then echo "OK      $R"; else echo "::warning::tidak ada commit '$pat' di riwayat ref ini"; fi
          done
          echo "== 2) Driver menandai tipe/edge sepolicy ke SUSFS (anti DirtySepolicy)? =="
          grep -rnE 'susfs_add_sus_type|susfs_add_sus_avd_allowed_by_type' $D 2>/dev/null | head -8
          grep -rqE 'susfs_add_sus_type' $D 2>/dev/null && S_TYPE=1 || S_TYPE=0
          [ "$S_TYPE" = 1 ] || echo "::warning::driver tidak memanggil susfs_add_sus_type: tipe ksu/ksu_file bisa terbaca VALID oleh detektor DirtySepolicy"
          echo "== 3) Jalur selinux_hide BakaSU yang BENAR-BENAR dipakai =="
          grep -q 'ksu_selinux_hide_running' security/selinux/hooks.c 2>/dev/null && ANCHOR=1 || ANCHOR=0
          OWN_IMPL=0
          for f in $(find KernelSU/kernel/feature -path '*selinux_hide*' -name '*.c' 2>/dev/null); do
            grep -qE '^\s*(static\s+)?(int|ssize_t)\s+my_write_context' "$f" && { OWN_IMPL=1; echo "OK      implementasi sendiri my_write_context di $f"; }
          done
          echo "== Ringkasan: anchor_susfs_di_kernel=${ANCHOR} bakasu_pakai_implementasi_sendiri=${OWN_IMPL} driver_tandai_tipe=${S_TYPE} =="
          if [ "$ANCHOR" = 0 ] && [ "$OWN_IMPL" = 1 ]; then
            echo "::notice::Kernel tanpa anchor susfs -> BakaSU pakai implementasi context/access/setprocattr MILIK SENDIRI (tidak bergantung ke patch SUSFS Jack). Penyamaran node selinuxfs berjalan selama 'Hide SELinux modifications' AKTIF di manager."
          elif [ "$ANCHOR" = 0 ] && [ "$OWN_IMPL" = 0 ]; then
            echo "::warning::Kernel tanpa anchor susfs TAPI implementasi sendiri tidak ditemukan (struktur berbeda dari dugaan). Build yang lolos tanpa error link berarti simbolnya tetap ada di tempat lain; kirim isi folder feature/selinux_hide untuk dicek ulang."
          else
            echo "::notice::Kernel tree ini punya anchor susfs: BakaSU mendelegasikan context/access/setprocattr ke fungsi SUSFS kernel-side. Pastikan build ini tidak gagal link."
          fi
          exit 0

      - name: Integrasikan fgetpriority (aerath-stuff, built-in)
        if: ${{ env.FGP_ENABLE == 'true' }}
        working-directory: kernel_source
        run: |
          set -eo pipefail
          rm -rf /tmp/fgp
          git clone -q "$FGP_REPO" /tmp/fgp
          if [ -n "$FGP_REF" ]; then
            git -C /tmp/fgp checkout -q "$FGP_REF" \
              || { echo "::error::fgetpriority_ref '${FGP_REF}' tidak ditemukan di ${FGP_REPO}"; exit 1; }
          fi
          FGP_COMMIT="$(git -C /tmp/fgp rev-parse HEAD)"
          echo "FGP_COMMIT=${FGP_COMMIT}" >> "$GITHUB_ENV"
          git -C /tmp/fgp log -1 --format='fgetpriority: %h %s'
          for f in main.c routine.h routine_kp.c routine_raw.c arch.h kernel.h arm64_branch_insn.h Makefile Kconfig; do
            test -f "/tmp/fgp/kernel/$f" || { echo "::error::kernel/$f tidak ada di fgetpriority (struktur repo berubah)"; exit 1; }
          done
          rm -rf drivers/fgetpriority; mkdir -p drivers/fgetpriority
          cp -a /tmp/fgp/kernel/. drivers/fgetpriority/
          rm -f drivers/fgetpriority/Makefile.ddk drivers/fgetpriority/build_ddk.sh
          # Built-in saja: ubah tristate/default m menjadi bool/default y
          sed -i -E 's/^([[:space:]]*)tristate "uid filter"/\1bool "uid filter (getpriority hiding)"/; s/^([[:space:]]*)default m$/\1default y/' drivers/fgetpriority/Kconfig
          grep -q 'bool "uid filter' drivers/fgetpriority/Kconfig || { echo "::error::Kconfig fgetpriority gagal diubah ke bool"; cat drivers/fgetpriority/Kconfig; exit 1; }
          python3 - <<'PY'
          p = 'drivers/Kconfig'
          s = open(p, encoding='utf-8').read()
          line = 'source "drivers/fgetpriority/Kconfig"'
          if line not in s:
              i = s.rfind('\nendmenu')
              assert i >= 0, 'endmenu tidak ada di drivers/Kconfig'
              s = s[:i] + '\n' + line + s[i:]
              open(p, 'w', encoding='utf-8').write(s)
          PY
          grep -q 'fgetpriority/' drivers/Makefile \
            || printf '\nobj-$(CONFIG_FGETPRIORITY) += fgetpriority/\n' >> drivers/Makefile
          grep -q 'drivers/fgetpriority/Kconfig' drivers/Kconfig
          grep -q 'fgetpriority/' drivers/Makefile
          # Hook dipasang di tempat find_user() dipanggil sys_getpriority/setpriority/ioprio_*; fungsi harus tetap terpisah (LTO bisa meng-inline-nya).
          if grep -qE '^struct user_struct \*find_user\(kuid_t uid\)' kernel/user.c; then
            sed -i -E 's/^struct user_struct \*find_user\(kuid_t uid\)/noinline struct user_struct *find_user(kuid_t uid)/' kernel/user.c
            echo "::notice::find_user() ditandai noinline (kernel/user.c)"
          else
            grep -n 'find_user' kernel/user.c | head
            echo "::warning::deklarasi find_user() tidak sesuai dugaan; noinline tidak ditambahkan"
          fi
          echo "::notice::fgetpriority ${FGP_COMMIT:0:8} terintegrasi (built-in)"

      - name: Sediakan kallsyms_on_each_symbol() (kernel/kallsyms.c, kernel 4.19)
        working-directory: kernel_source
        run: |
          set -eo pipefail
          # (Dari build whyred) Link error: "undefined symbol: kallsyms_on_each_symbol" (referenced by vmlinux.o:(try_kallsyms_on_each_symbol)).
          # kernel/kallsyms.o ikut dikompilasi, jadi fungsi ini tidak aktif di tree ini (tidak ada, atau dibungkus #if yang tidak terpenuhi).
          # Skrip memeriksa guard preprosesor di sekitar definisi; bila perlu, menambah definisi sendiri HANYA pada kondisi
          # ketika definisi asli tidak aktif (jadi tidak pernah dobel). Hanya simbol inti kernel (sama dengan versi mainline tanpa modul).
          python3 - <<'PY'
          import re, sys
          p = 'kernel/kallsyms.c'
          s = open(p, encoding='utf-8').read()
          for need in ('kallsyms_expand_symbol', 'kallsyms_sym_address', 'kallsyms_num_syms'):
              if need not in s:
                  sys.exit("::error::%s tidak ada di kernel/kallsyms.c, struktur berubah; kirim isi file ini" % need)
          if 'KSU_COMPAT_KALLSYMS_ON_EACH_SYMBOL' in s:
              print('sudah ditambahkan sebelumnya'); sys.exit(0)

          # Hitung guard preprosesor aktif di titik definisi (kalau ada).
          m = re.search(r'^(?:int|long)\s+kallsyms_on_each_symbol\s*\(', s, re.M)
          guards = []
          if m:
              stack = []
              for line in s[:m.start()].split('\n'):
                  t = line.strip()
                  if not t.startswith('#'): continue
                  d = re.sub(r'^#\s*', '', t)
                  if d.startswith('ifdef'):    stack.append('defined(%s)' % d.split()[1])
                  elif d.startswith('ifndef'): stack.append('!defined(%s)' % d.split()[1])
                  elif re.match(r'if\b', d):   stack.append('(%s)' % re.sub(r'/\*.*?\*/|//.*$', '', d[2:]).strip())
                  elif d.startswith('elif') or d.startswith('else'):
                      if stack: stack[-1] = '!(%s)' % stack[-1] if d.startswith('else') else '0'
                  elif d.startswith('endif'):
                      if stack: stack.pop()
              guards = stack
              print('Definisi asli ada di baris', s[:m.start()].count('\n') + 1, '| guard:', guards or '(tanpa guard)')
              if not guards:
                  # definisi asli aktif tanpa guard: tree sudah punya fungsinya, tidak ada yang perlu ditambahkan
                  print('kallsyms_on_each_symbol() sudah terdefinisi tanpa guard di tree ini; tidak ada yang ditambahkan')
                  sys.exit(0)
          else:
              print('Definisi asli tidak ada di kernel/kallsyms.c')

          cond = ('#if !(%s)\n' % ' && '.join(guards)) if guards else ''
          end  = '#endif /* guard asli */\n' if guards else ''
          body = '''
          /* KSU_COMPAT_KALLSYMS_ON_EACH_SYMBOL: backport untuk kernel 4.19 (dipakai driver KernelSU). Hanya simbol inti kernel. */
          %sint kallsyms_on_each_symbol(int (*fn)(void *, const char *, struct module *, unsigned long), void *data)
          {
          \tchar namebuf[KSYM_NAME_LEN];
          \tunsigned long i;
          \tunsigned int off;
          \tint ret;

          \tfor (i = 0, off = 0; i < kallsyms_num_syms; i++) {
          \t\toff = kallsyms_expand_symbol(off, namebuf, ARRAY_SIZE(namebuf));
          \t\tret = fn(data, namebuf, NULL, kallsyms_sym_address(i));
          \t\tif (ret != 0)
          \t\t\treturn ret;
          \t}
          \treturn 0;
          }
          %s''' % (cond, end)
          import textwrap
          body = textwrap.dedent(body.replace('\n          ', '\n'))
          open(p, 'w', encoding='utf-8').write(s.rstrip('\n') + '\n' + body)
          print('kallsyms_on_each_symbol() ditambahkan di akhir', p)
          PY
          tail -30 kernel/kallsyms.c
          grep -n 'kallsyms_on_each_symbol' include/linux/kallsyms.h || echo "(tidak dideklarasikan di kallsyms.h; driver mendeklarasikan sendiri)"

      - name: Izinkan KALLSYMS_ALL tanpa DEBUG_KERNEL (init/Kconfig)
        # BakaSU (hook "SUSFS Inline Hook") selalu menyalakan KALLSYMS_ALL (lihat step Build kernel), jadi step ini
        # selalu dijalankan, bukan hanya untuk fgetpriority/mode syscall_table seperti build xxKSU.
        working-directory: kernel_source
        run: |
          set -eo pipefail
          # Kconfig 4.19: KALLSYMS_ALL "depends on DEBUG_KERNEL && KALLSYMS". Mengaktifkan DEBUG_KERNEL mengubah
          # banyak kode driver (qcacld-3.0: "incomplete type 'struct stack_trace'"), jadi cukup lepas dependensinya.
          # Efeknya hanya memasukkan simbol data (sys_call_table) ke kallsyms, dibutuhkan hook syscall_table dan fgetpriority.
          python3 - <<'PY'
          import re, sys
          p = 'init/Kconfig'
          s = open(p, encoding='utf-8').read()
          m = re.search(r'(config KALLSYMS_ALL\n(?:[^\n]*\n)*?\s*depends on )DEBUG_KERNEL && KALLSYMS', s)
          if not m:
              i = s.find('config KALLSYMS_ALL')
              print(s[i:i+400] if i >= 0 else 'config KALLSYMS_ALL tidak ada')
              sys.exit('::error::blok KALLSYMS_ALL di init/Kconfig tidak sesuai dugaan')
          s = s[:m.start()] + m.group(1) + 'KALLSYMS' + s[m.end():]
          open(p, 'w', encoding='utf-8').write(s)
          print('init/Kconfig: KALLSYMS_ALL tidak lagi butuh DEBUG_KERNEL')
          PY
          grep -n -A6 'config KALLSYMS_ALL' init/Kconfig

      - name: Setup NoMount (v2.3.1)
        working-directory: kernel_source
        run: |
          set -eo pipefail
          # Script setup diambil dari tag yang sama dengan versi yang dipasang.
          curl -fLSs --retry 3 -o /tmp/nomount-setup.sh \
            "https://raw.githubusercontent.com/maxsteeel/nomount/${NOMOUNT_VERSION}/kernel/setup.sh" \
            || { echo "::error::Gagal mengunduh kernel/setup.sh NoMount ${NOMOUNT_VERSION} (HTTP 404 = tag/path tidak ada)"; exit 1; }
          sh /tmp/nomount-setup.sh "${NOMOUNT_VERSION}"

          echo "== NoMount yang terpasang =="
          git -C NoMount describe --tags --always

          test -L fs/nomount
          test -f fs/nomount/nomount.c
          grep -q 'fs/nomount/Kconfig' fs/Kconfig
          grep -q 'CONFIG_NOMOUNT' fs/Makefile

      - name: Audit SELinux (enforcing bersih) & jejak sepolicy KernelSU
        if: env.SELINUX_HARDEN == 'true'
        working-directory: kernel_source
        run: |
          set -eo pipefail
          echo "== Pola 'paksa permissive' di security/selinux (hanya informasi) =="
          HACKS="$(git grep -nE 'selinux_enforcing[[:space:]]*=[[:space:]]*0[[:space:]]*;|selinux_state\.enforcing[[:space:]]*=[[:space:]]*0[[:space:]]*;|SECURITY_SELINUX_PERMISSIVE|selinux_permissive' -- security/selinux include/linux/selinux.h init 2>/dev/null || true)"
          if [ -n "$HACKS" ]; then
            echo "$HACKS"
            echo "::warning::Ada baris yang tampak memaksa SELinux permissive di tree (lihat log). Periksa manual."
          else
            echo "(tidak ada)"
          fi

          echo "== Aturan sepolicy yang disuntikkan driver KernelSU =="
          RULES="$(grep -rlE 'ksu_permissive|apply_kernelsu_rules' KernelSU --include='*.c' --include='*.h' 2>/dev/null || true)"
          echo "File: ${RULES:-(tidak ditemukan)}"
          if [ -n "$RULES" ]; then
            echo "-- SEBELUM --"
            grep -nE 'ksu_(permissive|type|typeattribute|attribute|allow|auditallow|dontaudit|transition|type_transition|genfscon|xperm)\b|KERNEL_SU_(DOMAIN|FILE)' $RULES | head -80 || true
            if [ "$KSU_SEPOLICY_NO_PERMISSIVE" = "true" ]; then
              perl -pi -e 's/^(\s*)(ksu_permissive\s*\([^;]*KERNEL_SU_DOMAIN[^;]*\)\s*;)/$1\/* enforcing-clean: $2 *\//' $RULES
              N="$(grep -c 'enforcing-clean:' $RULES | awk -F: '{s+=$NF} END{print s+0}')"
              echo "-- Pemanggilan ksu_permissive(KERNEL_SU_DOMAIN) yang dinonaktifkan: ${N} --"
              if [ "$N" -eq 0 ]; then
                echo "::notice::Tidak ada ksu_permissive(KERNEL_SU_DOMAIN) di driver ini; tidak ada yang diubah."
              fi
              grep -n 'ksu_permissive' $RULES | head -20 || true
            fi
          fi
          echo "::notice::Domain/tipe KernelSU (mis. su, ksu_file) adalah bagian bawaan root; kernel tidak bisa menghilangkannya."

      - name: Patch dts panel untuk MIUI/HyperOS
        working-directory: kernel_source
        run: |
          # Disalin dari bagian "Building for MIUI" di build.sh tree ini.
          D=arch/arm64/boot/dts/vendor/qcom
          # u <pola> <file...>: hapus komentar "//" di depan pola (aktifkan kembali baris)
          u() { p="$1"; shift; for f in "$@"; do sed -i "s|//${p}|${p}|g" "$D/$f"; done; }

          # Dimensi panel
          sed -i 's/<154>/<1537>/g' $D/dsi-panel-j1s* $D/dsi-panel-j2*
          sed -i 's/<155>/<1544>/g' $D/dsi-panel-j3s-37-02-0a-dsc-video.dtsi
          sed -i 's/<155>/<1545>/g' $D/dsi-panel-j11-38-08-0a-fhd-cmd.dtsi
          sed -i 's/<155>/<1546>/g' $D/dsi-panel-k11a-38-08-0a-dsc-cmd.dtsi $D/dsi-panel-l11r-38-08-0a-dsc-cmd.dtsi
          sed -i 's/<70>/<695>/g' $D/dsi-panel-j11-38-08-0a-fhd-cmd.dtsi $D/dsi-panel-j3s-37-02-0a-dsc-video.dtsi \
                                  $D/dsi-panel-k11a-38-08-0a-dsc-cmd.dtsi $D/dsi-panel-l11r-38-08-0a-dsc-cmd.dtsi
          sed -i 's/<71>/<710>/g' $D/dsi-panel-j1s* $D/dsi-panel-j2*

          # Smart FPS dan qsync
