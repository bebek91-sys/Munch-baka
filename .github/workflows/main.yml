          test -s "$PATCH_FILE" || { echo "::error::patch SUSFS tertanam gagal diekstrak"; exit 1; }
          grep -m1 'define SUSFS_VERSION' "$PATCH_FILE" || true
          PATCH_SHA="$(sha256sum "$PATCH_FILE" | cut -d' ' -f1)"
          echo "sha256 patch: ${PATCH_SHA}"
          if [ "$PATCH_SHA" != "$SUSFS_PATCH_SHA256_EXPECT" ]; then
            echo "::error::sha256 patch tertanam (${PATCH_SHA:0:12}) tidak sama dengan yang diharapkan (${SUSFS_PATCH_SHA256_EXPECT:0:12})"; exit 1
          fi
          grep -q 'define SUSFS_VERSION "v2.4' "$PATCH_FILE" \
            || echo "::warning::Patch bukan v2.4.x; sisi KernelSU di bawah disusun untuk v2.4.0"
          grep -q '^+++ b/fs/susfs.c' "$PATCH_FILE" \
            || { echo "::error::bukan patch SUSFS kernel (fs/susfs.c tidak ada)"; exit 1; }

          # Patch tidak boleh membawa hook inline ksu_handle_* (xxKSU memasang hook sendiri). Baris komentar diabaikan.
          INLINE_HOOKS="$(grep -E '^\+' "$PATCH_FILE" | grep -vE '^\+[[:space:]]*(//|/\*|\*)' | grep -cE 'ksu_handle_' || true)"
          if [ "${INLINE_HOOKS:-0}" -gt 0 ]; then
            echo "::warning::patch SUSFS memuat ${INLINE_HOOKS} baris hook inline ksu_handle_*; bisa bentrok dengan mode hook ${KSU_HOOK_MODE}"
          fi

          # Gerbang: tanpa sisi SUSFS di driver, fs/susfs.c gagal di-link dan CONFIG_KSU_SUSFS* tidak pernah ada.
          grep -rqs 'susfs_is_current_ksu_domain' KernelSU/kernel && grep -qs 'KSU_SUSFS' KernelSU/kernel/Kconfig \
            || { echo "::error::Driver tidak membawa sisi SUSFS"; exit 1; }

          # Tata letak driver KernelSU (diagnosis)
          echo "== Referensi SUSFS di driver =="
          grep -rln 'susfs' KernelSU/kernel 2>/dev/null | head -20 || echo "(tidak ada)"
          echo "== Kconfig KSU_SUSFS =="
          grep -n 'config KSU_SUSFS' KernelSU/kernel/Kconfig | head -30 || echo "(tidak ada)"

          # Terapkan patch. Hunk yang gagal karena konteks include tree ini berbeda (cmdline.c, task_mmu.c, namespace.c, super.c) dibenahi di bawah.
          patch -p1 -f -s --no-backup-if-mismatch < "$PATCH_FILE" > /tmp/susfs-apply.log 2>&1 || true
          echo "== Hunk gagal (hunk sukses/offset/fuzz tidak dicetak lagi) =="
          grep -E 'FAILED|Reversed|malformed|can.t find file' /tmp/susfs-apply.log || echo "(tidak ada)"
          REJ="$(find . -name '*.rej' -not -path './out/*' | sort)"
          if [ -n "$REJ" ]; then
            echo "== File .rej =="; echo "$REJ"
            OTHER="$(echo "$REJ" | grep -v -x -e './fs/proc/task_mmu.c.rej' -e './fs/proc/cmdline.c.rej' -e './fs/namespace.c.rej' -e './fs/super.c.rej' || true)"
            # Tree ini bisa punya konteks fs/namespace.c & fs/super.c yang berbeda dari patch. Hanya hunk include/extern dan
            # vfs_kern_mount() yang boleh gagal; keduanya dipasang ulang oleh fallback di bawah. Hunk lain = berhenti.
            [ ! -f fs/namespace.c.rej ] || [ "$(grep -c '^@@' fs/namespace.c.rej)" -le 2 ] \
              || OTHER="$OTHER ./fs/namespace.c.rej(>2 hunk)"
            [ ! -f fs/super.c.rej ] || [ "$(grep -c '^@@' fs/super.c.rej)" -le 1 ] \
              || OTHER="$OTHER ./fs/super.c.rej(>1 hunk)"
            if [ -n "$OTHER" ]; then
              for r in $REJ; do echo "----- $r"; cat "$r"; done
              echo "::error::Ada hunk SUSFS gagal selain task_mmu.c / cmdline.c / (hunk include & vfs_kern_mount di namespace.c, include di super.c) (lihat .rej di atas)"
              exit 1
            fi
          fi

          python3 - <<'PY'
          import os
          def edit(path, fn):
              s = open(path, encoding='utf-8').read()
              n = fn(s)
              if n != s:
                  open(path, 'w', encoding='utf-8').write(n)
                  print("diperbaiki:", path)
              else:
                  print("tidak perlu diubah:", path)

          def need(s, anchor, path):
              if anchor not in s:
                  raise SystemExit("::error::anchor tidak ada di %s: %r" % (path, anchor))

          # fs/proc/task_mmu.c: include susfs_def.h (hunk include gagal karena konteks berbeda)
          def task_mmu(s):
              if 'susfs_def.h' in s:
                  return s
              a = '#include <asm/elf.h>\n'
              need(s, a, 'fs/proc/task_mmu.c')
              blk = ('#if defined(CONFIG_KSU_SUSFS_SUS_KSTAT) || defined(CONFIG_KSU_SUSFS_SUS_MAP) || defined(CONFIG_KSU_SUSFS_OPEN_REDIRECT)\n'
                     '#include <linux/susfs_def.h>\n'
                     '#endif // #if defined(CONFIG_KSU_SUSFS_SUS_KSTAT) || defined(CONFIG_KSU_SUSFS_SUS_MAP) || defined(CONFIG_KSU_SUSFS_OPEN_REDIRECT)\n\n')
              return s.replace(a, blk + a, 1)
          edit('fs/proc/task_mmu.c', task_mmu)

          # fs/proc/cmdline.c: spoof cmdline (hunk gagal karena tree ini punya blok INITRAMFS_IGNORE_SKIP_FLAG)
          def cmdline(s):
              if 'susfs_spoof_cmdline_or_bootconfig' in s:
                  return s
              a = 'static int cmdline_proc_show(struct seq_file *m, void *v)\n{\n'
              need(s, a, 'fs/proc/cmdline.c')
              decl = ('#ifdef CONFIG_KSU_SUSFS_SPOOF_CMDLINE_OR_BOOTCONFIG\n'
                      'extern struct static_key_false susfs_is_fake_cmdline_or_bootconfig_buffer_set;\n'
                      'extern void susfs_spoof_cmdline_or_bootconfig(struct seq_file *m);\n'
                      '#endif\n\n')
              body = ('#ifdef CONFIG_KSU_SUSFS_SPOOF_CMDLINE_OR_BOOTCONFIG\n'
                      '\tif (static_branch_likely(&susfs_is_fake_cmdline_or_bootconfig_buffer_set)) {\n'
                      '\t\tsusfs_spoof_cmdline_or_bootconfig(m);\n'
                      '\t\tseq_putc(m, \'\\n\');\n'
                      '\t\treturn 0;\n'
                      '\t}\n'
                      '#endif\n')
              return s.replace(a, decl + a + body, 1)
          edit('fs/proc/cmdline.c', cmdline)

          # fs/stat.c memakai susfs_is_current_app_uid() dan STATX_SUS_KSTAT, tetapi tidak meng-include susfs_def.h
          def stat_c(s):
              if 'susfs_def.h' in s:
                  return s
              a = '#include <asm/unistd.h>\n'
              need(s, a, 'fs/stat.c')
              return s.replace(a, a + '#ifdef CONFIG_KSU_SUSFS_SUS_KSTAT\n#include <linux/susfs_def.h>\n#endif\n', 1)
          edit('fs/stat.c', stat_c)

          # fs/notify/fdinfo.c: show_fdinfo() memanggil show(m, mark, f) untuk semua callback, jadi fanotify_fdinfo
          # juga harus menerima argumen ketiga. (mount.h sudah di-include lewat fsnotify.h dan tidak punya include guard.)
          def fdinfo_c(s):
              if 'fanotify_fdinfo(struct seq_file *m, struct fsnotify_mark *mark, struct file *file)' in s:
                  return s   # sudah dibawa patch Jack
              old = 'static void fanotify_fdinfo(struct seq_file *m, struct fsnotify_mark *mark)\n{'
              new = ('#if defined(CONFIG_KSU_SUSFS_SUS_MOUNT) || defined(CONFIG_KSU_SUSFS_SUS_KSTAT)\n'
                     'static void fanotify_fdinfo(struct seq_file *m, struct fsnotify_mark *mark, struct file *file)\n'
                     '#else\n'
                     'static void fanotify_fdinfo(struct seq_file *m, struct fsnotify_mark *mark)\n'
                     '#endif\n{')
              need(s, old, 'fs/notify/fdinfo.c')
              return s.replace(old, new, 1)
          edit('fs/notify/fdinfo.c', fdinfo_c)

          # fs/namespace.c: di branch 'back' hunk include/extern dan vfs_kern_mount() gagal karena konteks berbeda.
          # Pasang ulang dengan anchor longgar (isi sama dengan hunk aslinya).
          def namespace_c(s):
              import re
              inc = '#include "internal.h"\n'
              if 'linux/susfs_def.h' not in s:
                  need(s, inc, 'fs/namespace.c')
                  s = s.replace(inc, inc + '#ifdef CONFIG_KSU_SUSFS\n#include <linux/susfs_def.h>\n#endif // #ifdef CONFIG_KSU_SUSFS\n', 1)
              if 'extern bool susfs_is_current_ksu_domain' not in s:
                  a = '#endif // #ifdef CONFIG_KSU_SUSFS\n'
                  i = s.index('linux/susfs_def.h')
                  j = s.index(a, i) + len(a)
                  s = s[:j] + ('\n#ifdef CONFIG_KSU_SUSFS_SUS_MOUNT\n'
                               'extern bool susfs_is_current_ksu_domain(void);\n'
                               'extern struct static_key_true susfs_is_sdcard_android_data_not_decrypted;\n'
                               '#endif // #ifdef CONFIG_KSU_SUSFS_SUS_MOUNT\n') + s[j:]
              if '#define CL_COPY_MNT_NS' not in s:
                  a = '#endif // #ifdef CONFIG_KSU_SUSFS_SUS_MOUNT\n'
                  i = s.index('extern bool susfs_is_current_ksu_domain')
                  j = s.index(a, i)
                  s = s[:j] + '#define CL_COPY_MNT_NS BIT(25) /* used by copy_mnt_ns() */\n' + s[j:]
              if 'bypass_orig_flow' not in s:
                  m = re.search(r'^vfs_kern_mount\(', s, re.M)
                  if not m:
                      raise SystemExit("::error::vfs_kern_mount() tidak ditemukan di fs/namespace.c")
                  m2 = re.compile(r'^\tmnt = alloc_vfsmnt\(([^;\n]*)\);\n', re.M).search(s, m.end(), m.end() + 2000)
                  if not m2:
                      print(s[m.start():m.start() + 1200])
                      raise SystemExit("::error::anchor 'mnt = alloc_vfsmnt(...)' tidak ada di vfs_kern_mount() (lihat isi fungsi di atas)")
                  pre = ('#ifdef CONFIG_KSU_SUSFS_SUS_MOUNT\n'
                         '\t// - We will just stop checking for ksu process if /sdcard/Android is accessible,\n'
                         '\t//   for the sake of performance\n'
                         '\tif (static_branch_unlikely(&susfs_is_sdcard_android_data_not_decrypted)) {\n'
                         '\t\tif (susfs_is_current_ksu_domain()) {\n'
                         '\t\t\tmnt = susfs_alloc_non_unshare_ksu_vfsmnt(name ?:"none");\n'
                         '\t\t\tgoto bypass_orig_flow;\n'
                         '\t\t}\n'
                         '\t}\n'
                         '#endif // #ifdef CONFIG_KSU_SUSFS_SUS_MOUNT\n\n')
                  post = ('\n#ifdef CONFIG_KSU_SUSFS_SUS_MOUNT\n'
                          'bypass_orig_flow:\n'
                          '#endif // #ifdef CONFIG_KSU_SUSFS_SUS_MOUNT\n')
                  s = s[:m2.start()] + pre + m2.group(0) + post + s[m2.end():]
              return s
          edit('fs/namespace.c', namespace_c)

          # fs/super.c: hunk include/extern gagal di branch 'back'
          def super_c(s):
              inc = '#include "internal.h"\n'
              if 'linux/susfs_def.h' in s and 'extern bool susfs_is_current_ksu_domain' in s:
                  return s
              need(s, inc, 'fs/super.c')
              pre = '' if 'linux/susfs_def.h' in s else '#ifdef CONFIG_KSU_SUSFS\n#include <linux/susfs_def.h>\n#endif // #ifdef CONFIG_KSU_SUSFS\n'
              post = '' if 'extern bool susfs_is_current_ksu_domain' in s else (
                  '\n#ifdef CONFIG_KSU_SUSFS_SUS_MOUNT\n'
                  'extern bool susfs_is_current_ksu_domain(void);\n'
                  'extern struct static_key_true susfs_is_sdcard_android_data_not_decrypted;\n'
                  '#endif // #ifdef CONFIG_KSU_SUSFS_SUS_MOUNT\n')
              return s.replace(inc, pre + inc + post, 1)
          edit('fs/super.c', super_c)

          # fs/susfs.c: patch Jack membawa filter prioritas tetapi tidak mencantumkannya di susfs_get_enabled_features(),
          # sehingga manager (BRENE) tidak menampilkan PRIORITY_UID_FILTER. Tambahkan entri sesudah blok fitur terakhir.
          def features_c(s):
              if 'CONFIG_KSU_SUSFS_PRIORITY_UID_FILTER' in s:
                  return s
              i = s.find('void susfs_get_enabled_features(')
              if i == -1:
                  raise SystemExit("::error::susfs_get_enabled_features() tidak ada di fs/susfs.c")
              a = '\n\tinfo->err = 0;\nout_copy_to_user:'
              j = s.find(a, i)
              if j == -1:
                  raise SystemExit("::error::titik sisip 'info->err = 0; out_copy_to_user' tidak ada di susfs_get_enabled_features()")
              blk = ('#ifdef CONFIG_KSU_SUSFS_PRIORITY_UID_FILTER\n'
                     '\tinfo->err = copy_config_to_buf("CONFIG_KSU_SUSFS_PRIORITY_UID_FILTER\\n", buf_ptr, &copied_size, SUSFS_ENABLED_FEATURES_SIZE);\n'
                     '\tif (info->err) goto out_copy_to_user;\n'
                     '\tbuf_ptr = info->enabled_features + copied_size;\n'
                     '#endif\n')
              return s[:j] + '\n' + blk.rstrip('\n') + s[j:]
          edit('fs/susfs.c', features_c)

          # Meniru susfs4ksu upstream (simonpunk, commit aa61fe06 "Make priority_uid_filter as new feature"): hook di
          # kernel/sys.c dan block/ioprio.c dijaga CONFIG_KSU_SUSFS_PRIORITY_UID_FILTER, bukan CONFIG_KSU_SUSFS, sehingga
          # fitur bisa dihidupkan/dimatikan saat kompilasi. Patch Jack belum mengikuti perubahan itu. Idempotent: dilewati
          # jika patch sudah memakai guard baru. Hanya baris guard plain CONFIG_KSU_SUSFS yang diganti; guard lain
          # (mis. CONFIG_KSU_SUSFS_SPOOF_UNAME di sys.c) tidak tersentuh karena dicocokkan sampai akhir baris.
          def prio_gate(s):
              if 'susfs_is_priority_uid_filtered' not in s or 'CONFIG_KSU_SUSFS_PRIORITY_UID_FILTER' in s:
                  return s
              return (s.replace('#ifdef CONFIG_KSU_SUSFS\n', '#ifdef CONFIG_KSU_SUSFS_PRIORITY_UID_FILTER\n')
                       .replace('#endif // #ifdef CONFIG_KSU_SUSFS\n', '#endif // #ifdef CONFIG_KSU_SUSFS_PRIORITY_UID_FILTER\n'))
          for _f in ('kernel/sys.c', 'block/ioprio.c', 'fs/ioprio.c'):
              if os.path.exists(_f):
                  edit(_f, prio_gate)

          PY
          find . -name '*.rej' -not -path './out/*' -delete

          # susfs_is_priority_uid_filtered (getpriority uid filter / "hide_third_party_apps", CMD 0x60030):
          # patch Jack >= 38bbbd5 (30 Okt 2026) membawanya NATIVE: definisi di fs/susfs.c, hook di kernel/sys.c
          # (setpriority/getpriority) dan block/ioprio.c (ioprio_set/ioprio_get). Tidak ada hook manual dan tidak ada stub lagi.
          # Bila SUSFS_PATCH_COMMIT diturunkan ke commit lama, pemeriksaan di bawah berhenti dengan pesan yang jelas.

          test -f fs/susfs.c
          test -f include/linux/susfs.h
          test -f include/linux/susfs_def.h
          grep -q 'susfs.o' fs/Makefile
          grep -q 'susfs_def.h' fs/proc/task_mmu.c
          grep -q 'susfs_spoof_cmdline_or_bootconfig' fs/proc/cmdline.c
          grep -q 'bypass_orig_flow' fs/namespace.c
          grep -q 'linux/susfs_def.h' fs/namespace.c
          grep -q 'linux/susfs_def.h' fs/super.c
          # Filter prioritas native dari patch Jack: definisi + 3 baris (1 extern + 2 pemakaian) di sys.c dan ioprio.
          grep -qE '^bool susfs_is_priority_uid_filtered\(' fs/susfs.c \
            || { echo "::error::fs/susfs.c tidak mendefinisikan susfs_is_priority_uid_filtered. SUSFS_PATCH_COMMIT (${SUSFS_PATCH_COMMIT}) lebih lama dari 38bbbd5 (30 Okt 2026); kosongkan pin atau naikkan."; exit 1; }
          IOPRIO_F="$(git grep -l 'SYSCALL_DEFINE3(ioprio_set' -- '*.c' | head -1 || true)"
          [ -n "$IOPRIO_F" ] || { echo "::error::SYSCALL_DEFINE3(ioprio_set,...) tidak ditemukan di tree ini"; exit 1; }
          [ "$(grep -c 'susfs_is_priority_uid_filtered' kernel/sys.c)" -ge 3 ] \
            || { echo "::error::hook priority-uid-filter di kernel/sys.c tidak dibawa patch (harusnya 1 extern + 2 pemakaian)"; grep -n 'susfs_is_priority_uid_filtered' kernel/sys.c; exit 1; }
          [ "$(grep -c 'susfs_is_priority_uid_filtered' "$IOPRIO_F")" -ge 3 ] \
            || { echo "::error::hook priority-uid-filter di ${IOPRIO_F} tidak dibawa patch (harusnya 1 extern + 2 pemakaian)"; grep -n 'susfs_is_priority_uid_filtered' "$IOPRIO_F"; exit 1; }
          [ "$(grep -c 'CONFIG_KSU_SUSFS_PRIORITY_UID_FILTER' kernel/sys.c)" -ge 6 ] \
            && [ "$(grep -c 'CONFIG_KSU_SUSFS_PRIORITY_UID_FILTER' "$IOPRIO_F")" -ge 6 ] \
            || { echo "::error::guard CONFIG_KSU_SUSFS_PRIORITY_UID_FILTER tidak terpasang lengkap di kernel/sys.c / ${IOPRIO_F}"; exit 1; }
          echo "::notice::SUSFS kernel 4.19 v2.4.0 (patch Jack tertanam sha ${SUSFS_PATCH_SHA256_EXPECT:0:8}) terpasang, termasuk filter prioritas native (sys.c, ${IOPRIO_F}, fs/susfs.c)"

      - name: Pastikan semua CMD_SUSFS_* dan fungsi SUSFS yang dipakai driver BakaSU tersedia
        if: ${{ env.SUSFS_ENABLE == 'true' }}
        working-directory: kernel_source
        run: |
          set -eo pipefail
          # Hemat build 30 menit: driver BakaSU (supercall/dispatch.c, dll.) harus menemukan semua CMD_SUSFS_* di include/linux/susfs_def.h.
          HDRS="include/linux/susfs_def.h include/linux/susfs.h"
          MISS=0
          for c in $(grep -rhoE '\bCMD_SUSFS_[A-Z0-9_]+' KernelSU/kernel | sort -u); do
            if grep -qE "#[[:space:]]*define[[:space:]]+${c}\b" $HDRS; then :; else echo "::error::${c} dipakai driver BakaSU tetapi tidak didefinisikan oleh patch SUSFS"; MISS=1; fi
          done
          echo "== Fungsi susfs_* yang dipanggil driver tetapi tidak dideklarasikan di header kernel (informasi) =="
          for f in $(grep -rhoE '\bsusfs_[a-z0-9_]+[[:space:]]*\(' KernelSU/kernel | tr -d ' (' | sort -u); do
            grep -qE "\b${f}\b" $HDRS && continue
            grep -rqE "^[A-Za-z_][A-Za-z0-9_ \*]*[[:space:]\*]${f}[[:space:]]*\(" KernelSU/kernel && continue
            echo "::warning::${f}() dipanggil driver tetapi tidak ada di header SUSFS kernel maupun didefinisikan di driver"
          done
          [ "$MISS" = 0 ] || exit 1
          echo "::notice::Semua CMD_SUSFS_* yang dipakai driver BakaSU tersedia di patch SUSFS"

      - name: Pasang hook inline SUSFS (Jack susfs_inline_hook_patches.sh)
        if: ${{ env.SUSFS_ENABLE == 'true' }}
        working-directory: kernel_source
        run: |
          set -eo pipefail
          # BakaSU mode "SUSFS Inline Hook" memeriksa saat kompilasi (kernel/tools/inline_hook_check.mk) bahwa sumber kernel punya
          # hook ksu_handle_* di sys.c, exec.c, open.c, read_write.c, stat.c, reboot.c, input.c. Patch kernel-side Jack
          # (susfs_patch_to_4.19.patch, step sebelumnya) hanya membawa SUSFS-nya; hook itu dipasang skrip Jack ini,
          # dari clone yang SAMA (/tmp/susfs-src) yang sudah dipakai step "Setup SUSFS (patch kernel 4.19 v2.4.0)".
          S="/tmp/susfs-src/${SUSFS_INLINE_HOOK_PATH}"
          [ -s "$S" ] || { echo "::error::${SUSFS_INLINE_HOOK_PATH} tidak ada di clone Jack (/tmp/susfs-src); cek apakah repo masih membawa skrip ini"; exit 1; }
          echo "Skrip hook Jack: sha256 $(sha256sum "$S" | cut -c1-16) (JackA1ltman/NonGKI_Kernel_Build_2nd @ ${SUSFS_PATCH_COMMIT:0:8})"
          [ -d drivers/kernelsu ] || { echo "::error::drivers/kernelsu belum ada; BakaSU harus sudah di-setup sebelum hook dipasang (skrip Jack membaca drivers/kernelsu)"; exit 1; }
          bash "$S" 2>&1 | tee /tmp/jack-hooks.log
          grep -q 'patch failed for unknown reasons' /tmp/jack-hooks.log \
            && { echo "::error::skrip hook Jack gagal memasang sebagian hook (lihat baris '[-] ... patch failed' di atas)"; exit 1; } || true

          # --- Penyesuaian ke BakaSU terbaru (tanda tangan fungsi di driver, bukan di skrip Jack) ---
          # 1) ksu_handle_sys_read di BakaSU menerima (fd, &buf, &count); skrip Jack masih memanggil dengan (fd) saja.
          sed -i 's/^extern __attribute__((cold)) int ksu_handle_sys_read(unsigned int fd);$/extern int ksu_handle_sys_read(unsigned int fd, char __user **buf_ptr, size_t *count_ptr);/' fs/read_write.c
          sed -i 's/^\([[:space:]]*\)ksu_handle_sys_read(fd);$/\1ksu_handle_sys_read(fd, \&buf, \&count);/' fs/read_write.c
          ! grep -qE 'ksu_handle_sys_read\(fd\)' fs/read_write.c \
            || { echo "::error::fs/read_write.c masih memanggil ksu_handle_sys_read(fd) (tanda tangan lama)"; grep -n 'ksu_handle_sys_read' fs/read_write.c; exit 1; }
          # 2) Pesan log setresuid: skrip Jack menulis "\\n" (backslash literal) di dalam string C.
          sed -i 's/ksu_handle_setresuid()\\\\n/ksu_handle_setresuid()\\n/' kernel/sys.c

          # --- Verifikasi: sama dengan yang diperiksa BakaSU saat kompilasi (gagal di sini = hemat build 30 menit) ---
          chk() { grep -q "$1" "$2" && echo "OK      $1 di $2" || { echo "::error::hook $1 tidak ada di $2"; BAD=1; }; }
          BAD=0
          chk ksu_handle_setresuid          kernel/sys.c
          chk ksu_handle_execveat           fs/exec.c
          chk ksu_handle_faccessat          fs/open.c
          chk ksu_handle_sys_read           fs/read_write.c
          chk ksu_handle_stat               fs/stat.c
          chk ksu_handle_vfs_fstat          fs/stat.c
          chk ksu_handle_sys_reboot         kernel/reboot.c
          chk ksu_handle_input_handle_event drivers/input/input.c
          # hook lama yang ditolak BakaSU
          for p in "ksu_vfs_read_hook fs/read_write.c" "ksu_input_hook drivers/input/input.c" "ksu_execveat_hook fs/exec.c" \
                   "ksu_init_rc_hook fs/read_write.c" "ksu_init_rc_hook fs/stat.c"; do
            set -- $p
            if grep -wq "$1" "$2"; then echo "::error::hook lama '$1' masih ada di $2 (ditolak BakaSU)"; BAD=1; fi
          done
          # tidak boleh ada fallback 'manual hook' yang mengubah mode kompilasi BakaSU
          grep -wn 'CONFIG_KSU_MANUAL_HOOK' kernel/sys.c fs/exec.c fs/open.c fs/read_write.c fs/stat.c kernel/reboot.c drivers/input/input.c \
            && echo "::warning::ada guard CONFIG_KSU_MANUAL_HOOK di sumber kernel (BakaSU akan memperingatkan)" || true
          [ "$BAD" = 0 ] || exit 1
          echo "== Ringkasan perubahan hook =="
          git diff --stat -- kernel/sys.c fs/exec.c fs/open.c fs/read_write.c fs/stat.c kernel/reboot.c drivers/input/input.c security/ | tail -12
          echo "::notice::Hook SUSFS inline (Jack) terpasang dan lolos pemeriksaan setara inline_hook_check.mk BakaSU"

      - name: Verifikasi SELinux BakaSU (hook SUSFS + jejak fix)
        working-directory: kernel_source
        run: |
          set -eo pipefail
          D=drivers/kernelsu/selinux
          [ -d "$D" ] || { F="$(find KernelSU/kernel -name rules.c -path '*selinux*' | head -1)"; D="$(dirname "$F")"; }
          echo "== Direktori SELinux BakaSU: $D =="; ls "$D" || true
          echo "== Titik seqno / latest_granting / reset cache =="
          grep -rnE 'latest_granting|reset_avc_cache|avc_ss_reset|selinux_status' "$D" | head -30 || true
          grep -rqE 'latest_granting|reset_avc_cache' "$D" \
            || echo "::warning::tidak ada penanganan latest_granting/reset_avc_cache di $D (struktur BakaSU berbeda dari dugaan, cek log di atas)"
          echo "== selinux_hide =="
          SH="$(find KernelSU/kernel -name 'selinux_hide*' | head -3)"
          if [ -n "$SH" ]; then echo "OK      $SH"; else echo "::warning::berkas selinux_hide tidak ditemukan di BakaSU (fitur bisa berada di tempat lain)"; fi
          if [ "$SUSFS_ENABLE" = "true" ]; then
            case "${SUSFS_GLUE:-no}" in
              bawaan*)
                grep -rqE 'susfs_add_sus_type' drivers/kernelsu/ 2>/dev/null || echo "::warning::driver BakaSU tidak memanggil susfs_add_sus_type (SUS_TYPE bisa tidak terisi)"
                grep -rqE '\bsusfs_init[[:space:]]*\(' drivers/kernelsu/ 2>/dev/null || echo "::warning::driver BakaSU tidak memanggil susfs_init()" ;;
              *) echo "SUSFS sisi-KernelSU tidak terpasang: pemeriksaan hook SUSFS dilewati" ;;
            esac
          fi
          echo "::notice::SELinux BakaSU diperiksa (${KSU_SEL_NOTE})"

      - name: Diagnosis SELinux / DirtySepolicy BakaSU + SUSFS (informasi, tidak menggagalkan build)
        working-directory: kernel_source
        run: |
          set +e
          # Penyamaran SELinux BakaSU ("Hide SELinux modifications" / selinux_hide) dan penanda tipe sepolicy
          # (susfs_add_sus_type, BakaSU PR #648) adalah perilaku DRIVER; tidak ada saklar build-time yang harus
          # dinyalakan di sini. Langkah ini hanya MEMBUKTIKAN lewat log apakah build ini memuatnya.
          D=drivers/kernelsu
          echo "== BakaSU ${KSU_LABEL} (${KSU_COMMIT:0:12}) =="
          echo "== 1) Commit penyamaran SELinux/sepolicy di riwayat =="
          for pat in 'fix detection point caused by susfs skip commits' 'fix regression of more than one sid target one context'; do
            R="$(git -C KernelSU log -i --grep="$pat" --format='%h %s' HEAD | head -1)"
            if [ -n "$R" ]; then echo "OK      $R"; else echo "::warning::tidak ada commit '$pat' di riwayat ref ini"; fi
          done
          echo "== 2) Driver menandai tipe/edge sepolicy ke SUSFS (anti DirtySepolicy)? =="
          grep -rnE 'susfs_add_sus_type|susfs_add_sus_avd_allowed_by_type' $D 2>/dev/null | head -8
          grep -rqE 'susfs_add_sus_type' $D 2>/dev/null && S_TYPE=1 || S_TYPE=0
          [ "$S_TYPE" = 1 ] || echo "::warning::driver tidak memanggil susfs_add_sus_type: tipe ksu/ksu_file bisa terbaca VALID oleh detektor DirtySepolicy"
          echo "== 3) Jalur selinux_hide BakaSU yang BENAR-BENAR dipakai =="
          grep -q 'ksu_selinux_hide_running' security/selinux/hooks.c 2>/dev/null && ANCHOR=1 || ANCHOR=0
          OWN_IMPL=0
          for f in $(find KernelSU/kernel/feature -path '*selinux_hide*' -name '*.c' 2>/dev/null); do
            grep -qE '^\s*(static\s+)?(int|ssize_t)\s+my_write_context' "$f" && { OWN_IMPL=1; echo "OK      implementasi sendiri my_write_context di $f"; }
          done
          echo "== Ringkasan: anchor_susfs_di_kernel=${ANCHOR} bakasu_pakai_implementasi_sendiri=${OWN_IMPL} driver_tandai_tipe=${S_TYPE} =="
          if [ "$ANCHOR" = 0 ] && [ "$OWN_IMPL" = 1 ]; then
            echo "::notice::Kernel tanpa anchor susfs -> BakaSU pakai implementasi context/access/setprocattr MILIK SENDIRI (tidak bergantung ke patch SUSFS Jack). Penyamaran node selinuxfs berjalan selama 'Hide SELinux modifications' AKTIF di manager."
          elif [ "$ANCHOR" = 0 ] && [ "$OWN_IMPL" = 0 ]; then
            echo "::warning::Kernel tanpa anchor susfs TAPI implementasi sendiri tidak ditemukan (struktur berbeda dari dugaan). Build yang lolos tanpa error link berarti simbolnya tetap ada di tempat lain; kirim isi folder feature/selinux_hide untuk dicek ulang."
          else
            echo "::notice::Kernel tree ini punya anchor susfs: BakaSU mendelegasikan context/access/setprocattr ke fungsi SUSFS kernel-side. Pastikan build ini tidak gagal link."
          fi
          exit 0

      - name: Integrasikan fgetpriority (aerath-stuff, built-in)
        if: ${{ env.FGP_ENABLE == 'true' }}
        working-directory: kernel_source
        run: |
          set -eo pipefail
          rm -rf /tmp/fgp
          git clone -q "$FGP_REPO" /tmp/fgp
          if [ -n "$FGP_REF" ]; then
            git -C /tmp/fgp checkout -q "$FGP_REF" \
              || { echo "::error::fgetpriority_ref '${FGP_REF}' tidak ditemukan di ${FGP_REPO}"; exit 1; }
          fi
          FGP_COMMIT="$(git -C /tmp/fgp rev-parse HEAD)"
          echo "FGP_COMMIT=${FGP_COMMIT}" >> "$GITHUB_ENV"
          git -C /tmp/fgp log -1 --format='fgetpriority: %h %s'
          for f in main.c routine.h routine_kp.c routine_raw.c arch.h kernel.h arm64_branch_insn.h Makefile Kconfig; do
            test -f "/tmp/fgp/kernel/$f" || { echo "::error::kernel/$f tidak ada di fgetpriority (struktur repo berubah)"; exit 1; }
          done
          rm -rf drivers/fgetpriority; mkdir -p drivers/fgetpriority
          cp -a /tmp/fgp/kernel/. drivers/fgetpriority/
          rm -f drivers/fgetpriority/Makefile.ddk drivers/fgetpriority/build_ddk.sh
          # Built-in saja: ubah tristate/default m menjadi bool/default y
          sed -i -E 's/^([[:space:]]*)tristate "uid filter"/\1bool "uid filter (getpriority hiding)"/; s/^([[:space:]]*)default m$/\1default y/' drivers/fgetpriority/Kconfig
          grep -q 'bool "uid filter' drivers/fgetpriority/Kconfig || { echo "::error::Kconfig fgetpriority gagal diubah ke bool"; cat drivers/fgetpriority/Kconfig; exit 1; }
          python3 - <<'PY'
          p = 'drivers/Kconfig'
          s = open(p, encoding='utf-8').read()
          line = 'source "drivers/fgetpriority/Kconfig"'
          if line not in s:
              i = s.rfind('\nendmenu')
              assert i >= 0, 'endmenu tidak ada di drivers/Kconfig'
              s = s[:i] + '\n' + line + s[i:]
              open(p, 'w', encoding='utf-8').write(s)
          PY
          grep -q 'fgetpriority/' drivers/Makefile \
            || printf '\nobj-$(CONFIG_FGETPRIORITY) += fgetpriority/\n' >> drivers/Makefile
          grep -q 'drivers/fgetpriority/Kconfig' drivers/Kconfig
          grep -q 'fgetpriority/' drivers/Makefile
          # Hook dipasang di tempat find_user() dipanggil sys_getpriority/setpriority/ioprio_*; fungsi harus tetap terpisah (LTO bisa meng-inline-nya).
          if grep -qE '^struct user_struct \*find_user\(kuid_t uid\)' kernel/user.c; then
            sed -i -E 's/^struct user_struct \*find_user\(kuid_t uid\)/noinline struct user_struct *find_user(kuid_t uid)/' kernel/user.c
            echo "::notice::find_user() ditandai noinline (kernel/user.c)"
          else
            grep -n 'find_user' kernel/user.c | head
            echo "::warning::deklarasi find_user() tidak sesuai dugaan; noinline tidak ditambahkan"
          fi
          echo "::notice::fgetpriority ${FGP_COMMIT:0:8} terintegrasi (built-in)"

      - name: Sediakan kallsyms_on_each_symbol() (kernel/kallsyms.c, kernel 4.19)
        working-directory: kernel_source
        run: |
          set -eo pipefail
          # (Dari build whyred) Link error: "undefined symbol: kallsyms_on_each_symbol" (referenced by vmlinux.o:(try_kallsyms_on_each_symbol)).
          # kernel/kallsyms.o ikut dikompilasi, jadi fungsi ini tidak aktif di tree ini (tidak ada, atau dibungkus #if yang tidak terpenuhi).
          # Skrip memeriksa guard preprosesor di sekitar definisi; bila perlu, menambah definisi sendiri HANYA pada kondisi
          # ketika definisi asli tidak aktif (jadi tidak pernah dobel). Hanya simbol inti kernel (sama dengan versi mainline tanpa modul).
          python3 - <<'PY'
          import re, sys
          p = 'kernel/kallsyms.c'
          s = open(p, encoding='utf-8').read()
          for need in ('kallsyms_expand_symbol', 'kallsyms_sym_address', 'kallsyms_num_syms'):
              if need not in s:
                  sys.exit("::error::%s tidak ada di kernel/kallsyms.c, struktur berubah; kirim isi file ini" % need)
          if 'KSU_COMPAT_KALLSYMS_ON_EACH_SYMBOL' in s:
              print('sudah ditambahkan sebelumnya'); sys.exit(0)

          # Hitung guard preprosesor aktif di titik definisi (kalau ada).
          m = re.search(r'^(?:int|long)\s+kallsyms_on_each_symbol\s*\(', s, re.M)
          guards = []
          if m:
              stack = []
              for line in s[:m.start()].split('\n'):
                  t = line.strip()
                  if not t.startswith('#'): continue
                  d = re.sub(r'^#\s*', '', t)
                  if d.startswith('ifdef'):    stack.append('defined(%s)' % d.split()[1])
                  elif d.startswith('ifndef'): stack.append('!defined(%s)' % d.split()[1])
                  elif re.match(r'if\b', d):   stack.append('(%s)' % re.sub(r'/\*.*?\*/|//.*$', '', d[2:]).strip())
                  elif d.startswith('elif') or d.startswith('else'):
                      if stack: stack[-1] = '!(%s)' % stack[-1] if d.startswith('else') else '0'
                  elif d.startswith('endif'):
                      if stack: stack.pop()
              guards = stack
              print('Definisi asli ada di baris', s[:m.start()].count('\n') + 1, '| guard:', guards or '(tanpa guard)')
              if not guards:
                  # definisi asli aktif tanpa guard: tree sudah punya fungsinya, tidak ada yang perlu ditambahkan
                  print('kallsyms_on_each_symbol() sudah terdefinisi tanpa guard di tree ini; tidak ada yang ditambahkan')
                  sys.exit(0)
          else:
              print('Definisi asli tidak ada di kernel/kallsyms.c')

          cond = ('#if !(%s)\n' % ' && '.join(guards)) if guards else ''
          end  = '#endif /* guard asli */\n' if guards else ''
          body = '''
          /* KSU_COMPAT_KALLSYMS_ON_EACH_SYMBOL: backport untuk kernel 4.19 (dipakai driver KernelSU). Hanya simbol inti kernel. */
          %sint kallsyms_on_each_symbol(int (*fn)(void *, const char *, struct module *, unsigned long), void *data)
          {
          \tchar namebuf[KSYM_NAME_LEN];
          \tunsigned long i;
          \tunsigned int off;
          \tint ret;

          \tfor (i = 0, off = 0; i < kallsyms_num_syms; i++) {
          \t\toff = kallsyms_expand_symbol(off, namebuf, ARRAY_SIZE(namebuf));
          \t\tret = fn(data, namebuf, NULL, kallsyms_sym_address(i));
          \t\tif (ret != 0)
          \t\t\treturn ret;
          \t}
          \treturn 0;
          }
          %s''' % (cond, end)
          import textwrap
          body = textwrap.dedent(body.replace('\n          ', '\n'))
          open(p, 'w', encoding='utf-8').write(s.rstrip('\n') + '\n' + body)
          print('kallsyms_on_each_symbol() ditambahkan di akhir', p)
          PY
          tail -30 kernel/kallsyms.c
          grep -n 'kallsyms_on_each_symbol' include/linux/kallsyms.h || echo "(tidak dideklarasikan di kallsyms.h; driver mendeklarasikan sendiri)"

      - name: Izinkan KALLSYMS_ALL tanpa DEBUG_KERNEL (init/Kconfig)
        # BakaSU (hook "SUSFS Inline Hook") selalu menyalakan KALLSYMS_ALL (lihat step Build kernel), jadi step ini
        # selalu dijalankan, bukan hanya untuk fgetpriority/mode syscall_table seperti build xxKSU.
        working-directory: kernel_source
        run: |
          set -eo pipefail
          # Kconfig 4.19: KALLSYMS_ALL "depends on DEBUG_KERNEL && KALLSYMS". Mengaktifkan DEBUG_KERNEL mengubah
          # banyak kode driver (qcacld-3.0: "incomplete type 'struct stack_trace'"), jadi cukup lepas dependensinya.
          # Efeknya hanya memasukkan simbol data (sys_call_table) ke kallsyms, dibutuhkan hook syscall_table dan fgetpriority.
          python3 - <<'PY'
          import re, sys
          p = 'init/Kconfig'
          s = open(p, encoding='utf-8').read()
          m = re.search(r'(config KALLSYMS_ALL\n(?:[^\n]*\n)*?\s*depends on )DEBUG_KERNEL && KALLSYMS', s)
          if not m:
              i = s.find('config KALLSYMS_ALL')
              print(s[i:i+400] if i >= 0 else 'config KALLSYMS_ALL tidak ada')
              sys.exit('::error::blok KALLSYMS_ALL di init/Kconfig tidak sesuai dugaan')
          s = s[:m.start()] + m.group(1) + 'KALLSYMS' + s[m.end():]
          open(p, 'w', encoding='utf-8').write(s)
          print('init/Kconfig: KALLSYMS_ALL tidak lagi butuh DEBUG_KERNEL')
          PY
          grep -n -A6 'config KALLSYMS_ALL' init/Kconfig

      - name: Setup NoMount (v2.3.1)
        working-directory: kernel_source
        run: |
          set -eo pipefail
          # Script setup diambil dari tag yang sama dengan versi yang dipasang.
          curl -fLSs --retry 3 -o /tmp/nomount-setup.sh \
            "https://raw.githubusercontent.com/maxsteeel/nomount/${NOMOUNT_VERSION}/kernel/setup.sh" \
            || { echo "::error::Gagal mengunduh kernel/setup.sh NoMount ${NOMOUNT_VERSION} (HTTP 404 = tag/path tidak ada)"; exit 1; }
          sh /tmp/nomount-setup.sh "${NOMOUNT_VERSION}"

          echo "== NoMount yang terpasang =="
          git -C NoMount describe --tags --always

          test -L fs/nomount
          test -f fs/nomount/nomount.c
          grep -q 'fs/nomount/Kconfig' fs/Kconfig
          grep -q 'CONFIG_NOMOUNT' fs/Makefile

      - name: Audit SELinux (enforcing bersih) & jejak sepolicy KernelSU
        if: env.SELINUX_HARDEN == 'true'
        working-directory: kernel_source
        run: |
          set -eo pipefail
          echo "== Pola 'paksa permissive' di security/selinux (hanya informasi) =="
          HACKS="$(git grep -nE 'selinux_enforcing[[:space:]]*=[[:space:]]*0[[:space:]]*;|selinux_state\.enforcing[[:space:]]*=[[:space:]]*0[[:space:]]*;|SECURITY_SELINUX_PERMISSIVE|selinux_permissive' -- security/selinux include/linux/selinux.h init 2>/dev/null || true)"
          if [ -n "$HACKS" ]; then
            echo "$HACKS"
            echo "::warning::Ada baris yang tampak memaksa SELinux permissive di tree (lihat log). Periksa manual."
          else
            echo "(tidak ada)"
          fi

          echo "== Aturan sepolicy yang disuntikkan driver KernelSU =="
          RULES="$(grep -rlE 'ksu_permissive|apply_kernelsu_rules' KernelSU --include='*.c' --include='*.h' 2>/dev/null || true)"
          echo "File: ${RULES:-(tidak ditemukan)}"
          if [ -n "$RULES" ]; then
            echo "-- SEBELUM --"
            grep -nE 'ksu_(permissive|type|typeattribute|attribute|allow|auditallow|dontaudit|transition|type_transition|genfscon|xperm)\b|KERNEL_SU_(DOMAIN|FILE)' $RULES | head -80 || true
            if [ "$KSU_SEPOLICY_NO_PERMISSIVE" = "true" ]; then
              perl -pi -e 's/^(\s*)(ksu_permissive\s*\([^;]*KERNEL_SU_DOMAIN[^;]*\)\s*;)/$1\/* enforcing-clean: $2 *\//' $RULES
              N="$(grep -c 'enforcing-clean:' $RULES | awk -F: '{s+=$NF} END{print s+0}')"
              echo "-- Pemanggilan ksu_permissive(KERNEL_SU_DOMAIN) yang dinonaktifkan: ${N} --"
              if [ "$N" -eq 0 ]; then
                echo "::notice::Tidak ada ksu_permissive(KERNEL_SU_DOMAIN) di driver ini; tidak ada yang diubah."
              fi
              grep -n 'ksu_permissive' $RULES | head -20 || true
            fi
          fi
          echo "::notice::Domain/tipe KernelSU (mis. su, ksu_file) adalah bagian bawaan root; kernel tidak bisa menghilangkannya."

      - name: Patch dts panel untuk MIUI/HyperOS
        working-directory: kernel_source
        run: |
          # Disalin dari bagian "Building for MIUI" di build.sh tree ini.
          D=arch/arm64/boot/dts/vendor/qcom
          # u <pola> <file...>: hapus komentar "//" di depan pola (aktifkan kembali baris)
          u() { p="$1"; shift; for f in "$@"; do sed -i "s|//${p}|${p}|g" "$D/$f"; done; }

          # Dimensi panel
          sed -i 's/<154>/<1537>/g' $D/dsi-panel-j1s* $D/dsi-panel-j2*
          sed -i 's/<155>/<1544>/g' $D/dsi-panel-j3s-37-02-0a-dsc-video.dtsi
          sed -i 's/<155>/<1545>/g' $D/dsi-panel-j11-38-08-0a-fhd-cmd.dtsi
          sed -i 's/<155>/<1546>/g' $D/dsi-panel-k11a-38-08-0a-dsc-cmd.dtsi $D/dsi-panel-l11r-38-08-0a-dsc-cmd.dtsi
          sed -i 's/<70>/<695>/g' $D/dsi-panel-j11-38-08-0a-fhd-cmd.dtsi $D/dsi-panel-j3s-37-02-0a-dsc-video.dtsi \
                                  $D/dsi-panel-k11a-38-08-0a-dsc-cmd.dtsi $D/dsi-panel-l11r-38-08-0a-dsc-cmd.dtsi
          sed -i 's/<71>/<710>/g' $D/dsi-panel-j1s* $D/dsi-panel-j2*

          # Smart FPS dan qsync
          sed -i 's|// mi,mdss-dsi-pan-enable-smart-fps|mi,mdss-dsi-pan-enable-smart-fps|g' $D/dsi-panel*
          sed -i 's|// mi,mdss-dsi-smart-fps-max_framerate|mi,mdss-dsi-smart-fps-max_framerate|g' $D/dsi-panel*
          sed -i 's|// qcom,mdss-dsi-pan-enable-smart-fps|qcom,mdss-dsi-pan-enable-smart-fps|g' $D/dsi-panel*
          sed -i 's|qcom,mdss-dsi-qsync-min-refresh-rate|//qcom,mdss-dsi-qsync-min-refresh-rate|g' $D/dsi-panel*

          # Refresh rate yang didukung MIUI
          sed -i 's/120 90 60/120 90 60 50 30/g' $D/dsi-panel-g7a-36-02-0c-dsc-video.dtsi \
                 $D/dsi-panel-g7a-37-02-0a-dsc-video.dtsi $D/dsi-panel-g7a-37-02-0b-dsc-video.dtsi
          sed -i 's/144 120 90 60/144 120 90 60 50 48 30/g' $D/dsi-panel-j3s-37-02-0a-dsc-video.dtsi

          # Kontrol brightness dari dtsi
          u '39 00 00 00 00 00 03 51 03 FF' dsi-panel-j9-38-0a-0a-fhd-video.dtsi
          u '39 00 00 00 00 00 03 51 0D FF' dsi-panel-j2-p2-1-38-0c-0a-dsc-cmd.dtsi
          u '39 00 00 00 00 00 05 51 0F 8F 00 00' dsi-panel-j1s-42-02-0a-dsc-cmd.dtsi \
            dsi-panel-j1s-42-02-0a-mp-dsc-cmd.dtsi dsi-panel-j2-mp-42-02-0b-dsc-cmd.dtsi \
            dsi-panel-j2-p2-1-42-02-0b-dsc-cmd.dtsi dsi-panel-j2s-mp-42-02-0a-dsc-cmd.dtsi
          u '39 01 00 00 00 00 03 51 00 00' dsi-panel-j2-38-0c-0a-dsc-cmd.dtsi
          u '39 01 00 00 00 00 03 51 03 FF' dsi-panel-j11-38-08-0a-fhd-cmd.dtsi dsi-panel-j9-38-0a-0a-fhd-video.dtsi
          u '39 01 00 00 00 00 03 51 07 FF' dsi-panel-j1u-42-02-0b-dsc-cmd.dtsi \
            dsi-panel-j2-42-02-0b-dsc-cmd.dtsi dsi-panel-j2-p1-42-02-0b-dsc-cmd.dtsi
          u '39 01 00 00 00 00 03 51 0F FF' dsi-panel-j1u-42-02-0b-dsc-cmd.dtsi \
            dsi-panel-j2-42-02-0b-dsc-cmd.dtsi dsi-panel-j2-p1-42-02-0b-dsc-cmd.dtsi
          u '39 01 00 00 00 00 05 51 07 FF 00 00' dsi-panel-j1s-42-02-0a-dsc-cmd.dtsi \
            dsi-panel-j1s-42-02-0a-mp-dsc-cmd.dtsi dsi-panel-j2-mp-42-02-0b-dsc-cmd.dtsi \
            dsi-panel-j2-p2-1-42-02-0b-dsc-cmd.dtsi dsi-panel-j2s-mp-42-02-0a-dsc-cmd.dtsi
          u '39 01 00 00 01 00 03 51 03 FF' dsi-panel-j11-38-08-0a-fhd-cmd.dtsi
          u '39 01 00 00 11 00 03 51 03 FF' dsi-panel-j2-p2-1-38-0c-0a-dsc-cmd.dtsi

          git status --short arch/arm64/boot/dts | head -20

      - name: Perbaiki techpack audio saat DEBUG_FS aktif
        if: env.DEBUG_FS_ON == 'true'
        working-directory: kernel_source
        run: |
          set -eo pipefail
          # Tree ini dibangun dengan DEBUG_FS mati (resep build.sh). Dengan CONFIG_DEBUG_FS=y, wcd-mbhc-v2.c memakai
          # DEBUGFS_DIR_NAME dan DEBUGFS_HEADSET_STATUS_FILE_NAME yang tidak terdefinisi (error di build sebelumnya).
          # Nama itu hanya label entri debugfs, jadi aman diberi nilai cadangan (#ifndef: tidak menimpa definisi yang sudah ada).
          F=techpack/audio/asoc/codecs/wcd-mbhc-v2.c
          test -f "$F" || { echo "::warning::$F tidak ada, dilewati"; exit 0; }
          echo "== Definisi makro di techpack/audio (diagnosis) =="
          grep -rn 'DEBUGFS_DIR_NAME\|DEBUGFS_HEADSET_STATUS_FILE_NAME' techpack/audio | head -10 || true
          python3 - "$F" <<'PYF'
          import re, sys
          path = sys.argv[1]
          s = open(path, encoding='utf-8', errors='surrogateescape').read()
          if 'MBHC_DEBUGFS_FALLBACK' in s:
              print("sudah diperbaiki:", path); sys.exit(0)
          incs = list(re.finditer(r'^#include[^\n]*\n', s, flags=re.M))
          if not incs:
              raise SystemExit("::error::tidak ada #include di " + path)
          pos = incs[-1].end()
          blk = ('\n/* MBHC_DEBUGFS_FALLBACK: nilai cadangan saat CONFIG_DEBUG_FS=y */\n'
                 '#ifndef DEBUGFS_DIR_NAME\n#define DEBUGFS_DIR_NAME "wcd_mbhc"\n#endif\n'
                 '#ifndef DEBUGFS_HEADSET_STATUS_FILE_NAME\n#define DEBUGFS_HEADSET_STATUS_FILE_NAME "headset_status"\n#endif\n')
          open(path, 'w', encoding='utf-8', errors='surrogateescape').write(s[:pos] + blk + s[pos:])
          print("diperbaiki:", path)
          PYF
          grep -n 'MBHC_DEBUGFS_FALLBACK' "$F"

      - name: Build kernel (MIUI/HyperOS)
        working-directory: kernel_source
        run: |
          set -o pipefail

          MAKE_ARGS="ARCH=arm64 SUBARCH=arm64 O=out CC=clang \
            CROSS_COMPILE=aarch64-linux-gnu- CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
            CROSS_COMPILE_COMPAT=arm-linux-gnueabi- CLANG_TRIPLE=aarch64-linux-gnu-"

          clang --version | head -1
          make $MAKE_ARGS ${DEVICE}_defconfig 2>&1 | tee ../build.log

          # --- Opsi MIUI (sama dengan build.sh tree ini) ---
          scripts/config --file out/.config \
            --set-str STATIC_USERMODEHELPER_PATH /system/bin/micd \
            -e PERF_CRITICAL_RT_TASK -e SF_BINDER -e OVERLAY_FS -d DEBUG_FS \
            -e MIGT -e MIGT_ENERGY_MODEL -e MIHW -e PACKAGE_RUNTIME_INFO \
            -e BINDER_OPT -e KPERFEVENTS -e MILLET -e PERF_HUMANTASK \
            -d LTO_CLANG -d LOCALVERSION_AUTO -e XIAOMI_MIUI -d MI_MEMORY_SYSFS \
            -e TASK_DELAY_ACCT -e MIUI_ZRAM_MEMORY_TRACKING \
            -d CONFIG_MODULE_SIG_SHA512 -d CONFIG_MODULE_SIG_HASH \
            -e MI_FRAGMENTION -e PERF_HELPER -e BOOTUP_RECLAIM -e MI_RECLAIM -e RTMM

          # --- Nama versi kernel ---
          scripts/config --file out/.config --set-str LOCALVERSION "${KERNEL_LOCALVERSION}"

          # --- Governor CPU default saat boot = schedutil (lihat catatan di env CPU_GOV_DEFAULT_SCHEDUTIL) ---
          # "choice" di Kconfig: semua opsi CPU_FREQ_DEFAULT_GOV_* lain harus eksplisit dimatikan juga,
          # scripts/config tidak tahu ini saling meniadakan.
          if [ "$CPU_GOV_DEFAULT_SCHEDUTIL" = "true" ]; then
            scripts/config --file out/.config \
              -d CPU_FREQ_DEFAULT_GOV_PERFORMANCE -d CPU_FREQ_DEFAULT_GOV_POWERSAVE \
              -d CPU_FREQ_DEFAULT_GOV_USERSPACE -d CPU_FREQ_DEFAULT_GOV_ONDEMAND \
              -d CPU_FREQ_DEFAULT_GOV_CONSERVATIVE -e CPU_FREQ_DEFAULT_GOV_SCHEDUTIL
          fi

          # --- Sama dengan v5, hanya IPC_LOGGING dimatikan + nama versi ---
          # PSI dan low memory killer TIDAK disentuh (mengikuti defconfig bawaan tree).
          # Fitur MIUI (MI_RECLAIM/RTMM/BOOTUP_RECLAIM/MILLET) tetap aktif seperti v5.
          # Hanya IPC_LOGGING (log debug Qualcomm yang memakan RAM) yang dimatikan.
          # Frekuensi, governor, dan tabel OPP CPU/GPU tidak disentuh sama sekali.
          # (Opsi yang tidak ada di tree ini otomatis dibuang oleh olddefconfig.)
          if [ "$IPC_LOGGING_OFF" = "true" ]; then
            scripts/config --file out/.config -d IPC_LOGGING
          else
            scripts/config --file out/.config -e IPC_LOGGING
          fi

          # --- SELinux enforcing bersih (mengikuti konvensi GKI) ---
          # Tanpa jalur "SELinux disabled" (selinux=0 / sysfs disable). DEVELOP tetap aktif agar init
          # Android bisa mengatur mode; mode akhirnya enforcing dari init/policy, bukan dari kernel.
          if [ "$SELINUX_HARDEN" = "true" ]; then
            scripts/config --file out/.config \
              -e SECURITY -e SECURITY_SELINUX -e SECURITY_SELINUX_DEVELOP \
              -d SECURITY_SELINUX_BOOTPARAM -d SECURITY_SELINUX_DISABLE
          fi

          # --- Perbaikan jaringan: 5G + WiFi ---
          if [ "$NET_TUNE" = "true" ]; then
            # TCP_CONG_BBR berada di dalam menu TCP_CONG_ADVANCED; tanpa itu olddefconfig membuang BBR diam-diam
            # (itulah sebabnya build sebelumnya tetap memakai cubic). DEFAULT_TCP_CONG / DEFAULT_NET_SCH adalah
            # nilai turunan dari pilihan DEFAULT_*, jadi yang diset adalah pilihannya, bukan stringnya.
            # Tree ini tidak punya pilihan default qdisc (DEFAULT_NET_SCH tidak ada), jadi qdisc default tidak bisa diubah lewat config.
            scripts/config --file out/.config \
              -e TCP_CONG_ADVANCED -e TCP_CONG_BBR \
              -d DEFAULT_CUBIC -d DEFAULT_RENO -e DEFAULT_BBR \
              -e NET_SCH_FQ -e NET_SCH_FQ_CODEL \
              -d CFG80211_DEFAULT_PS \
              -e NETFILTER_XT_TARGET_TCPMSS -e NETFILTER_XT_MATCH_OWNER -e NETFILTER_XT_MATCH_QUOTA2
          fi

          # --- BakaSU + NoMount ---
          # Hook tree lama sudah dinonaktifkan di step Setup BakaSU (guard CONFIG_KSU dialihkan); hook dipasang driver.
          ksu_has() { grep -qE "^[[:space:]]*config[[:space:]]+$1([[:space:]]|$)" drivers/kernelsu/Kconfig; }
          scripts/config --file out/.config -e KSU -e KALLSYMS -e KALLSYMS_ALL -e NOMOUNT -e SECCOMP
          # Mode hook BakaSU = "SUSFS Inline Hook" (satu pilihan Kconfig 'choice' dengan KSU_MANUAL_HOOK / KSU_TRACEPOINT_HOOK).
          # KSU_SUSFS dihidupkan di blok SUSFS_OPTS di bawah; hook ksu_handle_* sudah dipasang langkah 'Pasang hook inline SUSFS (Jack)'.
          scripts/config --file out/.config -d KSU_MANUAL_HOOK -d KSU_TRACEPOINT_HOOK -e KSU_SUSFS
          echo "Mode hook BakaSU: SUSFS Inline Hook (CONFIG_KSU_SUSFS)"
          if [ "$KSU_STEALTH" = "true" ]; then
            if ksu_has KSU_NOPRINTK; then
              scripts/config --file out/.config -e KSU_NOPRINTK -d KSU_DEBUG
              echo "::notice::KSU_STEALTH: KSU_NOPRINTK=y"
            else
              echo "::notice::BakaSU ${KSU_LABEL} tidak punya opsi KSU_NOPRINTK (sudah dihapus upstream); KSU_STEALTH dilewati"
            fi
          fi
          # fgetpriority built-in (drivers/fgetpriority): butuh sys_call_table/simbol di kallsyms (KALLSYMS_ALL, sudah diaktifkan di atas).
          if [ "$FGP_ENABLE" = "true" ]; then
            scripts/config --file out/.config -e FGETPRIORITY
          fi
          # DEBUG_FS: opsi MIUI di atas mematikannya; dinyalakan lagi jika input debug_fs=true.
          if [ "$DEBUG_FS_ON" = "true" ]; then
            scripts/config --file out/.config -e DEBUG_FS
            echo "DEBUG_FS dinyalakan (debug_fs=true)"
          fi

          # --- SUSFS ---
          SUSFS_OPTS=""
          if [ "$SUSFS_ENABLE" = "true" ]; then
            scripts/config --file out/.config \
              -e KSU_SUSFS -e KSU_SUSFS_SUS_PATH -e KSU_SUSFS_SUS_MOUNT -e KSU_SUSFS_SUS_KSTAT \
              -e KSU_SUSFS_SPOOF_UNAME -e KSU_SUSFS_HIDE_KSU_SUSFS_SYMBOLS \
              -e KSU_SUSFS_SPOOF_CMDLINE_OR_BOOTCONFIG -e KSU_SUSFS_OPEN_REDIRECT -e KSU_SUSFS_SUS_MAP
            if [ "$SUSFS_PRIORITY_UID_FILTER" = "true" ]; then
              scripts/config --file out/.config -e KSU_SUSFS_PRIORITY_UID_FILTER
            else
              scripts/config --file out/.config -d KSU_SUSFS_PRIORITY_UID_FILTER
            fi
            SUSFS_OPTS="CONFIG_KSU_SUSFS CONFIG_KSU_SUSFS_SUS_PATH CONFIG_KSU_SUSFS_SUS_MOUNT CONFIG_KSU_SUSFS_SUS_KSTAT CONFIG_KSU_SUSFS_SPOOF_UNAME CONFIG_KSU_SUSFS_HIDE_KSU_SUSFS_SYMBOLS CONFIG_KSU_SUSFS_SPOOF_CMDLINE_OR_BOOTCONFIG CONFIG_KSU_SUSFS_OPEN_REDIRECT CONFIG_KSU_SUSFS_SUS_MAP"
            [ "$SUSFS_PRIORITY_UID_FILTER" = "true" ] && SUSFS_OPTS="$SUSFS_OPTS CONFIG_KSU_SUSFS_PRIORITY_UID_FILTER"
            [ "$SUSFS_KERNEL_LOG" = "true" ] && SUSFS_OPTS="$SUSFS_OPTS CONFIG_KSU_SUSFS_ENABLE_LOG"
            # TRY_UMOUNT sisi driver (supercall.c) memanggil susfs_add_try_umount(), yang TIDAK ada di patch
            # kernel SUSFS v2.3.0 (error: implicit declaration). Umount sudah ditangani KernelSU lewat
            # feature/kernel_umount.c, jadi opsi ini dimatikan. SUS_MEMFD juga dimatikan (tidak ada di patch ini).
            scripts/config --file out/.config -d KSU_SUSFS_TRY_UMOUNT -d KSU_SUSFS_SUS_MEMFD
            if [ "$SUSFS_KERNEL_LOG" = "true" ]; then
              scripts/config --file out/.config -e KSU_SUSFS_ENABLE_LOG
            else
              scripts/config --file out/.config -d KSU_SUSFS_ENABLE_LOG
            fi
          fi

          # --- Default MM (swappiness, lru_gen min_ttl, ZRAM lz4) ---
          # v37: swappiness & min_ttl dibuat lebih moderat (lihat komentar di env MM_TUNE_*) supaya game
          # tidak memicu reclaim/swap berlebihan saat working-set masih aktif dipakai -> mengurangi microstutter.
          if [ "$MM_TUNE" = "true" ]; then
            if grep -qE '^int vm_swappiness = [0-9]+;' mm/vmscan.c; then
              sed -i -E "s/^int vm_swappiness = [0-9]+;/int vm_swappiness = ${MM_TUNE_SWAPPINESS};/" mm/vmscan.c
              echo "OK      vm_swappiness default = ${MM_TUNE_SWAPPINESS}"
            else
              echo "::warning::pola 'int vm_swappiness = N;' tidak ditemukan di mm/vmscan.c, swappiness tidak diubah"
            fi
            if grep -qE 'lru_gen_min_ttl' mm/vmscan.c; then
              sed -i -E "s/^(static unsigned long|static u64|unsigned long|u64)[[:space:]]+lru_gen_min_ttl[[:space:]]*(__read_mostly)?[[:space:]]*=[[:space:]]*[^;]+;/\1 lru_gen_min_ttl = ${MM_TUNE_LRU_GEN_MIN_TTL_MS};/" mm/vmscan.c
              grep -n 'lru_gen_min_ttl' mm/vmscan.c | head -5 || true
            else
              echo "::notice::Tree ini tidak punya MGLRU (lru_gen_min_ttl tidak ada), bagian min_ttl dilewati"
            fi
          fi

          make $MAKE_ARGS olddefconfig 2>&1 | tee -a ../build.log

          # --- Pastikan simbol hook terpilih benar-benar aktif. Jika tidak, tampilkan Kconfig-nya + sisa konfigurasi KSU,
          #     lalu coba penuhi "depends on" simbol itu secara otomatis (positif -> -e, negasi -> -d) dan olddefconfig ulang.
          HOOK_SYM="$KSU_HOOK_SYM"
          if [ -n "$HOOK_SYM" ] && ! grep -q "^CONFIG_${HOOK_SYM}=y" out/.config; then
            echo "::warning::CONFIG_${HOOK_SYM} tidak aktif setelah olddefconfig; diagnosis + coba penuhi dependensinya"
            echo "== KSU/KPROBES/KALLSYMS di defconfig tree =="
            grep -nE 'KSU|KPROBES|KALLSYMS' "arch/arm64/configs/${DEVICE}_defconfig" || echo "(tidak ada)"
            echo "== KSU/KPROBES/KALLSYMS di out/.config (SESUDAH olddefconfig) =="
            grep -E '^(# )?CONFIG_(KSU|KPROBES|KALLSYMS|MODULES|HAVE_KPROBES)[A-Z0-9_]*[= ]' out/.config || true
            python3 - "$HOOK_SYM" <<'PYDEP' > /tmp/ksu-dep-opts.txt
          import re, sys
          sym = sys.argv[1]
          err = lambda *a: print(*a, file=sys.stderr)
          lines = open('drivers/kernelsu/Kconfig', encoding='utf-8').read().split('\n')
          idx = next((i for i, l in enumerate(lines) if re.match(r'^config\s+' + sym + r'\s*$', l)), None)
          if idx is None:
              err('simbol', sym, 'tidak ada di drivers/kernelsu/Kconfig'); sys.exit(0)
          hdr = re.compile(r'^(config|menuconfig|choice|endchoice|menu|endmenu|if|endif|comment|source)\b')
          c0 = None
          for i in range(idx, -1, -1):
              if lines[i].startswith('endchoice'): break
              if lines[i].startswith('choice'): c0 = i; break
          err('== Kconfig: blok', 'choice' if c0 is not None else 'config', 'yang memuat', sym, '==')
          if c0 is not None:
              c1 = next((i for i in range(idx, len(lines)) if lines[i].startswith('endchoice')), len(lines) - 1)
              err('\n'.join(lines[c0:c1 + 1]))
          else:
              e = next((i for i in range(idx + 1, len(lines)) if hdr.match(lines[i])), len(lines))
              err('\n'.join(lines[idx:e]))
          # kumpulkan "depends on" milik simbol (dan header choice, jika ada)
          deps = []
          e = next((i for i in range(idx + 1, len(lines)) if hdr.match(lines[i])), len(lines))
          scopes = [lines[idx + 1:e]]
          if c0 is not None:
              f = next((i for i in range(c0 + 1, len(lines)) if lines[i].startswith('config')), len(lines))
              scopes.append(lines[c0 + 1:f])
          for sc in scopes:
              for l in sc:
                  m = re.match(r'^\s*depends on\s+(.*)$', l)
                  if m: deps.append(re.sub(r'\s+if\s+.*$', '', m.group(1)).strip())
          opts = []
          for ex in deps:
              if '||' in ex or re.search(r'[=<>]', ex):
                  err('dependensi tidak bisa diselesaikan otomatis:', ex); continue
              for tok in ex.split('&&'):
                  tok = tok.strip().strip('()').strip()
                  neg = tok.startswith('!')
                  name = tok.lstrip('!').strip().strip('()')
                  if re.fullmatch(r'[A-Z0-9_]+', name) and name not in ('y', 'm', 'n', sym):
                      opts += ['-d' if neg else '-e', name]
          err('dependensi terdeteksi:', deps, '->', ' '.join(opts) or '(tidak ada)')
          print(' '.join(opts))
          PYDEP
            DEP_OPTS="$(cat /tmp/ksu-dep-opts.txt)"
            echo "== Opsi dependensi yang diterapkan: ${DEP_OPTS:-(tidak ada)} =="
            if [ -n "$DEP_OPTS" ]; then
              scripts/config --file out/.config $DEP_OPTS -e "$HOOK_SYM"
              make $MAKE_ARGS olddefconfig 2>&1 | tee -a ../build.log
            fi
            if ! grep -q "^CONFIG_${HOOK_SYM}=y" out/.config; then
              echo "== KSU di out/.config setelah percobaan ulang =="
              grep -E '^(# )?CONFIG_(KSU|KPROBES|KALLSYMS|MODULES)[A-Z0-9_]*[= ]' out/.config || true
              echo "::error::CONFIG_${HOOK_SYM} tetap tidak aktif. Kirim log ini (blok Kconfig + daftar KSU di atas) untuk diagnosis."
              exit 1
            fi
            echo "OK      CONFIG_${HOOK_SYM}=y (setelah memenuhi dependensi)"
          fi

          # --- Tahap prepare (bounds.c, asm-offsets, vdso, dll) sekali saja, sebelum build penuh ---
          # Jika error muncul di sini, penyebabnya toolchain/tree.
          if ! make $MAKE_ARGS prepare > ../prepare.log 2>&1; then
            echo "== prepare gagal; 60 baris terakhir prepare.log =="
            tail -n 60 ../prepare.log
            echo "::error::Tahap prepare gagal ; lihat prepare.log"
            cat ../prepare.log >> ../build.log
            exit 1
          fi
          echo "OK      make prepare"

          # Kode versi driver yang benar-benar dipakai compiler diverifikasi setelah build selesai
          # (step "Verifikasi versi driver = versi manager (BakaSU)", dari berkas .cmd kbuild).

          # Pastikan opsi benar-benar aktif (Kconfig membuang opsi yang tidak dikenal)
          MISSING=0
          FGP_OPT=""; [ "$FGP_ENABLE" = "true" ] && FGP_OPT="CONFIG_FGETPRIORITY"
          for opt in CONFIG_KSU CONFIG_NOMOUNT CONFIG_KALLSYMS CONFIG_SECCOMP CONFIG_SECURITY_SELINUX CONFIG_XIAOMI_MIUI ${FGP_OPT} ${SUSFS_OPTS}; do
            if grep -q "^${opt}=y" out/.config; then
              echo "OK      ${opt}=y"
            else
              echo "MISSING ${opt}  (tidak aktif di out/.config)"
              MISSING=1
            fi
          done
          if [ "$MISSING" -ne 0 ]; then
            echo "== Diagnosis: KSU/NOMOUNT di out/.config =="
            grep -E '^(# )?CONFIG_(KSU|NOMOUNT|OVERLAY_FS|KPROBES|MODULES)[A-Z0-9_]*[= ]' out/.config || true
            echo "== Kconfig KSU =="
            sed -n '1,60p' drivers/kernelsu/Kconfig || true
            echo "::error::Ada opsi kernel yang tidak aktif, lihat daftar MISSING di atas. Jika CONFIG_KSU hilang: periksa Kconfig BakaSU di log (drivers/kernelsu harus terpasang dan terdaftar di drivers/Kconfig)."
            exit 1
          fi
          # Pastikan opsi hook KernelSU sesuai mode yang dipilih (keduanya saling meniadakan)
          if [ "$DEBUG_FS_ON" = "true" ]; then
            grep -q '^CONFIG_DEBUG_FS=y' out/.config \
              && echo "OK      CONFIG_DEBUG_FS=y" \
              || { echo "::error::debug_fs=true tetapi CONFIG_DEBUG_FS tidak aktif di out/.config"; exit 1; }
          fi
          WANT="CONFIG_${KSU_HOOK_SYM}"
          if ! grep -q "^${WANT}=y" out/.config; then
            echo "== KSU/KALLSYMS di out/.config =="; grep -E '^(# )?CONFIG_(KSU|KALLSYMS|KALLSYMS_ALL|MODULES|KPROBES)[A-Z0-9_]*[= ]' out/.config || true
            echo "::error::${WANT} tidak aktif di out/.config (cek dependensi KSU/KALLSYMS/ARM64 di Kconfig BakaSU)"
            exit 1
          fi
          if ! grep -q '^CONFIG_KALLSYMS_ALL=y' out/.config; then
            echo "::error::CONFIG_KALLSYMS_ALL tidak aktif (dibutuhkan hook SUSFS Inline + fgetpriority)"; exit 1
          fi
          if [ "$SUSFS_ENABLE" = "true" ]; then
            if ! grep -q '^CONFIG_KSU_SUSFS=y' out/.config; then
              echo "::error::CONFIG_KSU_SUSFS tidak aktif di out/.config (Kconfig sisi KernelSU tidak mengenalnya atau dependensi KSU tidak terpenuhi)"
              exit 1
            fi
            echo "== Opsi SUSFS di out/.config =="
            grep -E '^CONFIG_KSU_SUSFS' out/.config || true
            SUSFS_SUB="$(grep -cE '^CONFIG_KSU_SUSFS_[A-Z_]+=y' out/.config || true)"
            echo "Sub-opsi SUSFS aktif: ${SUSFS_SUB} (10 = SUS_PATH, SUS_MOUNT, SUS_KSTAT, SPOOF_UNAME, ENABLE_LOG, HIDE_KSU_SUSFS_SYMBOLS, SPOOF_CMDLINE_OR_BOOTCONFIG, OPEN_REDIRECT, SUS_MAP, PRIORITY_UID_FILTER)"
            if [ "$SUSFS_PRIORITY_UID_FILTER" = "true" ] && [ "$SUSFS_KERNEL_LOG" = "true" ] && [ "${SUSFS_SUB:-0}" -ne 10 ]; then
              echo "::warning::Sub-opsi SUSFS aktif ${SUSFS_SUB}, diharapkan 10 (opsi bawaan lain seperti TRY_UMOUNT/SUS_MEMFD sengaja dimatikan)"
            fi
          fi
          grep -E '^CONFIG_(KSU|KPROBES|KALLSYMS|SECCOMP)' out/.config || true
          if [ "$FGP_ENABLE" = "true" ]; then
            grep -q "^CONFIG_KALLSYMS_ALL=y" out/.config || { echo "::error::CONFIG_KALLSYMS_ALL tidak aktif (dibutuhkan fgetpriority)"; exit 1; }
          fi
          if [ "$CPU_GOV_DEFAULT_SCHEDUTIL" = "true" ]; then
            grep -q '^CONFIG_CPU_FREQ_DEFAULT_GOV_SCHEDUTIL=y' out/.config \
              && echo "OK      CONFIG_CPU_FREQ_DEFAULT_GOV_SCHEDUTIL=y" \
              || echo "::warning::CPU_GOV_DEFAULT_SCHEDUTIL: schedutil tidak jadi default governor di out/.config"
          fi
          echo "== SELinux & block layer di out/.config =="
          grep -E '^(CONFIG_SECURITY_SELINUX[A-Z_]*=|# CONFIG_SECURITY_SELINUX[A-Z_]* is not set|CONFIG_DEFAULT_SECURITY|CONFIG_SCSI_MQ_DEFAULT=|CONFIG_MQ_IOSCHED_[A-Z_]*=|CONFIG_IOSCHED_[A-Z_]*=|CONFIG_DEFAULT_IOSCHED=|CONFIG_BLK_DEV_ZONED=)' out/.config || true
          if [ "$SELINUX_HARDEN" = "true" ]; then
            for opt in CONFIG_SECURITY_SELINUX CONFIG_SECURITY_SELINUX_DEVELOP; do
              grep -q "^${opt}=y" out/.config || { echo "::error::${opt} tidak aktif"; exit 1; }
            done
            for opt in CONFIG_SECURITY_SELINUX_DISABLE CONFIG_SECURITY_SELINUX_BOOTPARAM; do
              if grep -q "^${opt}=y" out/.config; then
                echo "::error::${opt} masih aktif (harus mati agar SELinux tidak bisa dimatikan)"; exit 1
              fi
            done
          fi
          echo "== Opsi jaringan/WiFi (untuk dibandingkan dengan build lain) =="
          grep -E '^CONFIG_(CFG80211|MAC80211|CNSS2|CNSS_QCA6390|QCA_CLD_WLAN|IPV6|NETFILTER_XT_TARGET_TCPMSS|NETFILTER_XT_MATCH_(OWNER|QUOTA2|BPF)|CGROUP_BPF|BPF_SYSCALL|INET_UDP_DIAG|TCP_CONG_[A-Z]+|DEFAULT_TCP_CONG|IPC_LOGGING|DEBUG_FS|MILLET|TCP_CONG_ADVANCED|CFG80211_DEFAULT_PS|ZRAM_DEF_COMP_[A-Z0-9]+|NET_SCH_FQ|DEFAULT_NET_SCH|DEFAULT_BBR|IPA3|RMNET|MHI_BUS|PCI_MSM)[A-Z0-9_]*[= ]' out/.config || true
          if [ "$NET_TUNE" = "true" ]; then
            for opt in CONFIG_TCP_CONG_BBR CONFIG_DEFAULT_BBR; do
              grep -q "^${opt}=y" out/.config && echo "OK      ${opt}=y" \
                || echo "::warning::NET_TUNE: ${opt} tidak aktif di out/.config (cek dependensi di net/ipv4/Kconfig / net/sched/Kconfig)"
            done
            grep -E '^CONFIG_DEFAULT_(TCP_CONG|NET_SCH)=' out/.config || true
          fi
          echo "== Status opsi memori/PSI & versi (hanya informasi, tidak diubah) =="
          grep -E '^(CONFIG_LOCALVERSION=|CONFIG_PSI=|CONFIG_PSI_DEFAULT_DISABLED=|CONFIG_ANDROID_LOW_MEMORY_KILLER=|CONFIG_MILLET=|CONFIG_MI_RECLAIM=|CONFIG_RTMM=|CONFIG_BOOTUP_RECLAIM=)' out/.config || true
          for opt in MI_RECLAIM RTMM BOOTUP_RECLAIM MILLET; do
            grep -q "^CONFIG_${opt}=y" out/.config && echo "OK      CONFIG_${opt}=y" || echo "::warning::CONFIG_${opt} tidak aktif"
          done
          for opt in IPC_LOGGING; do
            grep -q "^CONFIG_${opt}=y" out/.config && echo "MASIH AKTIF: CONFIG_${opt} (ditarik dependensi lain)" || echo "mati: CONFIG_${opt}"
          done
          # Hanya informasi (nama simbol display berbeda antar tree, jadi tidak dijadikan syarat)
          echo "== Opsi display di out/.config =="
          grep -E '^CONFIG_(DRM|MSM_SDE|MSM_DSI|DRM_MSM|FB_MSM|MSM_)[A-Z0-9_]*=' out/.config | head -40 || true

          make $MAKE_ARGS -j"$(nproc)" 2>&1 | tee -a ../build.log
          echo "== Info KernelSU di build ini =="
          grep -E '^-- (KernelSU|KSU|BakaSU|SUSFS)' ../build.log | sort -u || true
          echo "== Driver BakaSU / SUSFS ikut ter-link? =="
          grep -cE ' [a-zA-Z] (ksu_|susfs_)' out/System.map || true
          grep -E ' [a-zA-Z] (kernelsu_init|susfs_init)$' out/System.map || true

          test -f out/arch/arm64/boot/Image
          echo "Generating dtb..."
          find out/arch/arm64/boot/dts -name '*.dtb' -exec cat {} + > out/arch/arm64/boot/dtb
          ls -la out/arch/arm64/boot/Image out/arch/arm64/boot/dtb
          strings out/arch/arm64/boot/Image | grep -m1 'Linux version' || true
          REL="$(cat out/include/config/kernel.release)"
          echo "kernel.release = $REL"
          if [ "$REL" != "4.19.${KERNEL_SUBLEVEL}${KERNEL_LOCALVERSION}" ]; then
            echo "::warning::Nama versi tidak sesuai target (4.19.${KERNEL_SUBLEVEL}${KERNEL_LOCALVERSION}), hasil: $REL"
          fi

      - name: Diagnosis BakaSU (informasi, tidak menggagalkan build)
        working-directory: kernel_source
        run: |
          set +e
          echo "== Driver BakaSU ikut ter-link? (jumlah simbol ksu_ di System.map) =="
          grep -cE ' [a-zA-Z] ksu_' out/System.map
          grep -E ' [a-zA-Z] (kernelsu_init|ksu_handle_[a-z_]+)$' out/System.map | head -12
          echo "== Config terkait =="
          grep -E '^(# )?CONFIG_(KSU|KALLSYMS|KALLSYMS_ALL|SECCOMP|SECURITY_SELINUX|FGETPRIORITY)[A-Z_]*[= ]' out/.config
          echo "== SUSFS / fgetpriority ikut ter-link? =="
          echo "simbol susfs_: $(grep -cE ' [a-zA-Z] susfs_' out/System.map)"
          grep -E 'susfs_init|gphook_find_user|fgetpriority_init' out/System.map | head -6
          echo "== Waktu build kernel (cocokkan dengan uname -v di HP untuk memastikan zip yang benar ter-flash) =="
          strings out/arch/arm64/boot/Image* 2>/dev/null | grep -m1 'Linux version'

      - name: Verifikasi versi driver = versi manager (BakaSU)
        working-directory: kernel_source
        run: |
          set +e
          echo "== -DKSU_VERSION yang benar-benar dipakai compiler (dari berkas .cmd kbuild) =="
          GOT="$(grep -rhoE 'DKSU_VERSION=[0-9]+' out/drivers/kernelsu 2>/dev/null | sort -u)"
          echo "${GOT:-(tidak ditemukan)}"
          WANT="DKSU_VERSION=${KSU_MGR_CODE}"
          if [ -z "$GOT" ]; then
            echo "::warning::-DKSU_VERSION tidak ditemukan di out/drivers/kernelsu; versi driver tidak bisa dipastikan = ${KSU_MGR_CODE}. Cek 'Setup BakaSU' (definisi KSU_VERSION sebelum/sesudah)."
          elif [ "$GOT" = "$WANT" ]; then
            echo "::notice::Versi driver ${KSU_MGR_CODE} = versionCode manager BakaSU"
          else
            echo "::warning::Versi driver di build ($(echo $GOT | tr '\n' ' ')) BEDA dari manager ${KSU_MGR_CODE}. Kirim log 'Setup BakaSU' supaya pola KSU_VERSION di Kbuild bisa disesuaikan."
          fi
          exit 0

      - name: Ringkasan error (jika gagal)
        if: failure()
        run: |
          test -f build.log || exit 0
          echo "== 40 error pertama =="
          grep -n -E 'error:|undefined symbol|\*\*\* ' build.log | head -40 || true
          if grep -q -E "undefined (symbol|reference).*ksu_" build.log; then
            echo "::error::Ada simbol ksu_* yang dipanggil kode tree tetapi tidak disediakan driver fork ini (hook sumber bawaan tree belum sepenuhnya dinonaktifkan)."
          fi
          if grep -q "cannot be used against symbol '__crc_" build.log; then
            echo "::error::Simbol EXPORT gagal diberi versi oleh genksyms (cari 'version generation failed')."
          fi
          if grep -q -E "error:.*ksu|undefined (symbol|reference).*KSU" build.log; then
            echo "::error::Ada error terkait KSU: periksa daftar sisa baris ksu_ di file tree pada step Setup KernelSU (guard hook lama harus sudah dialihkan)."
          fi
          grep -n "version generation failed" build.log | head -10 || true

      - name: Package AnyKernel3
        run: |
          set -eo pipefail
          # Fork AnyKernel3 milik tree ini (branch kona) membaca kernels/Image dan kernels/dtb.
          # Zip tidak menyertakan dtbo.img; partisi dtbo stock tidak diganti.
          git clone --depth=1 -b kona --single-branch https://github.com/liyafe1997/AnyKernel3 anykernel
          rm -rf anykernel/kernels
          mkdir -p anykernel/kernels
          cp kernel_source/out/arch/arm64/boot/Image anykernel/kernels/
          cp kernel_source/out/arch/arm64/boot/dtb anykernel/kernels/
          cd anykernel
          zip -r9 ../VORQEN-POCO-F4-munch-HyperOS-${TOOLCHAIN}.zip ./* -x .git .gitignore out/ ./*.zip

      - name: Upload kernel artifact
        uses: actions/upload-artifact@v6
        with:
          name: VORQEN-POCO-F4-munch-HyperOS-${{ matrix.toolchain }}
          path: VORQEN-POCO-F4-munch-HyperOS-${{ matrix.toolchain }}.zip
          if-no-files-found: error

      - name: Publish ke GitHub Release (unduh langsung, tanpa zip ganda)
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="munch-hyperos-${TOOLCHAIN}-${{ github.run_number }}"
          if [ "$TOOLCHAIN" = "zyc" ]; then TC_DESC="ZyCromerZ Clang 16.0.6 (${ZYC_TAG}); varian uji, kalau video/kamera crash pakai varian proton"; else TC_DESC="proton-clang 20210522"; fi
          ASSETS=(VORQEN-POCO-F4-munch-HyperOS-${TOOLCHAIN}.zip)
          gh release create "$TAG" "${ASSETS[@]}" \
            --repo "${{ github.repository }}" \
            --target "${{ github.sha }}" \
            --prerelease \
            --title "VORQEN POCO F4 munch HyperOS kernel (${TOOLCHAIN}) #${{ github.run_number }}" \
            --notes "Kernel 4.19.352-vorqen (label kosmetik, source asli 4.19.325, varian MIUI/HyperOS) + BakaSU ${KSU_LABEL} @ ${KSU_COMMIT:0:8} (kode versi ${KSU_MGR_CODE:-bawaan}; hook SUSFS Inline Hook; SUSFS: ${SUSFS_ENABLE}; DEBUG_FS: ${DEBUG_FS_ON}; fgetpriority built-in: ${FGP_ENABLE} ${FGP_COMMIT:0:8}; SELinux: ${KSU_SEL_NOTE:-tanpa fix}) + NoMount ${NOMOUNT_VERSION} built-in. Manager: APK BakaSU v4.2.0-rc3 (versionCode ${KSU_MGR_CODE}) dari https://github.com/Baka-SU/BakaSU/releases ; pasang juga metamodule NoMount ${NOMOUNT_VERSION}. Toolchain: ${TC_DESC}. SELinux: tanpa jalur disabled, enforcing ditentukan init. Belum diuji di semua build HyperOS: backup boot stock sebelum flash."
          echo "Release: https://github.com/${{ github.repository }}/releases/tag/$TAG"

      - name: Upload build log (jika gagal)
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: build-log-${{ matrix.toolchain }}
          path: |
            build.log
            prepare.log
            kernel_source/out/.config
            kernel_source/KernelSU/kernel/Kconfig
            kernel_source/KernelSU/kernel/Kbuild
            kernel_source/KernelSU/kernel/Makefile
          include-hidden-files: true
          if-no-files-found: ignore
