name: VORQEN Munch | BakaSU + SUSFS 2.4.0 + NoMount 2.3.1
# Nama yang tampil di tab Actions dan daftar workflow (hanya label, tidak mempengaruhi build).
# run-name = judul tiap run, memuat commit BakaSU yang dipakai saat Run workflow.
run-name: VORQEN Munch - BakaSU ${{ inputs.ksu_ref || 'cac1e793' }}

# Basis: liyafe1997/kernel_xiaomi_sm8250_mod (branch android15-lineage22-mod), varian MIUI/HyperOS.
# Resep build mengikuti build.sh tree tersebut (defconfig munch_defconfig, flag MIUI, patch dts panel).
# Varian AOSP TIDAK dipakai: di HyperOS driver display-nya beda dan layar jadi hitam.
#
# Root: BakaSU (Baka-SU/BakaSU), dipasang dengan resep yang sama dengan build whyred:
#   - clone PENUH (bukan setup.sh) + checkout ref (commit/tag/branch); ksu_ref kosong = ujung branch bawaan
#   - gerbang fix SELinux: commit "fix detection point caused by susfs skip commits" (AlexLiuDev233) harus ada
#     di riwayat ref yang dipakai (SUSFS melewati update latest_granting upstream; tanpa fix ini, /sys/fs/selinux/access
#     di build SUSFS bisa terdeteksi dirty-sepolicy)
#   - hook: BakaSU built-in "SUSFS Inline Hook" (CONFIG_KSU_SUSFS sebagai pilihan hook, bukan manual/tracepoint);
#     hook ksu_handle_* dipasang oleh skrip Jack (susfs_inline_hook_patches.sh, sudah di-clone step SUSFS kernel-side)
#   - SUSFS sisi-KernelSU: SUDAH bawaan BakaSU (kernel/Kconfig, feature/sucompat.c, feature/selinux_hide/*), TIDAK
#     perlu lagi patch eksternal (patch 10/11 xxKSU/tiann dibuang)
#   - selinux_hide BakaSU: fallback implementasi sendiri (my_write_context/my_write_access/my_setprocattr) untuk
#     kernel tanpa anchor susfs (patch Jack 4.19 ini termasuk), diverifikasi di step "Diagnosis SELinux/DirtySepolicy"
#   Rilis ini butuh manager BakaSU v4.2.0-rc3: pakai APK dari rilis yang sama (cek versionCode via input ksu_version_code).
#   Kode versi driver (KSU_VERSION) disamakan dengan versionCode manager lewat ksu_sync_version (default aktif).
# NoMount: v2.3.1 (maxsteeel), built-in (protokol wire v23, sama dengan v2.3.0 -> driver & modul v2.3.0/v2.3.1 saling
#   kompatibel, tapi disarankan update bersamaan). Pasang juga metamodule NoMount v2.3.1 lewat manager setelah flash.
# SUSFS bersifat opsional lewat input susfs_enable. 10 opsi SUSFS (SUS_PATH, SUS_MOUNT, SUS_KSTAT, SPOOF_UNAME, ENABLE_LOG,
#   HIDE_KSU_SUSFS_SYMBOLS, SPOOF_CMDLINE_OR_BOOTCONFIG, OPEN_REDIRECT, SUS_MAP, PRIORITY_UID_FILTER) sama dengan build whyred;
#   opsi ke-10 (filter uid prioritas, CMD 0x60030) native di patch Jack >= 38bbbd5, matikan lewat input susfs_priority_uid_filter.
# fgetpriority (aerath-stuff): menyaring sys_getpriority/setpriority/ioprio_get/ioprio_set untuk UID aplikasi lain.
#   Dibangun BUILT-IN (drivers/fgetpriority, CONFIG_FGETPRIORITY=y, find_user() noinline), sama dengan build whyred; tidak ada modul .ko.
#   Matikan lewat input fgetpriority.

on:
  workflow_dispatch:
    inputs:
      toolchain:
        description: "Toolchain: proton (bawaan tree), zyc (default, ZyCromerZ Clang 16.0.6), both (dua-duanya paralel)"
        type: choice
        options: [proton, zyc, both]
        default: zyc
      ksu_ref:
        description: "Hash commit / tag / branch BakaSU (Baka-SU/BakaSU). Default = cac1e79355ef (#674, sama dengan APK manager v4.2.0-rc3 / 35286). KOSONG = commit terbaru branch bawaan."
        type: string
        default: "cac1e79355ef451539f5c5ba9dc2bda1c64069de"
      ksu_require_selinux_fix:
        description: "Hentikan build bila commit 'fix detection point caused by susfs skip commits' (fix SELinux BakaSU) tidak ada di riwayat ref yang dipakai."
        type: boolean
        default: true
      ksu_sync_version:
        description: "Samakan angka versi driver (KSU_VERSION) dengan ksu_version_code (versionCode manager)."
        type: boolean
        default: true
      ksu_version_code:
        description: "versionCode manager BakaSU yang dipakai. Default 35286 = APK BakaSU_v4_2_0-rc3_35286."
        type: string
        default: "35286"
      build_user:
        description: "Nama pembuat yang tampil di /proc/version dan uname -v (bagian sebelum @). Default kurosakiJin."
        type: string
        default: "kurosakiJin"
      build_host:
        description: "Nama host yang tampil di /proc/version dan uname -v (bagian sesudah @). Default bankai. Pakai huruf kecil, angka, titik, atau tanda hubung, tanpa spasi."
        type: string
        default: "bankai"
      susfs_enable:
        description: "Pasang SUSFS (patch kernel 4.19 v2.4.0 + sisi BakaSU bawaan, tanpa patch eksternal). Matikan untuk build tanpa SUSFS."
        type: boolean
        default: true
      susfs_priority_uid_filter:
        description: "Nyalakan CONFIG_KSU_SUSFS_PRIORITY_UID_FILTER (filter uid pada getpriority/setpriority/ioprio, dipakai fitur hide_third_party_apps BRENE, CMD 0x60030). Default AKTIF. Matikan bila ingin tanpa hook di sys.c/ioprio.c."
        type: boolean
        default: true
      debug_fs:
        description: "Nyalakan CONFIG_DEBUG_FS (DEFAULT mati sesuai resep MIUI tree; tidak dibutuhkan KernelSU kprobes)"
        type: boolean
        default: false
      fgetpriority:
        description: "Bangun fgetpriority (aerath-stuff) sebagai BUILT-IN di kernel (menyaring getpriority/setpriority/ioprio untuk UID aplikasi lain). Default AKTIF. Tidak ada modul .ko lagi."
        type: boolean
        default: true
      fgetpriority_ref:
        description: "Commit/tag fgetpriority. Kosong = commit yang di-pin di workflow (be4ea47f)."
        type: string
        default: ""

permissions:
  contents: write   # dibutuhkan untuk membuat GitHub Release

env:
  ARCH: arm64
  SUBARCH: arm64
  KBUILD_BUILD_USER: ${{ inputs.build_user || 'kurosakiJin' }}
  KBUILD_BUILD_HOST: ${{ inputs.build_host || 'bankai' }}
  TZ: Asia/Jakarta
  NOMOUNT_VERSION: v2.3.1
  KERNEL_REPO: https://github.com/liyafe1997/kernel_xiaomi_sm8250_mod
  KERNEL_BRANCH: android15-lineage22-mod
  DEVICE: munch
  # proton = proton-clang 20210522 (bawaan build.sh tree). zyc = ZyCromerZ Clang 16.0.6 (uji).
  # Nama file asset zyc dicari otomatis lewat GitHub API: https://github.com/ZyCromerZ/Clang/releases
  ZYC_TAG: "16.0.6-20260807-release"
  # Tampilan versi kernel: 4.19.352-vorqen (label kosmetik; source asli 4.19.325)
  KERNEL_SUBLEVEL: "352"
  KERNEL_LOCALVERSION: "-vorqen"

  # --- BakaSU (Baka-SU/BakaSU), clone penuh + checkout ref; ksu_ref kosong = commit terbaru branch bawaan ---
  KSU_REPO: https://github.com/Baka-SU/BakaSU
  KSU_REF: ${{ inputs.ksu_ref || 'cac1e79355ef451539f5c5ba9dc2bda1c64069de' }}
  KSU_REQUIRE_SELINUX_FIX: ${{ inputs.ksu_require_selinux_fix == false && 'false' || 'true' }}
  KSU_SELINUX_FIX_SUBJECT: "fix detection point caused by susfs skip commits"
  KSU_SYNC_VERSION: ${{ inputs.ksu_sync_version == false && 'false' || 'true' }}
  KSU_VERSION_CODE: ${{ inputs.ksu_version_code || '35286' }}
  KSU_MANAGER_PKG: com.resukisu.resukisu
  KSU_MANAGER_CERT_SIZE: "0x377"
  KSU_MANAGER_CERT_SHA256: "d3469712b6214462764a1d8d3e5cbe1d6819a0b629791b9f4101867821f1df64"
  KSU_STEALTH: "true"
  DEBUG_FS_ON: ${{ inputs.debug_fs == true && 'true' || 'false' }}

  # fgetpriority (aerath-stuff), BUILT-IN (drivers/fgetpriority, folder kernel/ di branch default). FGP_REF = commit yang di-pin; kosongkan untuk ujung branch.
  FGP_ENABLE: ${{ inputs.fgetpriority == false && 'false' || 'true' }}
  FGP_REPO: https://github.com/aerath-stuff/fgetpriority
  FGP_REF: ${{ inputs.fgetpriority_ref || 'be4ea47fa651c80a068e477d5a3627270b7bd683' }}
  # SELinux enforcing bersih: matikan jalur SELinux disabled/boot-param.
  SELINUX_HARDEN: "true"
  # "false" = aturan sepolicy driver dipakai apa adanya (standar KernelSU: hanya domain su yang permissive).
  KSU_SEPOLICY_NO_PERMISSIVE: "false"

  # SUSFS: patch sisi kernel 4.19 v2.4.0 (non-GKI / de-inlined, NonGKI_Kernel_Build_2nd). Sisi KernelSU SUDAH bawaan
  # BakaSU (tidak ada lagi step "Setup SUSFS sisi KernelSU" seperti build xxKSU).
  SUSFS_ENABLE: ${{ inputs.susfs_enable == false && 'false' || 'true' }}
  SUSFS_PATCH_REPO: https://github.com/JackA1ltman/NonGKI_Kernel_Build_2nd
  # Patch kernel 4.19 v2.4.0 di-pin ke commit 4b0766b (Patches/Patch/susfs_patch_to_4.19.patch, repo Jack).
  # Kosongkan SUSFS_PATCH_COMMIT untuk memakai ujung (HEAD) repo Jack. Filter prioritas native sudah ada sejak 38bbbd5.
  SUSFS_PATCH_COMMIT: 4b0766bdf5d568b695dfbb19994788f14c636f2b
  # sha256 patch v2.4.0 yang kamu unggah (susfs_patch_to_4_19__2_.patch). Beda = hanya peringatan (patch Jack berubah lagi).
  SUSFS_PATCH_SHA256_EXPECT: "e3ac1fc772a1bac7e4385850e90826a41e3fd4cf16fc1868fe834eb396d3194a"
  SUSFS_PATCH_PATH: Patches/Patch/susfs_patch_to_4.19.patch
  # Skrip hook inline Jack (dipasang setelah patch kernel-side di atas), repo & path sama (satu clone dipakai bersama).
  SUSFS_INLINE_HOOK_PATH: Patches/susfs_inline_hook_patches.sh
  # Opsi SUSFS (10) yang diperiksa ada di Kconfig BakaSU (tanpa prefix CONFIG_), dipakai step "Pastikan SUSFS bawaan BakaSU lengkap".
  SUSFS_OPTS: "KSU_SUSFS KSU_SUSFS_SUS_PATH KSU_SUSFS_SUS_MOUNT KSU_SUSFS_SUS_KSTAT KSU_SUSFS_SPOOF_UNAME KSU_SUSFS_ENABLE_LOG KSU_SUSFS_HIDE_KSU_SUSFS_SYMBOLS KSU_SUSFS_SPOOF_CMDLINE_OR_BOOTCONFIG KSU_SUSFS_OPEN_REDIRECT KSU_SUSFS_SUS_MAP KSU_SUSFS_PRIORITY_UID_FILTER"
  # Tree sudah membawa SUSFS lama (v1.5.7: fs/susfs.c, sus_su.c) yang bentrok dengan v2.x. Dibuang lewat git revert.
  # Tetap dijalankan walau SUSFS baru dimatikan (jalur terbukti).
  SUSFS_REMOVE_LEGACY: "true"
  # Log kernel SUSFS (CONFIG_KSU_SUSFS_ENABLE_LOG) DINYALAKAN: SUSFS menulis log ke dmesg (`dmesg | grep -i susfs`).
  # Catatan: log ikut jalan di jalur hot (stat/open/mount/maps) dan sebelumnya dimatikan karena memicu stutter di game.
  # Kalau stutter muncul lagi, kembalikan ke "false".
  SUSFS_KERNEL_LOG: "true"
  # Filter uid prioritas (patch Jack + guard Kconfig ala susfs4ksu upstream) = opsi SUSFS ke-10. Bisa dimatikan lewat input susfs_priority_uid_filter.
  SUSFS_PRIORITY_UID_FILTER: ${{ inputs.susfs_priority_uid_filter == false && 'false' || 'true' }}

  # Jaringan (5G + WiFi): TCP bbr, power-save cfg80211 mati, opsi netfilter tambahan.
  NET_TUNE: "true"
  # IPC_LOGGING dimatikan demi RAM. Set "false" bila 5G/WiFi putus-putus dan perlu log Qualcomm.
  IPC_LOGGING_OFF: "true"
  # Default MM: swappiness 60 (default upstream) dan lru_gen min_ttl 1000 ms (rekomendasi upstream untuk beban interaktif).
  # Hanya mengubah bila polanya ditemukan di source; tidak ketemu = dilewati dengan peringatan.
  MM_TUNE: "true"
  MM_TUNE_SWAPPINESS: "60"
  MM_TUNE_LRU_GEN_MIN_TTL_MS: "1000"
  # Governor CPU default saat boot = schedutil (kebersihan saja; power-HAL menimpanya setelah boot).
  # Tabel OPP CPU/GPU dan governor GPU SENGAJA tidak disentuh (butuh profiling di perangkat).
  CPU_GOV_DEFAULT_SCHEDUTIL: "true"

jobs:
  build:
    runs-on: ubuntu-22.04   # proton-clang 2021 + host gcc 11: sama dengan lingkungan resep build.sh tree
    strategy:
      fail-fast: false
      matrix:
        toolchain: ${{ fromJSON(inputs.toolchain == 'both' && '["proton","zyc"]' || format('["{0}"]', inputs.toolchain)) }}
    env:
      TOOLCHAIN: ${{ matrix.toolchain }}
    steps:
      - name: Cleanup disk
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf /opt/hostedtoolcache/CodeQL
          df -h

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential git curl wget bison flex zip unzip bc cpio rsync \
            libssl-dev libelf-dev lz4 zstd libarchive-tools patchelf python-is-python3 \
            binutils-aarch64-linux-gnu binutils-arm-linux-gnueabi
          python --version

      - name: Setup toolchain (proton-clang 20210522 bawaan tree)
        if: matrix.toolchain == 'proton'
        run: |
          set -eo pipefail
          mkdir -p "$HOME/proton-clang"
          cd "$HOME/proton-clang"
          wget -q https://github.com/kdrag0n/proton-clang/archive/refs/tags/20210522.zip
          unzip -q 20210522.zip
          rm -f 20210522.zip
          TC="$HOME/proton-clang/proton-clang-20210522/bin"
          test -x "$TC/clang" || { echo "::error::clang tidak ditemukan di $TC"; exit 1; }
          echo "$TC" >> "$GITHUB_PATH"
          export PATH="$TC:$PATH"
          clang --version | head -1
          for t in aarch64-linux-gnu-ld arm-linux-gnueabi-ld; do
            if command -v "$t" >/dev/null 2>&1; then "$t" --version | head -1
            else echo "::warning::$t tidak ada di toolchain ini (dipasang dari paket binutils-* apt)"; fi
          done

      - name: Setup toolchain (ZyCromerZ Clang 16.0.6)
        if: matrix.toolchain == 'zyc'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eo pipefail
          mkdir -p "$HOME/zyc-clang"
          cd "$HOME/zyc-clang"
          echo "== Asset rilis ${ZYC_TAG} =="
          gh api "repos/ZyCromerZ/Clang/releases/tags/${ZYC_TAG}" --jq '.assets[].name'
          ASSET="$(gh api "repos/ZyCromerZ/Clang/releases/tags/${ZYC_TAG}" --jq '.assets[].name' | grep -E '^Clang-.*\.tar\.(gz|xz|zst)$' | head -1 || true)"
          if [ -z "$ASSET" ]; then
            echo "::error::Tidak ada asset Clang-*.tar.* di rilis ${ZYC_TAG} (lihat daftar di atas)"
            exit 1
          fi
          echo "Mengunduh: $ASSET"
          gh release download "$ZYC_TAG" --repo ZyCromerZ/Clang --pattern "$ASSET"
          mkdir -p extracted
          tar -xf "$ASSET" -C extracted
          rm -f "$ASSET"
          CLANG_BIN="$(find extracted -maxdepth 3 \( -type f -o -type l \) -name clang -path '*/bin/clang' | head -1 || true)"
          test -n "$CLANG_BIN" || { echo "::error::bin/clang tidak ditemukan setelah ekstrak"; ls extracted; exit 1; }
          TC="$(cd "$(dirname "$CLANG_BIN")" && pwd)"
          echo "$TC" >> "$GITHUB_PATH"
          export PATH="$TC:$PATH"
          clang --version | head -1
          for t in aarch64-linux-gnu-ld arm-linux-gnueabi-ld ld.lld llvm-ar; do
            if command -v "$t" >/dev/null 2>&1; then "$t" --version | head -1
            else echo "::warning::$t tidak ada di PATH"; fi
          done

      - name: Clone kernel source
        run: |
          set -eo pipefail
          git clone --depth=1 -b "$KERNEL_BRANCH" "$KERNEL_REPO" kernel_source
          git -C kernel_source log -1 --format='Source: %h %s'
          grep -E '^(VERSION|PATCHLEVEL|SUBLEVEL) ' kernel_source/Makefile
          test -f "kernel_source/arch/arm64/configs/${DEVICE}_defconfig"
          test -d kernel_source/techpack/display

      - name: Buang SUSFS lama bawaan tree (jika ada)
        if: env.SUSFS_REMOVE_LEGACY == 'true'
        working-directory: kernel_source
        run: |
          set -eo pipefail
          if [ ! -f fs/susfs.c ]; then
            echo "Tree tidak membawa SUSFS lama, tidak ada yang dibuang"
            exit 0
          fi
          echo "== SUSFS lama terdeteksi di tree =="
          ls fs/susfs.c fs/sus_su.c include/linux/susfs*.h include/linux/sus_su*.h 2>/dev/null || true
          git fetch -q --unshallow 2>/dev/null || git fetch -q --depth=100000
          PATHS="fs/susfs.c include/linux/susfs.h include/linux/susfs_def.h fs/sus_su.c include/linux/sus_su.h"
          COMMITS="$(git log --no-merges --format=%H -- $PATHS)"
          echo "== Commit yang menyentuh file SUSFS (terbaru -> terlama) =="
          git log --no-merges --format='%h %ad %s' --date=short -- $PATHS
          if [ -z "$COMMITS" ]; then
            echo "::error::Tidak ada commit yang bisa di-revert. Pakai tree/commit tanpa SUSFS, atau buang manual."
            exit 1
          fi
          git config user.name ci
          git config user.email ci@local
          for c in $COMMITS; do
            if ! git revert --no-commit "$c"; then
              CONFLICTS="$(git diff --name-only --diff-filter=U)"
              echo "== Konflik saat revert $c =="
              echo "$CONFLICTS"
              # Konflik di drivers/Kconfig & drivers/Makefile aman: pakai versi tree saat ini
              # (step Setup KernelSU menambahkan entri kernelsu lagi secara idempotent).
              BAD="$(echo "$CONFLICTS" | grep -v -E '^drivers/(Kconfig|Makefile)$' || true)"
              if [ -n "$BAD" ]; then
                git revert --abort || true
                git reset -q --hard HEAD
                echo "::error::Revert $c konflik di file penting: $BAD. Pakai tree tanpa SUSFS atau buang manual."
                exit 1
              fi
              for f in $CONFLICTS; do
                git checkout --ours -- "$f"
                git add "$f"
              done
              git revert --quit
            fi
          done
          # Sisa opsi SUSFS lama di defconfig (jika ada) dibuang; opsi yang benar diset ulang di step build.
          sed -i '/^CONFIG_KSU_SUSFS/d' "arch/arm64/configs/${DEVICE}_defconfig" || true
          if [ -e fs/susfs.c ] || grep -rqs 'CONFIG_KSU_SUSFS' fs include kernel; then
            echo "== Sisa referensi SUSFS lama =="
            grep -rn 'CONFIG_KSU_SUSFS' fs include kernel | head -40 || true
            echo "::error::Masih ada sisa SUSFS lama setelah revert."
            exit 1
          fi
          echo "::notice::SUSFS lama dibuang"

      - name: Buang hook KernelSU lama bawaan tree (total, sadar #ifdef)
        working-directory: kernel_source
        run: |
          set -eo pipefail
          # Tree liyafe1997 membawa hook KernelSU gaya lama (blok #ifdef CONFIG_KSU ... #endif) di fs/exec.c, fs/open.c,
          # fs/read_write.c, fs/stat.c, drivers/input/input.c, dll. Skrip hook Jack MELEWATI file yang sudah memuat
          # "ksu_handle", dan BakaSU menolak nama hook lama (ksu_vfs_read_hook, ksu_input_hook, ksu_execveat_hook).
          # Menghapus baris satu per satu dengan sed MERUSAK kode (extern multi-baris menggantung, "else" yatim setelah
          # "if (ksu_execveat_hook)" dihapus). Skrip di bawah membuang blok preprosesor KSU utuh dan mempertahankan cabang #else.
          # Dijalankan SEBELUM patch SUSFS supaya guard CONFIG_KSU_SUSFS_* milik SUSFS tidak ikut tersentuh (juga dikecualikan di skrip).
          echo "== Berkas tree yang menyebut KSU (SEBELUM) =="
          git grep -nE 'CONFIG_KSU|ksu_' -- '*.c' '*.h' | cut -c1-160 || echo "(tidak ada)"
          cat > /tmp/strip_ksu.py <<'PYSTRIP'
          #!/usr/bin/env python3
          # Buang hook KernelSU lama bawaan tree dari berkas C/H yang DILACAK git.
          # Semua blok #if/#ifdef/#ifndef/#elif yang kondisinya hanya bergantung pada CONFIG_KSU* dievaluasi dengan
          # CONFIG_KSU* = TIDAK DIDEFINISIKAN; cabang yang mati dibuang, cabang hidup dipertahankan, baris direktifnya dihapus.
          # Kondisi campuran (KSU + simbol lain) disederhanakan secara tri-state bila memungkinkan, selain itu dibiarkan
          # dan dilaporkan oleh pemeriksaan akhir.
          import re, subprocess, sys

          KSU = re.compile(r'\bCONFIG_KSU(?!_SUSFS)\w*')

          class Tri:
              def __init__(s, v): s.v = v
              def __and__(a, b):
                  if a.v is False or b.v is False: return Tri(False)
                  if a.v is True and b.v is True: return Tri(True)
                  return Tri(None)
              def __or__(a, b):
                  if a.v is True or b.v is True: return Tri(True)
                  if a.v is False and b.v is False: return Tri(False)
                  return Tri(None)
              def __invert__(a): return Tri(None if a.v is None else (not a.v))

          def strip_comments(c):
              c = re.sub(r'/\*.*?\*/', ' ', c)
              return re.sub(r'//.*$', ' ', c).strip()

          def evaluate(kind, cond):
              cond = strip_comments(cond)
              if kind in ('ifdef', 'ifndef'):
                  name = cond.split()[0] if cond.split() else ''
                  if not KSU.fullmatch(name): return None
                  return kind == 'ifndef'
              if not KSU.search(cond): return None
              if re.search(r'==|!=|<=|>=|<|>|\+|-|\*|/|%|\?|:', cond): return None
              e = re.sub(r'IS_(?:ENABLED|BUILTIN|MODULE|REACHABLE)\s*\(\s*CONFIG_KSU\w*\s*\)', ' \x01 ', cond)
              e = re.sub(r'defined\s*\(\s*(\w+)\s*\)', lambda m: ' \x01 ' if KSU.fullmatch(m.group(1)) else ' \x02 ', e)
              e = re.sub(r'defined\s+(\w+)', lambda m: ' \x01 ' if KSU.fullmatch(m.group(1)) else ' \x02 ', e)
              e = KSU.sub(' \x01 ', e)
              e = re.sub(r'\b[A-Za-z_]\w*\b', ' \x02 ', e)
              e = re.sub(r'\b0\b', ' \x01 ', e)
              e = re.sub(r'\b[1-9]\d*\b', ' \x03 ', e)
              e = e.replace('\x01', 'T(False)').replace('\x02', 'T(None)').replace('\x03', 'T(True)')
              e = e.replace('&&', '&').replace('||', '|')
              e = re.sub(r'!(?!=)', '~', e)
              try:
                  r = eval(e, {'T': Tri, '__builtins__': {}}).v
              except Exception:
                  return None
              return r

          DIR = re.compile(r'^\s*#\s*(if|ifdef|ifndef|elif|else|endif)\b(.*)$')

          def process(text):
              out, stack, changed = [], [], False
              def emitting():
                  return all(f['mode'] == 'unknown' or (f['mode'] == 'known' and f['active']) for f in stack)
              lines = text.split('\n')
              i = 0
              while i < len(lines):
                  line = lines[i]
                  full = line
                  while full.rstrip().endswith('\\') and i + 1 < len(lines):
                      i += 1; full = full.rstrip()[:-1] + ' ' + lines[i]
                  m = DIR.match(full)
                  if not m:
                      if emitting(): out.append(line if full is line else full)
                      i += 1; continue
                  d, rest = m.group(1), m.group(2)
                  if d in ('if', 'ifdef', 'ifndef'):
                      if not emitting():
                          stack.append({'mode': 'dead'}); i += 1; continue
                      v = evaluate(d, rest)
                      if v is None:
                          stack.append({'mode': 'unknown'}); out.append(full)
                      else:
                          stack.append({'mode': 'known', 'active': v, 'taken': v}); changed = True
                  elif d == 'elif':
                      f = stack[-1]
                      if f['mode'] == 'unknown': out.append(full)
                      elif f['mode'] == 'known':
                          if f['taken']: f['active'] = False
                          else:
                              v = evaluate('if', rest)
                              if v is None:
                                  f['mode'] = 'unknown'; out.append('#if' + rest)
                              else:
                                  f['active'] = v; f['taken'] = v
                  elif d == 'else':
                      f = stack[-1]
                      if f['mode'] == 'unknown': out.append(full)
                      elif f['mode'] == 'known':
                          f['active'] = not f['taken']; f['taken'] = True
                  else:  # endif
                      f = stack.pop()
                      if f['mode'] == 'unknown': out.append(full)
                  i += 1
              if stack: raise SystemExit('direktif tidak seimbang')
              return '\n'.join(out), changed

          def main():
              r = subprocess.run(['git', 'grep', '-lE', r'CONFIG_KSU|ksu_', '--', '*.c', '*.h'], capture_output=True, text=True)
              files = r.stdout.split()
              done = []
              for f in files:
                  t = open(f, encoding='utf-8', errors='surrogateescape').read()
                  n, ch = process(t)
                  if ch and n != t:
                      open(f, 'w', encoding='utf-8', errors='surrogateescape').write(n); done.append(f)
              print('berkas dibersihkan:', ' '.join(done) if done else '(tidak ada)')
              # pemeriksaan akhir
              bad = []
              r = subprocess.run(['git', 'grep', '-nE', r'ksu_|CONFIG_KSU', '--', '*.c', '*.h'], capture_output=True, text=True)
              for l in r.stdout.splitlines():
                  body = l.split(':', 2)[2].strip() if l.count(':') >= 2 else l
                  if body.startswith(('//', '/*', '*')): continue
                  if 'susfs' in body.lower() or 'CONFIG_KSU_SUSFS' in body: continue
                  bad.append(l)
              if bad:
                  print('::error::Masih ada hook/guard KernelSU lama di tree setelah pembersihan:')
                  print('\n'.join(bad[:60])); sys.exit(1)
              print('Tree bersih dari hook KernelSU lama')

          if __name__ == '__main__':
              main()
          PYSTRIP
          python3 /tmp/strip_ksu.py
          echo "== Ringkasan perubahan =="
          git diff --stat | tail -15 || true
          git config user.name ci; git config user.email ci@local
          git add -A; git diff --cached --quiet || git commit -q -m "Remove legacy in-tree KernelSU hooks"

      - name: Set nama versi kernel (4.19.352-vorqen)
        working-directory: kernel_source
        run: |
          set -eo pipefail
          echo "== Versi di Makefile SEBELUM =="
          grep -E '^(VERSION|PATCHLEVEL|SUBLEVEL) ' Makefile
          sed -i "s/^SUBLEVEL = .*/SUBLEVEL = ${KERNEL_SUBLEVEL}/" Makefile
          echo "== Versi di Makefile SESUDAH =="
          grep -E '^(VERSION|PATCHLEVEL|SUBLEVEL) ' Makefile

          # SUBLEVEL > 255 harus di-clamp pada LINUX_VERSION_CODE agar tidak meluap ke PATCHLEVEL.
          # Source asli sudah di .325 (>255), jadi clamp ini seharusnya sudah ada. Cek saja.
          grep -n -B1 -A4 'LINUX_VERSION_CODE' Makefile | head -20 || true
          if ! grep -n -A4 'LINUX_VERSION_CODE' Makefile | grep -q '255'; then
            echo "::warning::Clamp 255 pada LINUX_VERSION_CODE tidak terdeteksi, periksa Makefile"
          fi

          # .scmversion kosong: mencegah akhiran '+' / hash git otomatis dari setlocalversion,
          # sehingga nama versi persis seperti yang diinginkan. Hapus baris ini jika ingin akhiran '+'.
          : > .scmversion


      - name: Setup BakaSU (Baka-SU/BakaSU, commit terbaru + gerbang fix SELinux)
        working-directory: kernel_source
        run: |
          set -eo pipefail
          retry() { local n; for n in 1 2 3 4 5; do "$@" && return 0; echo "::warning::percobaan $n/5 gagal: $*"; sleep $((n*15)); done; return 1; }
          rm -rf KernelSU
          # Clone PENUH (bukan --depth): dibutuhkan untuk cek commit fix SELinux di riwayat dan describe tag.
          retry git clone -q "$KSU_REPO" KernelSU
          retry git -C KernelSU fetch -q --tags --force || true
          BR="$(git -C KernelSU symbolic-ref -q --short HEAD || true)"
          echo "Branch bawaan repo: ${BR:-?}"
          if [ -z "$KSU_REF" ]; then
            KSU_REF_NOTE="ujung branch ${BR:-bawaan} (commit terbaru)"
          elif git -C KernelSU rev-parse -q --verify "refs/tags/${KSU_REF}^{commit}" >/dev/null; then
            git -C KernelSU checkout -q "refs/tags/${KSU_REF}"; KSU_REF_NOTE="tag ${KSU_REF}"
          elif git -C KernelSU rev-parse -q --verify "${KSU_REF}^{commit}" >/dev/null; then
            git -C KernelSU checkout -q --detach "${KSU_REF}"; KSU_REF_NOTE="commit ${KSU_REF}"
          elif git -C KernelSU rev-parse -q --verify "origin/${KSU_REF}^{commit}" >/dev/null; then
            git -C KernelSU checkout -q --detach "origin/${KSU_REF}"; KSU_REF_NOTE="branch ${KSU_REF}"
          else
            echo "== Tag terbaru di repo =="; git -C KernelSU tag --sort=-creatordate | sed -n '1,25p'
            echo "== Commit terbaru =="; git -C KernelSU log -15 --format='%h %s'
            echo "::error::'${KSU_REF}' bukan tag, commit, maupun branch di ${KSU_REPO}. Kosongkan ksu_ref (ujung branch) atau isi hash commit dari run Actions BakaSU."; exit 1
          fi
          BASE="$(git -C KernelSU rev-parse HEAD)"
          TAG_NEAR="$(git -C KernelSU describe --tags --abbrev=0 2>/dev/null || echo bakasu)"
          if [ -n "$KSU_REF" ] && git -C KernelSU rev-parse -q --verify "refs/tags/${KSU_REF}^{commit}" >/dev/null 2>&1; then
            KSU_LABEL="$KSU_REF"
          else
            KSU_LABEL="${TAG_NEAR}-$(git -C KernelSU rev-parse --short=8 HEAD)"
          fi
          KSU_LABEL="$(printf '%s' "$KSU_LABEL" | tr -c 'A-Za-z0-9._-' '-')"
          echo "== BakaSU di-checkout: ${KSU_LABEL} (${BASE:0:8}) [${KSU_REF_NOTE}] =="
          echo "== 30 commit terakhir =="
          git -C KernelSU log -30 --format='%h %ad %an | %s' --date=short

          # --- Gerbang fix SELinux: commit "fix detection point caused by susfs skip commits" (AlexLiuDev233) harus ada di riwayat ---
          # SUSFS melewati update latest_granting upstream; tanpa fix ini, cek /sys/fs/selinux/access di build SUSFS terdeteksi.
          FIXC="$(git -C KernelSU log -i -F --grep="$KSU_SELINUX_FIX_SUBJECT" --format='%h %an | %s' HEAD | head -3)"
          if [ -n "$FIXC" ]; then
            FIXH="$(echo "$FIXC" | head -1 | cut -d' ' -f1)"
            echo "OK      fix SELinux ada di riwayat: $FIXC"
            git -C KernelSU show --stat --format='%h %s' "$FIXH" | head -20
            SEL_NOTE="fix SELinux ${FIXH}"
          elif [ "$KSU_REQUIRE_SELINUX_FIX" = "true" ]; then
            echo "::error::Commit fix SELinux ('${KSU_SELINUX_FIX_SUBJECT}') TIDAK ada di riwayat ${KSU_LABEL}. Kosongkan ksu_ref (ujung branch) atau pakai commit yang lebih baru; atau matikan ksu_require_selinux_fix."; exit 1
          else
            echo "::warning::Commit fix SELinux tidak ditemukan di riwayat ${KSU_LABEL} (diizinkan lewat ksu_require_selinux_fix=false)"
            SEL_NOTE="tanpa fix SELinux"
          fi
          echo "== Commit terbaru yang menyentuh kernel/selinux =="
          git -C KernelSU log -8 --format='%h %ad %an | %s' --date=short -- kernel/selinux || true

          # --- Kecocokan driver <-> manager ---
          # 1) UAPI: bandingkan header sisi kernel (KernelSU/kernel/...) dengan header userspace (di luar KernelSU/kernel/).
          UAPI_K=""; UAPI_U=""
          for f in $(grep -rlE 'KERNEL_SU_UAPI_VERSION' KernelSU --include='*.h' 2>/dev/null); do
            v="$(grep -oE 'KERNEL_SU_UAPI_VERSION[^0-9]*[0-9]+' "$f" | grep -oE '[0-9]+$' | head -1)"
            echo "UAPI: $f = ${v:-?}"
            [ -n "$v" ] || continue
            case "$f" in KernelSU/kernel/*) UAPI_K="${UAPI_K:-$v}" ;; *) UAPI_U="${UAPI_U:-$v}" ;; esac
          done
          echo "== UAPI: driver(kernel)=${UAPI_K:-?} manager/ksud(userspace)=${UAPI_U:-?} =="
          if [ -n "$UAPI_K" ] && [ -n "$UAPI_U" ] && [ "$UAPI_K" != "$UAPI_U" ]; then
            echo "::error::UAPI driver (${UAPI_K}) beda dengan manager/ksud (${UAPI_U}); manager tidak akan mau memakai driver ini."; exit 1
          fi
          # BakaSU baru: header UAPI hanya ada di KernelSU/uapi (dipakai bersama driver, ksud, dan manager), tidak ada salinan di kernel/.
          if [ -z "$UAPI_K" ] && [ -n "$UAPI_U" ]; then
            if grep -qE 'uapi' KernelSU/kernel/Kbuild KernelSU/kernel/Makefile 2>/dev/null \
               || grep -rqE '#[[:space:]]*include[[:space:]]*[<"].*uapi/supercall\.h' KernelSU/kernel --include='*.c' --include='*.h' 2>/dev/null; then
              UAPI_K="$UAPI_U"
              echo "OK      UAPI bersama (KernelSU/uapi): driver, ksud, dan manager sama-sama v${UAPI_U}"
            fi
          fi
          [ -n "$UAPI_K" ] || echo "::warning::header UAPI sisi-kernel tidak ditemukan; cek UAPI dilewati"

          # 2) Tanda tangan: sertifikat APK BakaSU v4.2.0-rc3 (CN=ReSukiSU, size 0x377) harus dikenali driver.
          if grep -rqiE "$KSU_MANAGER_CERT_SHA256" KernelSU/kernel 2>/dev/null; then
            echo "OK      driver memuat sertifikat manager BakaSU (size ${KSU_MANAGER_CERT_SIZE}, sha256 ${KSU_MANAGER_CERT_SHA256:0:16}...)"
          else
            echo "::warning::sertifikat manager (sha256 ${KSU_MANAGER_CERT_SHA256:0:16}...) tidak tertanam di kernel/ BakaSU. Bila BakaSU memakai 'dynamic manager', manager harus didaftarkan lewat ksud/pengaturan; bila tidak, manager akan ditolak driver."
          fi
          if grep -rqF "$KSU_MANAGER_PKG" KernelSU/kernel 2>/dev/null; then
            echo "OK      nama paket ${KSU_MANAGER_PKG} muncul di kernel/ BakaSU"
          else
            echo "(nama paket ${KSU_MANAGER_PKG} tidak muncul di kernel/; wajar bila driver hanya memeriksa tanda tangan)"
          fi

          # 3) Versi: samakan angka versi driver dengan versionCode manager (APK BakaSU v4.2.0-rc3 = 35286).
          CODE="$KSU_VERSION_CODE"
          case "$CODE" in ''|*[!0-9]*) echo "::error::ksu_version_code harus angka (dapat: '$CODE')"; exit 1 ;; esac
          VPAT='(^|[[:space:]])(override[[:space:]]+)?KSU_VERSION[[:space:]]*[:?]?=|DKSU_VERSION='
          VFILES="$(grep -rlE "$VPAT" KernelSU/kernel --include=Kbuild --include=Makefile --include='*.mk' 2>/dev/null || true)"
          echo "== Definisi KSU_VERSION di BakaSU (SEBELUM) =="
          for f in $VFILES; do echo "--- $f"; grep -nE "$VPAT" "$f"; done
          DRV_FINAL="tidak diubah"
          if [ "$KSU_SYNC_VERSION" = "true" ]; then
            [ -n "$VFILES" ] || echo "::warning::definisi KSU_VERSION tidak ditemukan di Kbuild/Makefile BakaSU; versi driver tidak bisa disamakan (cek log 'Verifikasi versi' setelah build)"
            for f in $VFILES; do
              if grep -qE 'KSU_VERSION[[:space:]]*[:?]?=.*\\$' "$f"; then
                echo "::warning::$f: definisi KSU_VERSION berlanjut ke baris berikutnya (\\), dilewati supaya tidak merusak file"; continue
              fi
              b="$(sha256sum "$f" | cut -c1-16)"
              sed -i -E "s/DKSU_VERSION=[0-9]+/DKSU_VERSION=${CODE}/g; s/^([[:space:]]*(override[[:space:]]+)?KSU_VERSION[[:space:]]*[:?]?=).*\$/\1 ${CODE}/" "$f"
              a="$(sha256sum "$f" | cut -c1-16)"
              [ "$a" != "$b" ] && DRV_FINAL="$CODE"
            done
            echo "== Definisi KSU_VERSION di BakaSU (SESUDAH) =="
            for f in $VFILES; do echo "--- $f"; grep -nE "$VPAT" "$f"; done
            if [ "$DRV_FINAL" = "$CODE" ]; then
              echo "::notice::Versi driver disamakan dengan manager: ${CODE}"
            else
              echo "::warning::tidak ada baris KSU_VERSION yang berubah; versi driver mungkin tetap dihitung otomatis dari git"
            fi
          fi

          # BakaSU menghitung versi drivernya sendiri lewat `git describe --dirty` DI DALAM repo KernelSU/ (clone
          # terpisah dari tree kernel luar). sed di atas (dan setiap edit lain ke dalam folder ini) meninggalkan
          # working tree KernelSU/ belum ter-commit, sehingga manager menampilkan akhiran "-dirty" pada
          # "Kernel driver version" walau build dan fungsinya normal. Commit di sini (lokal, hanya di repo
          # KernelSU/, tidak memengaruhi upstream) supaya git describe tidak lagi melihat perubahan.
          git -C KernelSU config user.name "ci"
          git -C KernelSU config user.email "ci@local"
          if ! git -C KernelSU diff-index --quiet HEAD --; then
            git -C KernelSU add -A
            git -C KernelSU commit -q -m "ci: sync KSU_VERSION with manager versionCode ${CODE}"
            echo "::notice::KernelSU/ di-commit lokal supaya 'git describe --dirty' bersih (versi driver tidak lagi berakhiran -dirty)"
          else
            echo "KernelSU/ sudah bersih, tidak ada yang perlu di-commit"
          fi
          {
            echo "KSU_MGR_CODE=${CODE}"
            echo "KSU_DRV_VERSION=${DRV_FINAL}"
            echo "KSU_LABEL=${KSU_LABEL}"
            echo "KSU_COMMIT=${BASE}"
            echo "KSU_SEL_NOTE=${SEL_NOTE}"
            echo "KSU_HOOK_SYM=KSU_SUSFS"
          } >> "$GITHUB_ENV"

          test -d KernelSU/kernel
          ln -sfn ../KernelSU/kernel drivers/kernelsu
          grep -q 'kernelsu' drivers/Makefile \
            || printf '\nobj-$(CONFIG_KSU) += kernelsu/\n' >> drivers/Makefile
          grep -q 'drivers/kernelsu/Kconfig' drivers/Kconfig \
            || sed -i '/^endmenu/i source "drivers/kernelsu/Kconfig"' drivers/Kconfig
          test -L drivers/kernelsu
          test -f drivers/kernelsu/Kconfig
          { test -f drivers/kernelsu/Makefile || test -f drivers/kernelsu/Kbuild; } \
            || { echo "::error::drivers/kernelsu tidak punya Makefile maupun Kbuild"; ls drivers/kernelsu | head -40; exit 1; }
          echo "== Opsi Kconfig BakaSU =="
          grep -RhE '^[[:space:]]*config ' KernelSU/kernel --include='Kconfig*' || true
          echo "::notice::BakaSU ${KSU_LABEL} (commit ${BASE:0:8}), ${SEL_NOTE}. Driver v${DRV_FINAL} UAPI ${UAPI_K:-?}; manager: APK BakaSU v4.2.0-rc3 (versionCode ${CODE})."

          # ---------------------------------------------------------------------------
          # Tree liyafe1997 membawa hook sumber bawaan (gaya KernelSU lama) di fs/, kernel/, drivers/, dst.
          # xxKSU memasang hook sendiri (LSM + branch-link / syscall-table), jadi hook lama tree harus tidak ikut dikompilasi:
          # semua guard CONFIG_KSU di file C/H milik tree dialihkan. git grep hanya memeriksa file milik tree
          # (KernelSU/ dan NoMount/ belum di-track, dan symlink tidak diikuti).
          # ---------------------------------------------------------------------------
          TREE_HOOK_FILES="$(git grep -lE 'CONFIG_KSU|ksu_' -- '*.c' '*.h' || true)"
          echo "== File tree yang menyebut KSU =="
          echo "${TREE_HOOK_FILES:-(tidak ada)}"
          if [ -n "$TREE_HOOK_FILES" ]; then
            echo "== Baris KSU di file tree (SEBELUM) =="
            git grep -nE 'CONFIG_KSU|ksu_' -- $TREE_HOOK_FILES | head -80 || true
            perl -pi -e 's/^(\s*#\s*(?:if|ifdef|ifndef|elif)\b.*?)\bCONFIG_KSU\b/$1CONFIG_KSU_TREE_HOOK_DISABLED/' $TREE_HOOK_FILES
            echo "== Guard yang dialihkan =="
            git grep -c 'CONFIG_KSU_TREE_HOOK_DISABLED' -- $TREE_HOOK_FILES || true
          fi
          echo "== Sisa referensi KSU di file tree (SESUDAH, di luar guard yang dialihkan) =="
          git grep -nE 'CONFIG_KSU\b|ksu_' -- '*.c' '*.h' | grep -v 'CONFIG_KSU_TREE_HOOK_DISABLED' | head -60 || true

          echo "::notice::Hook sumber tree dinonaktifkan; BakaSU ${KSU_REF} @ ${KSU_COMMIT:0:8} memakai hooknya sendiri (SUSFS Inline Hook)"

      - name: Pastikan SUSFS bawaan BakaSU lengkap (tanpa patch sisi-KernelSU eksternal)
        if: ${{ env.SUSFS_ENABLE == 'true' }}
        working-directory: kernel_source
        run: |
          set -eo pipefail
          # Patch 10 (tiann) dan patch 11 (yapixel/xxKSU) TIDAK dipakai lagi. Sisi-KernelSU SUSFS sudah ada di dalam BakaSU
          # (kernel/Kconfig, feature/sucompat.c, feature/selinux_hide/*, runtime/*), dan dijaga mengikuti simonpunk oleh
          # commit BakaSU sendiri ("sync with latest susfs", "fix detection point caused by susfs skip commits").
          grep -RqE '^[[:space:]]*config[[:space:]]+KSU_SUSFS[[:space:]]*$' KernelSU/kernel --include='Kconfig*' \
            || { echo "::error::BakaSU ${KSU_LABEL} tidak punya opsi KSU_SUSFS di Kconfig-nya. Pakai ref BakaSU yang memuat SUSFS."; exit 1; }
          MISS=""
          for o in $SUSFS_OPTS; do
            grep -RqE "^[[:space:]]*config[[:space:]]+${o}[[:space:]]*\$" KernelSU/kernel --include='Kconfig*' || MISS="$MISS $o"
          done
          [ -z "$MISS" ] || { echo "::error::opsi SUSFS ini tidak ada di Kconfig BakaSU ${KSU_LABEL}:${MISS}"; exit 1; }
          echo "SUSFS_GLUE=bawaan-BakaSU+hook-Jack" >> "$GITHUB_ENV"
          echo "::notice::Semua opsi SUSFS ada di Kconfig BakaSU ${KSU_LABEL}; tidak ada patch sisi-KernelSU eksternal."

      - name: Cek kecocokan manager vs driver BakaSU
        working-directory: kernel_source
        run: |
          set +e
          echo "Sumber         : ${KSU_REPO} @ ${KSU_LABEL} (${KSU_COMMIT:0:8})"
          echo "Versi driver   : ${KSU_MGR_CODE} (sinkron manager: ${KSU_SYNC_VERSION}), hook: SUSFS Inline Hook (CONFIG_KSU_SUSFS)"
          echo "Manager        : pasang APK BakaSU v4.2.0-rc3 (versionCode ${KSU_VERSION_CODE}) dari https://github.com/Baka-SU/BakaSU/releases"
          echo "NoMount        : kernel ${NOMOUNT_VERSION} butuh metamodule NoMount ${NOMOUNT_VERSION} (update bersamaan, lalu reboot)"
          exit 0

      - name: Setup SUSFS (patch kernel 4.19 v2.4.0)
        if: env.SUSFS_ENABLE == 'true'
        working-directory: kernel_source
        run: |
          set -eo pipefail

          # Patch diambil lewat git (di-pin ke commit), bukan URL raw.
          rm -rf /tmp/susfs-src && mkdir -p /tmp/susfs-src
          git -C /tmp/susfs-src init -q
          git -C /tmp/susfs-src remote add origin "$SUSFS_PATCH_REPO"
          git -C /tmp/susfs-src fetch -q --depth 1 origin "${SUSFS_PATCH_COMMIT:-HEAD}"
          git -C /tmp/susfs-src checkout -q FETCH_HEAD
          SUSFS_PATCH_COMMIT="$(git -C /tmp/susfs-src rev-parse HEAD)"
          echo "SUSFS_PATCH_COMMIT=${SUSFS_PATCH_COMMIT}" >> "$GITHUB_ENV"
          echo "== Commit patch Jack: ${SUSFS_PATCH_COMMIT} =="
          # Patch kernel-side TIDAK diambil dari clone: commit 4b0766b (sha eee7b1bb) belum punya CMD_SUSFS_SET_SUS_PATH_UID_FILTER
          # yang dipakai supercall/dispatch.c BakaSU (build gagal: "use of undeclared identifier"). Dipakai patch Jack terbaru
          # (susfs_patch_to_4_19.patch, sha256 e3ac1fc7...) yang tertanam di bawah. Clone Jack tetap dipakai untuk skrip hook inline.
          mkdir -p /tmp/susfs-patch
          PATCH_FILE="/tmp/susfs-patch/susfs_patch_to_4.19.patch"
          base64 -d <<'B64' | xz -dc > "$PATCH_FILE"
          /Td6WFoAAATm1rRGAgAhARwAAAAQz1jM4rlIbLFdADIaSQnC/BF9UN4KT0fV3KCo8L2mudeHdmyQhNSO2xXIozdpS4WG+Mwiiw1V96pIramQ
          q5jbXnXwbGoCBDHLP4x6uaFbFSgvwUotHdgo/UGv3/tOnQ+00MS0QlXoHW/Mafod15PnEeWQulh1uewa2OHzsCqUgaSfso3HdwrpTtCg06dL
          p3E7z49WgrWXAFB3MzmXN4R0DH8M6yLZZUfTwgrlGtBrkUczHbls85AMc0DQuRFMKgmj7y1PYZ2v6Ih6svD6QWDtNShUtNFFJWN40a7ZX8Jd
          czcG7Tve2g9i/jX2k+rL1V6sqpxdHzU6XELJLkPxF9Xz/+D7NMXwpXeHgyGuAokNRONDbTAKG9e0141ZICg69Vju+cWPj1Vn2tL1juOgT2CU
